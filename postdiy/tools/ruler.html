   use:["<b>学新东西：</b>每隔两年逼自己学一项新技能，防存量。","<b>消费：</b>买之前问'这是我需要的，还是怕人看不起'。","<b>管时间：</b>把刷手机的时间换成睡够、练够。","<b>教育：</b>别让孩子为了面子学一堆他不喜欢的东西。"]},
  {q:"自我觉醒有哪三大标志？", a:["接受无常","停止辩解","向内归因"], n:["接受变化","不再争","从自己找原因"],
   t:"一场车祸之后", scene:"成熟与反思", p:[
    "① <b>接受无常</b>：断了两根肋骨，他没问'为什么是我'，只说'还好命还在'。",
    "② <b>停止辩解</b>：病友误会他插队，他笑了笑没解释。",
    "③ <b>向内归因</b>：出院后没怪司机没怪医院，只复盘'我当时为什么没看路'。"
   ], hook:"所有的成长，都从承认'是我的问题'开始。",
   use:["<b>遇挫：</b>先别急着怪环境、怪别人，问自己能改什么。","<b>被误解：</b>懂你的人不用解释，不值得的人不必解释。","<b>过日子：</b>接受计划会变、人会变、事会翻盘，心态才稳。","<b>复盘：</b>每次出问题先写三条自己的原因。"]},
  {q:"博弈取胜有哪三大原则？", a:["守底线","知进退","留后手"], n:["有原则","懂取舍","有准备"],
   t:"围棋国手的一盘棋", scene:"竞争与谈判", p:[
    "① <b>守底线</b>：对手故意让一子想诱他违规，他没动，守着规矩下到最后一手。",
    "② <b>知进退</b>：眼看右下角要丢，果断弃三子，转头占了整条大龙。",
    "③ <b>留后手</b>：最后十手藏着一手'打劫'的活棋，对手算到崩溃。"

   use:["<b>谈条件：</b>提前想好哪条线绝对不让。","<b>做生意：</b>亏损项目该砍就砍，别指望翻盘。","<b>下决定：</b>每个方案都准备一个'如果失败怎么办'。","<b>过招：</b>手里永远捏着一张对方不知道的牌。"]},
  {q:"欲望有哪三层边界？", a:["生存所需","虚荣所求","无底执念"], n:["刚需","攀比","上瘾"],
   t:"同一条自助餐队伍", scene:"消费与知足", p:[
    "① <b>生存所需</b>：第一个人取一盘肉一盘菜，吃饱就走。",
    "② <b>虚荣所求</b>：第二个端了四盘，其实吃不下，只因为'别人都拿了这么多'。",
    "③ <b>无底执念</b>：第三个来回跑七趟，撑到吐还舍不得走。"
   ], hook:"够了就停是本事，贪得无厌是病。",
   use:["<b>消费：</b>买之前分清楚'我需要'还是'别人都有'。","<b>目标：</b>把真正想要的写下来，别被欲望带着跑。","<b>节制：</b>吃到七分饱，赚到够用的就停手。","<b>育儿：</b>别让孩子什么都要、什么都有。"]},
  {q:"筛选伙伴有哪三大标准？", a:["靠谱","利他","长期主义"], n:["靠得住","肯让利","看得远"],
   t:"合伙创业的第三年", scene:"合作与交友", p:[
    "① <b>靠谱</b>：一个合伙人从不迟到、从不漏事，承诺都兑现。",
    "② <b>利他</b>：分钱时他主动少拿两成，说'明年还要靠大家'。",
    "③ <b>长期主义</b>：第五年风口过了，团队里只有他没走，还在熬。"
   ], hook:"能共苦的人不一定能同甘，能熬过冬天的人才值得一起等春天。",
   use:["<b>选合伙人：</b>先共事一次小事，看他靠不靠谱。","<b>交朋友：</b>愿意把资源分给你的，才值得深交。","<b>团队：</b>留下那些在低谷时没走的人。","<b>择偶：</b>愿意一起熬、肯为对方牺牲的人，才是长期主义。"]},
  {q:"万物运行有哪三大底层法则？", a:["平衡","代偿","周期"], n:["此消彼长","有失有得","盛极必衰"],
   t:"一座老农的菜园", scene:"判断与决策", p:[
    "① <b>平衡</b>：今年种豆子赚得多，明年就少种点，轮着种别的。",
    "② <b>代偿</b>：有块地连年歉收，土却养肥了，后年大丰收。",
    "③ <b>周期</b>：种了三十年菜，他见过行情上天，也见过价格砸到地里。"
   ], hook:"涨得越疯摔得越狠，失的会以别的方式回来。",
   use:["<b>投资：</b>暴涨之后要减仓，暴跌之后要敢买。","<b>工作：</b>一门心思搞事业时，别把身体和家庭全赔进去。","<b>看行业：</b>所有风口都有周期，别在最高点冲进去。","<b>养身：</b>年轻时透支的，中年都会找你要回来。"]},

  {q:"情绪稳定有哪三大支柱？", a:["接纳","抽离","释怀"], n:["允许情绪","跳出情绪","放下情绪"],
   t:"风暴里的老船长", scene:"情绪管理", p:[
    "① <b>接纳</b>：十级风里年轻水手发抖，老船长说'怕是正常的，我也怕'。",
    "② <b>抽离</b>：他走到船舱外点根烟，远远看着自己的船在浪里翻腾，像看别人的事。",
    "③ <b>释怀</b>：风停后他收拾残局，没再提那场风暴一句。"
   ], hook:"情绪这东西，你越对抗它越强，你一松手它就没了。",
   use:["<b>发火前：</b>先承认'我现在很生气'，气就消一半。","<b>焦虑时：</b>想象自己站在五楼看楼下的自己，距离感能降温。","<b>翻旧账：</b>过去的伤反复讲只会反复疼。","<b>育儿：</b>教孩子说出感受，而不是压着。"]},
  {q:"拉开人与人差距的三件事是什么？", a:["复盘","深耕","耐心"], n:["回头看","钻得深","等得起"],
   t:"同门的两个厨师", scene:"自我提升", p:[
    "① <b>复盘</b>：打烊后一个刷手机，一个回想今天哪道菜咸了、哪个客人皱了眉。",
    "② <b>深耕</b>：第二年那个爱回想的只做一道红烧肉，糖色炒到分秒不差。",
    "③ <b>耐心</b>：第五年他的红烧肉成了城里一绝，有人出三倍工资挖他，他没走。"
   ], hook:"复盘让人少走弯路，深耕让人无可替代，耐心让人等来结果。",
   use:["<b>每天：</b>睡前十分钟回想今天哪件事可以做得更好。","<b>选方向：</b>与其什么都学，不如把一个技能练到前 10%。","<b>坚持：</b>给自己定三年以上的周期，别按月算。","<b>带人：</b>逼下属写复盘，比培训更管用。"]},
  {q:"弱者有哪三大思维死局？", a:["等靠要","怨天尤人","玻璃心"], n:["不主动","怪别人","一碰就碎"],
   t:"山脚下等救援的三个人", scene:"心态与行动", p:[
    "① <b>等靠要</b>：山上起火，第一个人坐着等消防队，自己连水都不愿提。",
    "② <b>怨天尤人</b>：等不到救援，他骂天、骂政府、骂队友。",
    "③ <b>玻璃心</b>：队友递给他一瓶水说'你怎么不早点跑'，他当场哭了。"
   ], hook:"不是火困住你，是你自己困住自己。",
   use:["<b>遇事：</b>先问'我现在能做什么'，别等别人来救。","<b>吐槽：</b>抱怨有用就去解决，没用就闭嘴。","<b>抗压：</b>把'他是不是针对我'换成'这件事怎么办'。","<b>育儿：</b>别替孩子把什么都安排好，让他自己扛一点。"]},
  {q:"高手破局有哪三种路径？", a:["换赛道","升认知","降欲望"], n:["换个方向","换个脑子","少要点"],
   t:"一条河挡住了去路", scene:"困境与破局", p:[
    "① <b>换赛道</b>：没硬闯，沿河边走了两里地找到一座旧桥。",
    "② <b>升认知</b>：走过去后想'其实不过河也行，目的地在哪儿都可以'。",
    "③ <b>降欲望</b>：实在过不去，就在河边搭了间茅屋，日子竟也清静。"

   use:["<b>职业瓶颈：</b>升不上去，就换个行业、换个岗位、换个城市。","<b>焦虑：</b>有些事不是你不行，是你想要的太多。","<b>买房：</b>预算不够就降预期，住得下、通勤短就行。","<b>吵架：</b>换个角度看，这事儿可能根本不值得吵。"]},
  {q:"社交的三大真相是什么？", a:["价值互换","距离感","分寸感"], n:["等价交换","别太近","懂进退"],
   t:"一场同学会", scene:"人际关系", p:[
    "① <b>价值互换</b>：散场后还联系的人，都是能互相帮忙、互相介绍资源的。",
    "② <b>距离感</b>：最铁的那对兄弟，一个月也见不了一次面。",
    "③ <b>分寸感</b>：饭桌上没人问收入、没人催婚、没人问孩子成绩。"
   ], hook:"社交的本质是交换，最好的关系都留着分寸。",
   use:["<b>交友：</b>先想自己能给对方什么，别只想着索取。","<b>维持关系：</b>别天天腻在一起，有距离才长久。","<b>聊天：</b>不问收入、婚育、体重这三件事。","<b>求人：</b>先给好处再开口，成功率高一倍。"]},
  {q:"读书有哪三层收获？", a:["知事","识人","观己"], n:["长知识","懂人性","看清自己"],
   t:"三个人读《三国演义》", scene:"阅读与学习", p:[
    "① <b>知事</b>：小孩记住了桃园三结义、草船借箭。",

    "③ <b>观己</b>：创业者读到'出师未捷身先死'，想起自己半途而废的项目，合上书哭了。"
   ], hook:"最高级的阅读，是读到自己。",
   use:["<b>选书：</b>知识不够就读工具书，看人不准就读人物传记。","<b>读书：</b>边读边想'这说的像不像我'，才有用。","<b>教人：</b>把书里的道理讲给别人听，才是真懂。","<b>育儿：</b>别只让孩子记知识点，多问'你觉得这个人做得对不对'。"]},
  {q:"贫穷有哪三重枷锁？", a:["眼界","胆量","负债"], n:["看不远","不敢闯","背着债"],
   t:"镇上两个卖早点的", scene:"经济与机会", p:[

   use:["<b>破局：</b>先想办法走出去看看更大的世界。","<b>创业：</b>该下的注要敢下，但别借钱赌。","<b>理财：</b>第一件事是清掉高息负债，比赚钱更急。","<b>教育：</b>带孩子多见世面，眼界能破代际穷。"]},
  {q:"自由有哪三个前提？", a:["自律","底气","选择权"], n:["管得住","有资本","能决定"],
   t:"那个说走就走的人", scene:"生活方式", p:[

    "③ <b>选择权</b>：想走就走，想住下就住下，没人问他为什么。"
   ], hook:"自由不是想干什么就干什么，是不想干什么就能不干什么。",
   use:["<b>攒钱：</b>存够六个月生活费，你说话的底气都不一样。","<b>管时间：</b>能管住每天的人，才管得住人生。","<b>做选择：</b>别把所有路堵死，永远留一条退路。","<b>带人：</b>给别人选择权，比替别人决定更得人心。"]},
  {q:"谎言有哪三种形态？", a:["客套","自保","算计"], n:["场面话","怕受罚","有目的"],
   t:"一场饭局上的三句话", scene:"沟通与识人", p:[
    "① <b>客套</b>：老王举杯说'以后常聚'，其实明天就飞北京。",

    "③ <b>算计</b>：小张拍胸脯说'这项目我一个人扛'，心里早算好要借全组的力。"
   ], hook:"客套是润滑剂，自保是人之常情，算计才是真要防的。",
   use:["<b>听人说话：</b>场面话左耳进右耳出，别当真。","<b>自己说话：</b>做不到的事别把话说满。","<b>防骗：</b>把话说得越漂亮、越满的，越要多留个心眼。","<b>社交：</b>学会得体地客套，也是一种修养。"]},
  {q:"成熟有哪三个信号？", a:["不解释","不讨好","不期待"], n:["懒得辩","不卑微","不指望"],
   t:"中年以后的老张", scene:"为人处世", p:[

    "③ <b>不期待</b>：帮了别人二十年，今年第一次说'我也有难处'。"
   ], hook:"不解释、不讨好、不期待，换来的是一身轻松。",
   use:["<b>被误解：</b>时间会替你说清楚，急什么。","<b>社交：</b>不再为了合群勉强自己。","<b>付出：</b>帮忙前先想好，没回报我能不能接受。","<b>心态：</b>期待是痛苦的种子，少种一点。"]},
  {q:"机会有哪三个特征？", a:["藏在风险里","藏在冷门里","藏在变化里"], n:["险处藏机","冷门出头","变中取胜"],
   t:"大地震后的小城", scene:"机会识别", p:[
    "① <b>藏在风险里</b>：震后第三天所有人都往外跑，只有一个五金店老板往回走，押上全部身家囤水泥钢筋。",
    "② <b>藏在冷门里</b>：别人都抢救灾物资的生意，他只做修屋顶，两年后成了全城最大防水工程商。",
    "③ <b>藏在变化里</b>：城里重建完游客来了，他第一个开了民宿。"
   ], hook:"所有人怕的地方才有最大的机会，所有人都挤的地方只剩红海。",
   use:["<b>找风口：</b>去别人不敢去的领域看看。","<b>选赛道：</b>冷门不等于没市场，可能是没人发现。","<b>应变：</b>行业一变天，先想谁会需要什么新东西。","<b>避险：</b>别跟大众一起恐慌性抛售或抢购。"]},
  {q:"失败有哪三大诱因？", a:["轻敌","浮躁","短视"], n:["太自信","沉不住","只看眼前"],
   t:"一个天才的坠落", scene:"项目管理", p:[
    "① <b>轻敌</b>：第一次做项目就大获成功，从此谁的意见都听不进。",

   ], hook:"上一次的赢，是下一次输的开始。",
   use:["<b>顺境：</b>越顺越要警惕，多听反面意见。","<b>扩张：</b>根基没稳就想盖楼，楼必塌。","<b>财务：</b>永远留够一年的现金流再谈增长。","<b>带人：</b>别让刚打胜仗的团队立刻接大项目。"]},
  {q:"自律有哪三大敌人？", a:["即时满足","环境诱惑","自我妥协"], n:["贪图快","周围乱","对自己松"],
   t:"宿舍里那个考证的男生", scene:"习惯养成", p:[
    "① <b>即时满足</b>：书翻两页手机震一下，一划就是三小时。",

    "③ <b>自我妥协</b>：'今天太累了，明天补回来'，说了一百遍只补回来一次。"

   use:["<b>戒手机：</b>直接把手机放到另一个房间。","<b>选环境：</b>想学习就去图书馆，别在宿舍硬撑。","<b>定规则：</b>每天只要求做一点点，但一次都不能断。","<b>育儿：</b>别在孩子面前刷手机。"]},
  {q:"经营自己有哪三个方向？", a:["身体","脑子","口碑"], n:["本钱","工具","名片"],
   t:"同一个班的三十年", scene:"个人成长", p:[

  {q:"靠谱有哪三个证明？", a:["凡事有交代","件件有着落","事事有回音"], n:["会反馈","能落地","有结果"],

  {q:"内耗有哪三大来源？", a:["过度思考","害怕冲突","总想讨好"], n:["想太多","不敢争","怕人嫌"],

  {q:"焦虑有哪三大病根？", a:["想得多","做得少","对比多"], n:["脑过载","手太慢","总攀比"],

  {q:"规则有哪两种形态？", a:["明面上的律法","暗地里的人性"], n:["写在纸上","写在心里"],

  {q:"取舍有哪三个标准？", a:["价值大小","成本高低","是否符合长期目标"], n:["值不值","费不费","远不远"],

const list = document.getElementById('list');
const groups = [];
for (let i = 0; i < data.length; i += 20) groups.push(data.slice(i, i + 20));

function render(items) {
  list.innerHTML = '';
  if (!items.length) { list.innerHTML = '<div class="empty">没有找到相关内容</div>'; return; }
  let start = 0;
  const map = new Set(items);
  groups.forEach(g => {
    const chunk = g.filter(it => map.has(it));
    if (!chunk.length) { start += g.length; return; }
    const t = document.createElement('div');
    t.className = 'group-title';
    t.textContent = `第 ${start + 1}–${start + g.length} 条`;
    list.appendChild(t);
    chunk.forEach(it => {
      const idx = data.indexOf(it) + 1;
      const div = document.createElement('div');
      div.className = 'item';
      let lines = '';
      it.a.forEach((text, i) => {
        lines += `<div class="a-line"><span class="tag">${i + 1}.</span>${text}：<span class="note">${it.n[i]}</span></div>`;
      });
      let story = '';
      if (it.t && it.p && it.p.length) {
        story = `<div class="block story"><div class="story-title">🎬 故事锚点 · ${it.t}（${it.scene || '真实场景'}）</div>`;
        it.p.forEach(seg => { story += `<p>${seg}</p>`; });
        story += `<p class="hook">💡 ${it.hook}</p></div>`;
      }
      let apply = '';
      if (it.use && it.use.length) {
        apply = `<div class="block apply"><div class="apply-title">🛠 这条能用在哪</div>`;
        it.use.forEach(seg => { apply += `<p>${seg}</p>`; });
        apply += `</div>`;
      }
      div.innerHTML = `
        <div class="q">
          <span class="num">${String(idx).padStart(2, '0')}</span>
          <span class="q-text">${it.q}</span>
          <span class="arrow">›</span>
        </div>
        <div class="a"><div class="a-inner">${lines}${story}${apply}</div></div>`;
      div.querySelector('.q').addEventListener('click', () => {
        const wasOpen = div.classList.contains('open');
        document.querySelectorAll('.item.open').forEach(o => o.classList.remove('open'));
        if (!wasOpen) div.classList.add('open');
      });
      list.appendChild(div);
    });
    start += g.length;
  });
}
render(data);

let allOpen = false;
document.getElementById('toggleAll').addEventListener('click', e => {
  allOpen = !allOpen;
  document.querySelectorAll('.item').forEach(o => o.classList.toggle('open', allOpen));
  e.target.textContent = allOpen ? '收起全部' : '展开全部';
});
document.getElementById('search').addEventListener('input', e => {
  const kw = e.target.value.trim().toLowerCase();
  if (!kw) { render(data); return; }
  render(data.filter(it =>
    (it.q + it.a.join('') + it.n.join('') + (it.t || '') + (it.scene || '') + (it.p ? it.p.join('') : '') + (it.use ? it.use.join('') : '')).toLowerCase().includes(kw)
  ));
});
