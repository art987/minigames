<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>价签工坊</title>
<link rel="stylesheet" href="assets/css/style.css?v=22">
<link rel="stylesheet" href="assets/css/templates/V09.css?v=1">
<link rel="stylesheet" href="assets/css/templates/V10.css?v=1">
<link rel="stylesheet" href="assets/css/templates/V11.css?v=1">
<link rel="stylesheet" href="assets/css/templates/V12.css?v=1">
<link rel="stylesheet" href="assets/css/templates/V13.css?v=1">
<link rel="stylesheet" href="assets/css/templates/V14.css?v=1">
<link rel="stylesheet" href="assets/css/templates/V15.css?v=1">
<link rel="stylesheet" href="assets/css/templates/V16.css?v=1">
<link rel="stylesheet" href="assets/css/templates/B01.css?v=1">
<link rel="stylesheet" href="assets/css/templates/B02.css?v=1">
<link rel="stylesheet" href="assets/css/templates/B03.css?v=1">
<link rel="stylesheet" href="assets/css/templates/B04.css?v=1">
<link rel="stylesheet" href="assets/css/templates/B05.css?v=1">
<link rel="stylesheet" href="assets/css/templates/B06.css?v=1">
<link rel="stylesheet" href="assets/css/templates/B07.css?v=1">
<link rel="stylesheet" href="assets/css/templates/B08.css?v=1">
<link rel="stylesheet" href="assets/css/templates/T01.css?v=1">
<link rel="stylesheet" href="assets/css/templates/T02.css?v=1">
<link rel="stylesheet" href="assets/css/templates/T03.css?v=1">
<link rel="stylesheet" href="assets/css/templates/T04.css?v=1">
<link rel="stylesheet" href="assets/css/templates/T05.css?v=1">
<link rel="stylesheet" href="assets/css/templates/T06.css?v=1">
<link rel="stylesheet" href="assets/css/templates/T07.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-logo">🏷️</span>
      <div>
        <h1>价签工坊</h1>
        <p>A4 价格牌 · 多商品轮播预览 · 下载打印</p>
      </div>
    </div>
  </div>
</header>

<main class="workspace">
  <!-- 预览区：DOM 价签幻灯片 -->
  <section class="preview-area">
    <div class="stage" id="stage">
      <button class="nav-btn prev" id="btnPrev" title="上一张">‹</button>
      <div class="slide-frame" id="slideFrame">
        <div class="slides" id="slides"><!-- 每条商品一张价签 --></div>
      </div>
      <button class="nav-btn next" id="btnNext" title="下一张">›</button>
      <div class="carousel-foot">
        <div class="dots" id="dots"></div>
        <span class="page-info" id="pageInfo"></span>
      </div>
      <!-- 模板/商品操作按钮：放在预览舞台内部底部 -->
      <div class="tpl-switch">
        <button type="button" id="btnAddQuick" class="ts-add">添加商品</button>
        <button type="button" id="btnManage" class="ts-manage">商品管理</button>
        <button type="button" id="btnTplPrev">‹ 上一模板</button>
        <button type="button" id="btnTplLib">模板库</button>
        <button type="button" id="btnTplNext">下一模板 ›</button>
      </div>
    </div>
  </section>

  <!-- 下载（独立模块） -->
  <section class="panel panel-side">
    <h2 class="panel-title">下载当前价签</h2>
    <button class="btn btn-accent" id="btnPng">⬇ 下载高清 PNG</button>
    <button class="btn" id="btnPdf">⬇ 下载打印 PDF</button>
    <p class="export-hint">PNG：2480×3508（A4 300dpi）<br>PDF：标准 A4 竖版 210×297mm</p>
  </section>
</main>

<!-- 弹窗：添加商品（商品卡片式，可一次新增多条，不展示已有商品） -->
<div class="modal" id="modalAdd">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2>添加商品</h2>
        <p class="modal-desc">在卡片上填写商品信息，可「＋ 新增一条商品」一次加多条</p>
      </div>
      <button class="modal-close" data-close type="button">✕</button>
    </div>
    <div class="modal-body">
      <div class="product-list" id="draftList"><!-- 待添加的商品卡片 --></div>
      <button class="p-card-add" id="btnAddDraft" type="button">＋ 新增一条商品</button>
      <div class="form-actions add-foot">
        <button class="btn btn-accent" id="qaConfirm" type="button">保存</button>
        <button class="btn btn-green" id="qaManage" type="button">商品管理</button>
      </div>
    </div>
  </div>
</div>

<!-- 弹窗：删除确认（替代系统 confirm） -->
<div class="modal" id="modalConfirm">
  <div class="modal-card confirm-card">
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="form-actions">
      <button class="btn" id="confirmCancel" type="button">取消</button>
      <button class="btn btn-danger" id="confirmOk" type="button">删除</button>
    </div>
  </div>
</div>

<!-- 弹窗：商品管理（原商品信息面板搬入，卡片内联编辑） -->
<div class="modal" id="modalProducts">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2>商品管理 <span class="panel-sub" id="prodCount"></span></h2>
        <p class="modal-desc">在卡片上直接修改，改完即生效；可复制 / 删除</p>
      </div>
      <button class="modal-close" data-close type="button">✕</button>
    </div>
    <div class="modal-body">
      <div class="product-list" id="productList"><!-- 商品卡片 --></div>
      <button class="p-card-add" id="btnAddProduct" type="button">＋ 新增一条商品</button>
    </div>
  </div>
</div>

<!-- 弹窗：选择行业 -->
<div class="modal" id="modalIndustry">
  <div class="modal-card modal-sm">
    <div class="modal-head">
      <div>
        <h2>选择你的行业</h2>
        <p class="modal-desc">选好行业后进入模板库挑选模板</p>
      </div>
      <button class="modal-close" data-close type="button">✕</button>
    </div>
    <div class="modal-body">
      <div class="industry-grid" id="industryGrid"></div>
    </div>
  </div>
</div>

<!-- 弹窗：选择模板 -->
<div class="modal" id="modalTemplate">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="templateGridTitle">选择模板</h2>
      </div>
      <button class="modal-close" data-close type="button">✕</button>
    </div>
    <div class="modal-body">
      <div class="ind-row">
        <span>当前行业：<b id="curIndustry">蔬菜</b></span>
        <button class="ind-change" id="btnChangeIndustry" type="button">更换行业</button>
      </div>
      <div class="template-grid" id="templateGrid"></div>
    </div>
  </div>
</div>

<!-- 调试面板（仅 DEBUG_MODE 开启时可用）：点价签文字调样式，生成可覆盖的模板 CSS；按住标题栏可拖动 -->
<div class="debug-panel hidden" id="debugPanel">
  <div class="dbg-head" id="dbgHead">
    <b id="dbgTitle">调整</b>
    <button id="dbgClose" type="button">✕</button>
  </div>
  <div class="dbg-body">
    <div class="dbg-grid">
      <label>字体
        <select id="dbgFont">
          <option value="var(--font-kai)">东方大楷</option>
          <option value="var(--font-douyin)">抖音黑体</option>
          <option value="var(--font-zcool)">站酷快乐体</option>
          <option value="var(--font-serif)">思源宋体</option>
          <option value="">系统默认</option>
        </select>
      </label>
      <label>字号
        <input type="number" id="dbgSize" step="0.5" min="2">
      </label>
      <label>粗细
        <select id="dbgWeight">
          <option value="400">常规</option>
          <option value="700">加粗</option>
          <option value="900">特粗</option>
        </select>
      </label>
      <label>颜色
        <input type="color" id="dbgColor">
      </label>
      <label>左右
        <input type="number" id="dbgLeft" step="0.5">
      </label>
      <label>上下
        <input type="number" id="dbgTop" step="0.5">
      </label>
    </div>
    <p class="dbg-tip" id="dbgPosTip"></p>
    <textarea id="dbgCss" rows="6" readonly spellcheck="false"></textarea>
    <div class="dbg-actions">
      <button class="btn" id="dbgCopy" type="button">复制模板CSS</button>
      <button class="btn" id="dbgReset" type="button">恢复默认</button>
    </div>
    <p class="dbg-tip">输出的是当前模板的全部规则，复制后整体粘贴覆盖 assets/css/templates/ 对应模板文件里的同名规则即可</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/templates.js?v=9"></script>
<script src="assets/js/render.js?v=20"></script>
<script src="assets/js/app.js?v=24"></script>
</body>
</html>
