<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>TickLife · 嘀嗒人生</title>

<style>
:root{
    --bg:#090b0f;
    --panel:#11151b;
    --panel2:#171c23;
    --panel3:#1d232c;
    --line:#2a313b;
    --text:#f3f5f7;
    --muted:#858d98;
    --blue:#287cff;
    --blue2:#125bd4;
    --red:#ef4444;
    --orange:#f59e0b;
    --green:#35c98b;
    --shadow:0 12px 35px rgba(0,0,0,.4);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    border:0;
    color:inherit;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:620px;
    min-height:100vh;
    margin:auto;
    position:relative;
    background:
        radial-gradient(circle at 50% 0%,rgba(40,124,255,.08),transparent 35%),
        var(--bg);
}

/* =========================
   Header
========================= */

.header{
    height:64px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(9,11,15,.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.04);
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
}

.logo-mark{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:17px;
    background:
        radial-gradient(circle at 35% 30%,#303945,#11151b 60%);
    border:2px solid #303741;
    box-shadow:
        inset 0 1px 3px rgba(255,255,255,.15),
        0 3px 10px rgba(0,0,0,.4);
}

.logo-title{
    font-size:16px;
    font-weight:800;
    letter-spacing:.4px;
}

.logo-sub{
    font-size:10px;
    color:var(--muted);
    margin-top:1px;
}

.header-actions{
    display:flex;
    gap:7px;
}

.header-btn{
    height:34px;
    padding:0 11px;
    border-radius:18px;
    background:#151a21;
    border:1px solid #272e38;
    color:#bfc6ce;
    font-size:12px;
}

.header-btn:active{
    transform:scale(.96);
}

/* =========================
   Views
========================= */

.view{
    display:none;
    padding-bottom:130px;
}

.view.active{
    display:block;
}

/* =========================
   Mechanical Stopwatch
========================= */

.timer-section{
    padding:24px 18px 12px;
}

.stopwatch{
    width:min(82vw,390px);
    aspect-ratio:1;
    margin:0 auto;
    position:relative;
    border-radius:50%;
    background:
        radial-gradient(circle at 48% 42%,
            #222932 0%,
            #171c23 38%,
            #10141a 68%,
            #080a0d 100%);
    border:
        9px solid #222831;
    box-shadow:
        0 0 0 2px #050608,
        0 0 0 5px #343b44,
        inset 0 0 0 2px #080a0d,
        inset 0 0 30px rgba(0,0,0,.8),
        0 15px 45px rgba(0,0,0,.45);
}

.stopwatch::before{
    content:"";
    position:absolute;
    inset:7%;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.05);
}

.stopwatch::after{
    content:"";
    position:absolute;
    inset:13%;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.04);
}

.crown{
    position:absolute;
    top:-25px;
    left:50%;
    transform:translateX(-50%);
    width:42px;
    height:22px;
    border-radius:6px 6px 2px 2px;
    background:linear-gradient(#555e68,#20262e);
    border:2px solid #11151a;
    box-shadow:0 3px 6px #000;
}

.tick{
    position:absolute;
    left:50%;
    top:50%;
    width:2px;
    height:47%;
    transform-origin:50% 100%;
    pointer-events:none;
}

.tick::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:2px;
    height:9px;
    background:#727b86;
    border-radius:2px;
}

.tick.major::before{
    height:14px;
    width:3px;
    background:#b9c0c7;
}

.tick span{
    position:absolute;
    top:19px;
    left:50%;
    transform:translateX(-50%);
    color:#8f98a2;
    font-size:10px;
}

.tick.major span{
    color:#c7ccd1;
    font-weight:700;
    font-size:11px;
}

.stopwatch-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:3;
}

.timer-label{
    color:#7d8792;
    font-size:10px;
    letter-spacing:3px;
    margin-bottom:8px;
}

.timer-value{
    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
    font-size:clamp(28px,8vw,42px);
    letter-spacing:-1.5px;
    font-weight:700;
    text-shadow:
        0 0 15px rgba(255,255,255,.08);
}

.timer-ms{
    color:#6e7782;
    font-size:12px;
    margin-top:5px;
    letter-spacing:2px;
}

.needle{
    position:absolute;
    width:2px;
    height:34%;
    left:50%;
    bottom:50%;
    transform-origin:50% 100%;
    transform:translateX(-50%) rotate(0deg);
    z-index:5;
}

.needle::before{
    content:"";
    position:absolute;
    width:2px;
    height:100%;
    background:var(--red);
    box-shadow:0 0 8px rgba(239,68,68,.45);
}

.needle-dot{
    position:absolute;
    left:50%;
    bottom:-6px;
    width:13px;
    height:13px;
    transform:translateX(-50%);
    border-radius:50%;
    background:#252b33;
    border:3px solid #c5cbd0;
    box-shadow:0 0 0 2px #090b0f;
}

/* =========================
   Today Summary
========================= */

.today-summary{
    text-align:center;
    padding:4px 0 18px;
}

.today-date{
    font-size:12px;
    color:var(--muted);
}

.today-total{
    margin-top:5px;
    font-size:13px;
    color:#c5cbd1;
}

.today-total strong{
    color:#fff;
    font-family:monospace;
}

/* =========================
   Timeline
========================= */

.timeline{
    padding:0 14px;
}

.timeline-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 4px 10px;
}

.timeline-title h2{
    font-size:15px;
    margin:0;
}

.timeline-title span{
    color:#69727d;
    font-size:11px;
}

.event-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.event-card{
    position:relative;
    display:grid;
    grid-template-columns:44px 1fr auto;
    gap:10px;
    padding:13px;
    background:linear-gradient(145deg,#171c23,#11151a);
    border:1px solid #242b34;
    border-radius:15px;
    overflow:hidden;
}

.event-card.running{
    border-color:rgba(239,68,68,.35);
    background:linear-gradient(145deg,#1c1b20,#13161b);
}

.event-card.long{
    border-left:3px solid var(--orange);
}

.event-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    background:#20262e;
    border:1px solid #303741;
}

.event-main{
    min-width:0;
}

.event-name{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding-right:20px;
}

.event-card.void .event-name{
    color:#777f89;
}

.event-time{
    margin-top:5px;
    color:#747e89;
    font-size:10px;
}

.event-estimate{
    margin-top:6px;
    font-size:9px;
    color:#69737d;
}

.event-estimate.over{
    color:var(--orange);
}

.event-duration{
    min-width:74px;
    text-align:right;
    align-self:center;
    font-family:monospace;
    font-size:14px;
    font-weight:700;
    color:#dce1e5;
}

.event-edit{
    position:absolute;
    right:9px;
    top:7px;
    font-size:11px;
    color:#555e68;
    background:none;
}

.running-dot{
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--red);
    margin-right:5px;
    box-shadow:0 0 7px rgba(239,68,68,.7);
    animation:pulse 1.1s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.25}
}

.empty{
    padding:35px 10px;
    text-align:center;
    color:#59616b;
    font-size:13px;
}

/* =========================
   Bottom Controls
========================= */

.bottom-area{
    position:fixed;
    z-index:30;
    left:50%;
    bottom:0;
    width:min(620px,100%);
    transform:translateX(-50%);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:
        linear-gradient(transparent,rgba(9,11,15,.94) 20%);
}

.bottom-actions{
    display:grid;
    grid-template-columns:48px 1fr 48px;
    gap:10px;
    align-items:center;
}

.side-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#161b21;
    border:1px solid #2a313b;
    color:#858e98;
    font-size:18px;
}

.main-action{
    height:56px;
    border-radius:18px;
    background:var(--blue);
    font-size:17px;
    font-weight:800;
    letter-spacing:2px;
    box-shadow:
        0 7px 25px rgba(40,124,255,.22),
        inset 0 1px rgba(255,255,255,.15);
}

.main-action.running{
    background:var(--red);
    box-shadow:0 7px 25px rgba(239,68,68,.18);
}

.main-action:active,
.side-btn:active{
    transform:scale(.97);
}

/* =========================
   Review
========================= */

.review{
    padding:20px 14px 100px;
}

.review-heading{
    padding:5px 4px 18px;
}

.review-heading h1{
    margin:0;
    font-size:25px;
}

.review-heading p{
    margin:5px 0 0;
    color:#69727d;
    font-size:12px;
}

.period-tabs{
    display:flex;
    padding:4px;
    background:#14191f;
    border:1px solid #242b34;
    border-radius:14px;
    margin-bottom:14px;
}

.period-tab{
    flex:1;
    height:36px;
    border-radius:10px;
    background:transparent;
    color:#727b86;
    font-size:12px;
}

.period-tab.active{
    background:#29313b;
    color:#fff;
}

.review-card{
    background:linear-gradient(145deg,#151a21,#101419);
    border:1px solid #252c35;
    border-radius:17px;
    padding:16px;
    margin-bottom:10px;
}

.review-card-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:14px;
}

/* donut */

.donut-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:210px;
    position:relative;
}

.donut{
    width:185px;
    height:185px;
    transform:rotate(-90deg);
}

.donut-bg{
    fill:none;
    stroke:#252c34;
    stroke-width:20;
}

.donut-void{
    fill:none;
    stroke:var(--orange);
    stroke-width:20;
    stroke-linecap:round;
    transition:stroke-dasharray .5s ease;
}

.donut-center{
    position:absolute;
    text-align:center;
}

.donut-percent{
    font-size:30px;
    font-weight:800;
    font-family:monospace;
}

.donut-label{
    margin-top:2px;
    color:#707985;
    font-size:11px;
}

.legend{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:-2px;
    color:#777f89;
    font-size:10px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
}

.legend-dot{
    width:7px;
    height:7px;
    border-radius:50%;
}

.legend-dot.orange{
    background:var(--orange);
}

.legend-dot.green{
    background:var(--green);
}

/* bars */

.ranking{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.rank-row{
    display:grid;
    grid-template-columns:26px 1fr 70px;
    gap:8px;
    align-items:center;
}

.rank-num{
    color:#555e68;
    font-size:11px;
    text-align:center;
}

.rank-info{
    min-width:0;
}

.rank-name{
    font-size:11px;
    color:#9ca4ad;
    margin-bottom:6px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.rank-bar-bg{
    height:8px;
    background:#242b33;
    border-radius:5px;
    overflow:hidden;
}

.rank-bar{
    height:100%;
    background:var(--orange);
    border-radius:5px;
    min-width:2px;
}

.rank-duration{
    text-align:right;
    font-family:monospace;
    font-size:11px;
    color:#c3c9ce;
}

/* estimate */

.compare-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.compare-item{
    padding-bottom:13px;
    border-bottom:1px solid #222831;
}

.compare-item:last-child{
    border-bottom:0;
}

.compare-name{
    font-size:11px;
    color:#aab1b9;
    margin-bottom:7px;
}

.compare-track{
    height:8px;
    background:#242b33;
    border-radius:5px;
    position:relative;
    overflow:hidden;
}

.compare-estimate{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    background:#67717c;
    border-radius:5px;
}

.compare-real{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    background:#e3e7ea;
    border-radius:5px;
}

.compare-result{
    margin-top:6px;
    display:flex;
    justify-content:space-between;
    color:#6d7680;
    font-size:9px;
}

.compare-result.over{
    color:var(--orange);
}

.compare-result.saved{
    color:var(--green);
}

/* =========================
   Modal
========================= */

.modal-layer{
    display:none;
    position:fixed;
    z-index:100;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
    align-items:flex-end;
    justify-content:center;
}

.modal-layer.show{
    display:flex;
}

.modal{
    width:min(620px,100%);
    max-height:88vh;
    overflow-y:auto;
    background:#11151b;
    border-radius:23px 23px 0 0;
    border:1px solid #2b323b;
    padding:19px 16px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -20px 50px rgba(0,0,0,.5);
    animation:slideUp .22s ease;
}

@keyframes slideUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.modal-handle{
    width:42px;
    height:4px;
    border-radius:3px;
    background:#343b44;
    margin:0 auto 15px;
}

.modal-title{
    font-size:16px;
    font-weight:800;
    margin-bottom:17px;
}

.section-label{
    color:#69727d;
    font-size:10px;
    margin:15px 0 8px;
}

/* icon picker */

.icon-scroll{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:2px 1px 8px;
    scrollbar-width:none;
    scroll-snap-type:x proximity;
}

.icon-scroll::-webkit-scrollbar{
    display:none;
}

.icon-option{
    flex:0 0 60px;
    scroll-snap-align:start;
    height:60px;
    border-radius:15px;
    background:#1a2027;
    border:1px solid #2a313b;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
}

.icon-option.selected{
    border-color:var(--blue);
    background:rgba(40,124,255,.13);
    box-shadow:0 0 0 1px rgba(40,124,255,.25);
}

.input{
    width:100%;
    height:45px;
    padding:0 13px;
    border-radius:12px;
    background:#1a2027;
    border:1px solid #2a313b;
    outline:none;
    color:#fff;
    font-size:13px;
}

.input:focus{
    border-color:#3b82f6;
}

/* estimate choices */

.estimate-scroll{
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:5px;
}

.estimate-scroll::-webkit-scrollbar{
    display:none;
}

.estimate-option{
    flex:0 0 auto;
    padding:9px 13px;
    border-radius:11px;
    background:#1a2027;
    border:1px solid #2a313b;
    color:#838c96;
    font-size:11px;
}

.estimate-option.selected{
    background:rgba(40,124,255,.14);
    border-color:var(--blue);
    color:#fff;
}

/* wheel */

.wheel-panel{
    display:none;
    margin-top:10px;
    padding:12px;
    background:#0d1014;
    border-radius:14px;
    border:1px solid #252c34;
}

.wheel-panel.show{
    display:block;
}

.wheels{
    display:flex;
    justify-content:center;
    gap:12px;
}

.wheel-box{
    display:flex;
    align-items:center;
    gap:7px;
}

.wheel{
    width:72px;
    height:125px;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
    border-radius:10px;
    background:#161b21;
}

.wheel::-webkit-scrollbar{
    display:none;
}

.wheel-item{
    height:41px;
    display:flex;
    justify-content:center;
    align-items:center;
    scroll-snap-align:center;
    color:#5d6670;
    font-size:15px;
}

.wheel-item.active{
    color:#fff;
    font-weight:800;
}

.wheel-unit{
    color:#737c86;
    font-size:12px;
}

.wheel-confirm{
    display:block;
    margin:10px auto 0;
    padding:8px 18px;
    border-radius:10px;
    background:#252d37;
    color:#fff;
    font-size:11px;
}

.modal-footer{
    display:flex;
    gap:9px;
    margin-top:20px;
}

.modal-btn{
    flex:1;
    height:45px;
    border-radius:12px;
    background:#222831;
    color:#aeb5bc;
    font-size:13px;
}

.modal-btn.primary{
    background:var(--blue);
    color:#fff;
    font-weight:700;
}

.modal-btn.danger{
    background:#3a1719;
    color:#ff8585;
}

/* =========================
   Toast
========================= */

.toast{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:95px;
    transform:translateX(-50%) translateY(10px);
    padding:10px 15px;
    border-radius:12px;
    background:#252b33;
    border:1px solid #353d47;
    color:#e5e8eb;
    font-size:11px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   Responsive
========================= */

@media(max-width:380px){
    .timer-value{
        font-size:27px;
    }

    .stopwatch{
        width:86vw;
    }

    .event-card{
        grid-template-columns:40px 1fr auto;
        padding:11px;
    }

    .event-icon{
        width:38px;
        height:38px;
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="logo">
            <div class="logo-mark">⏱</div>
            <div>
                <div class="logo-title">TickLife</div>
                <div class="logo-sub">嘀嗒人生 · 记录一切，包括空白</div>
            </div>
        </div>

        <div class="header-actions">
            <button class="header-btn" id="reviewBtn">🕳️ 复盘</button>
            <button class="header-btn" id="exportBtn">导出</button>
        </div>
    </header>

    <!-- ================= TIMER VIEW ================= -->
    <main id="timerView" class="view active">

        <section class="timer-section">

            <div class="stopwatch" id="stopwatch">

                <div class="crown"></div>

                <!-- 刻度由 JS 生成 -->

                <div class="needle" id="needle">
                    <div class="needle-dot"></div>
                </div>

                <div class="stopwatch-center">
                    <div class="timer-label">TODAY'S TIME</div>
                    <div class="timer-value" id="timerValue">00:00:00</div>
                    <div class="timer-ms" id="timerMs">.00</div>
                </div>

            </div>

            <div class="today-summary">
                <div class="today-date" id="todayDate"></div>
                <div class="today-total">
                    今日累计记录
                    <strong id="todayTotal">00:00:00</strong>
                </div>
            </div>

<script>
/* =========================================================
   TickLife · 嘀嗒人生
   原生 JavaScript ES6
   LocalStorage Key: ticklife:v1
========================================================= */

const STORAGE_KEY = "ticklife:v1";

const ICONS = [
    "❔","💻","📖","🛌","📱","🎮",
    "🍔","🚶","🛋️","🚗","☕","🏃"
];

let data = loadData();

let currentModalMode = "start";
let editingEventId = null;

let selectedIcon = "❔";
let selectedEstimate = 0;

let editSelectedIcon = "❔";
let editSelectedEstimate = 0;

let customEstimate = 0;
let editCustomEstimate = 0;

let reviewPeriod = "week";

let lastRender = 0;


/* =========================================================
   基础工具
========================================================= */

function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function pad(n){
    return String(n).padStart(2,"0");
}

function dateKey(date = new Date()){
    return [
        date.getFullYear(),
        pad(date.getMonth()+1),
        pad(date.getDate())
    ].join("-");
}

function formatClock(ms, showMs = false){

    ms = Math.max(0,ms);

    const totalSeconds = Math.floor(ms / 1000);

    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;

    let result =
        `${pad(h)}:${pad(m)}:${pad(s)}`;

    if(showMs){
        result += `.${pad(Math.floor((ms % 1000)/10))}`;
    }

    return result;
}

function formatDuration(ms){
    return "+" + formatClock(ms,false);
}

function formatShortDuration(ms){

    ms = Math.max(0,ms);

    const sec = Math.floor(ms/1000);

    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60);
    const s = sec%60;

    if(h > 0){
        return `${h}小时${m}分`;
    }

    if(m > 0){
        return `${m}分${s}秒`;
    }

    return `${s}秒`;
}

function formatTime(timestamp){

    if(!timestamp) return "--:--";

    const d = new Date(timestamp);

    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDateTime(timestamp){

    const d = new Date(timestamp);

    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escapeHtml(str){

    return String(str || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   LocalStorage
========================================================= */

function loadData(){

    try{

        const raw = localStorage.getItem(STORAGE_KEY);

        if(!raw) return [];

        const parsed = JSON.parse(raw);

        return Array.isArray(parsed) ? parsed : [];

    }catch(e){

        console.error("读取数据失败",e);

        return [];
    }
}

let saveTimer = null;

function saveData(){

    clearTimeout(saveTimer);

    saveTimer = setTimeout(()=>{

        try{

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(data)
            );

        }catch(e){

            console.error("保存失败",e);
            showToast("保存数据失败");
        }

    },80);
}


/* =========================================================
   数据操作
========================================================= */

function getDay(key){

    let day = data.find(d => d.date === key);

    if(!day){

        day = {
            date:key,
            events:[]
        };

        data.push(day);
    }

    return day;
}

function getAllEvents(){

    return data.flatMap(day =>
        day.events.map(event => ({
            ...event,
            date:day.date
        }))
    );
}

function findEvent(id){

    for(const day of data){

        const event = day.events.find(e => e.id === id);

        if(event){

            return {
                day,
                event
            };
        }
    }

    return null;
}

function isEventRunning(event){

    return event.isRunning === true || event.endTime === null;
}

function getEventDuration(event){

    if(isEventRunning(event)){

        return Math.max(
            0,
            Date.now() - event.startTime
        );
    }

    if(event.duration){
        return event.duration;
    }

    return Math.max(
        0,
        (event.endTime || event.startTime) - event.startTime
    );
}


/* =========================================================
   当前运行事件
========================================================= */

function getRunningEvent(){

    for(const day of data){

        const event = day.events.find(
            e => isEventRunning(e)
        );

        if(event) return event;
    }

    return null;
}


/* =========================================================
   跨天处理
========================================================= */

/*
   PRD：
   跨天未结束的事件继续计时，
   但新的一天创建新的集合。

   为了让每日统计准确：
   当运行事件跨天时，
   在午夜将旧事件切割到昨天，
   同时创建今天的新事件继续运行。
*/

function splitCrossDayRunningEvent(){

    const running = getRunningEvent();

    if(!running) return;

    const startDate = new Date(running.startTime);
    const today = dateKey();

    if(dateKey(startDate) === today){
        return;
    }

    const midnight = new Date();

    midnight.setHours(0,0,0,0);

    const previousEnd = midnight.getTime();

    if(previousEnd > running.startTime){

        const oldDayKey = dateKey(
            new Date(previousEnd - 1)
        );

        const oldDay = getDay(oldDayKey);

        const oldEvent = {
            ...running,
            id:uid(),
            endTime:previousEnd,
            duration:previousEnd - running.startTime,
            isRunning:false
        };

        oldDay.events.push(oldEvent);
    }

    const newDay = getDay(today);

    const newEvent = {
        ...running,
        id:uid(),
        startTime:previousEnd,
        endTime:null,
        duration:0,
        isRunning:true
    };

    newDay.events.push(newEvent);

    /*
       删除旧的运行事件
    */
    for(const day of data){

        day.events =
            day.events.filter(e => e.id !== running.id);
    }

    saveData();
}


/* =========================================================
   事件开始
========================================================= */

function startEvent(icon="❔", title="", estimatedSeconds=0){

    /*
       单线原则：
       如果已有运行事件，不再创建第二个。
    */

    const running = getRunningEvent();

    if(running){

        return running;
    }

    const now = Date.now();

    const event = {

        id:uid(),

        icon:icon || "❔",

        title:title || "未命名",

        startTime:now,

        endTime:null,

        duration:0,

        estimatedSeconds:Number(estimatedSeconds) || 0,

        isRunning:true
    };

    const day = getDay(
        dateKey(new Date(now))
    );

    day.events.push(event);

    saveData();

    renderAll();

    return event;
}


/* =========================================================
   结束当前事件
========================================================= */

function stopRunningEvent(){

    const running = getRunningEvent();

    if(!running) return null;

    const now = Date.now();

    running.endTime = now;

    running.duration =
        Math.max(0,now - running.startTime);

    running.isRunning = false;

    saveData();

    return running;
}


/* =========================================================
   新记录
========================================================= */

function startNewRecord(
    icon="❔",
    title="",
    estimatedSeconds=0
){

    /*
       关键逻辑：

       旧事件立即结束
       ↓
       新事件立即开始

       两者之间不产生人为间隔。
    */

    const running = getRunningEvent();

    if(running){

        stopRunningEvent();
    }

    return startEvent(
        icon,
        title,
        estimatedSeconds
    );
}


/* =========================================================
   事件删除
========================================================= */

function deleteEvent(id){

    for(const day of data){

        const index =
            day.events.findIndex(e => e.id === id);

        if(index !== -1){

            day.events.splice(index,1);

            if(day.events.length === 0){

                const dayIndex =
                    data.indexOf(day);

                data.splice(dayIndex,1);
            }

            saveData();

            renderAll();

            return;
        }
    }
}


/* =========================================================
   今日统计
========================================================= */

function getTodayEvents(){

    splitCrossDayRunningEvent();

    const today = dateKey();

    const day = data.find(
        d => d.date === today
    );

    return day ? day.events : [];
}

function getTodayTotal(){

    return getTodayEvents()
        .reduce(
            (sum,event) =>
                sum + getEventDuration(event),
            0
        );
}


/* =========================================================
   UI 初始化
========================================================= */

function buildTicks(){

    const stopwatch =
        document.getElementById("stopwatch");

    for(let i=0;i<60;i++){

        const tick =
            document.createElement("div");

        tick.className =
            "tick" + (i%5===0 ? " major":"");

        tick.style.transform =
            `translate(-50%,-100%) rotate(${i*6}deg)`;

        if(i%5===0){

            const span =
                document.createElement("span");

            span.textContent =
                i === 0 ? "60" : i;

            tick.appendChild(span);
        }

        stopwatch.appendChild(tick);
    }
}


/* =========================================================
   主计时器
========================================================= */

function updateTimer(){

    splitCrossDayRunningEvent();

    const total =
        getTodayTotal();

    document.getElementById(
        "timerValue"
    ).textContent =
        formatClock(total,false);

    document.getElementById(
        "timerMs"
    ).textContent =
        "." +
        pad(Math.floor((total%1000)/10));

    document.getElementById(
        "todayTotal"
    ).textContent =
        formatClock(total,false);

    /*
       机械秒针：
       根据当前毫秒计算角度
    */

    const angle =
        ((Date.now()%60000)/60000)*360;

    document.getElementById(
        "needle"
    ).style.transform =
        `translateX(-50%) rotate(${angle}deg)`;

    requestAnimationFrame(updateTimer);
}


/* =========================================================
   主页面渲染
========================================================= */

function renderTimerView(){

    const events =
        [...getTodayEvents()]
            .sort((a,b) =>
                b.startTime-a.startTime
            );

    const list =
        document.getElementById("eventList");

    document.getElementById(
        "eventCount"
    ).textContent =
        `${events.length} 段记录`;

    if(events.length === 0){

        list.innerHTML = `
            <div class="empty">
                还没有记录。<br>
                点击「开始」，让时间留下痕迹。
            </div>
        `;

        return;
    }

    list.innerHTML =
        events.map(event => {

            const duration =
                getEventDuration(event);

            const running =
                isEventRunning(event);

            const voidEvent =
                event.icon === "❔" ||
                !event.title ||
                event.title === "未命名";

            const longEvent =
                duration > 30*60*1000;

            let estimateHtml = "";

            if(event.estimatedSeconds > 0){

                const estimatedMs =
                    event.estimatedSeconds*1000;

                const diff =
                    duration-estimatedMs;

                if(diff > 0){

                    estimateHtml = `
                        <div class="event-estimate over">
                            预估 ${formatShortDuration(estimatedMs)}
                            · 超时 ${formatShortDuration(diff)}
                        </div>
                    `;

                }else{

                    estimateHtml = `
                        <div class="event-estimate">
                            预估 ${formatShortDuration(estimatedMs)}
                            · 节省 ${formatShortDuration(Math.abs(diff))}
                        </div>
                    `;
                }
            }

            return `
                <div
                    class="
                        event-card
                        ${running ? "running":""}
                        ${voidEvent ? "void":""}
                        ${longEvent ? "long":""}
                    "
                    data-id="${event.id}"
                >

                    <div class="event-icon">
                        ${event.icon || "❔"}
                    </div>

                    <div class="event-main">

                        <div class="event-name">

                            ${
                                running
                                ? `<span class="running-dot"></span>`
                                : ""
                            }

                            ${escapeHtml(
                                event.title || "未命名"
                            )}

                        </div>

                        <div class="event-time">

/* =========================================================
   时间滑轮
========================================================= */

function buildWheel(element, max, step=1){

    element.innerHTML = "";

    /*
       上下增加空白，让第一个和最后一个
       都能滚动到中央位置。
    */

    const values = [];

    for(let i=0;i<=max;i+=step){
        values.push(i);
    }

    for(let i=0;i<2;i++){

        const empty =
            document.createElement("div");

        empty.className = "wheel-item";
        empty.innerHTML = "&nbsp;";

        element.appendChild(empty);
    }

    values.forEach(value => {

        const item =
            document.createElement("div");

        item.className = "wheel-item";

        item.dataset.value = value;

        item.textContent = pad(value);

        element.appendChild(item);
    });

    for(let i=0;i<2;i++){

        const empty =
            document.createElement("div");

        empty.className = "wheel-item";
        empty.innerHTML = "&nbsp;";

        element.appendChild(empty);
    }

    element.addEventListener(
        "scroll",
        ()=>updateWheelActive(element)
    );
}

function updateWheelActive(wheel){

    const center =
        wheel.scrollTop + wheel.clientHeight/2;

    let closest = null;
    let min = Infinity;

    wheel
        .querySelectorAll(".wheel-item[data-value]")
        .forEach(item => {

            const itemCenter =
                item.offsetTop +
                item.offsetHeight/2;

            const distance =
                Math.abs(itemCenter-center);

            if(distance < min){

                min = distance;
                closest = item;
            }
        });

    wheel
        .querySelectorAll(".wheel-item")
        .forEach(item =>
            item.classList.remove("active")
        );

    if(closest){
        closest.classList.add("active");
    }
}

function getWheelValue(wheel){

    const center =
        wheel.scrollTop + wheel.clientHeight/2;

    let closest = null;
    let min = Infinity;

    wheel
        .querySelectorAll(".wheel-item[data-value]")
        .forEach(item => {

            const itemCenter =
                item.offsetTop +
                item.offsetHeight/2;

            const distance =
                Math.abs(itemCenter-center);

            if(distance < min){

                min = distance;
                closest = item;
            }
        });

    return closest
        ? Number(closest.dataset.value)
        : 0;
}

function scrollWheelTo(wheel,value){

    const item =
        [...wheel.querySelectorAll(
            ".wheel-item[data-value]"
        )].find(
            el => Number(el.dataset.value) === value
        );

    if(item){

        wheel.scrollTop =
            item.offsetTop -
            wheel.clientHeight/2 +
            item.offsetHeight/2;
    }

    updateWheelActive(wheel);
}

/* =========================================================
   Review
========================================================= */

function getWeekRange(){

    const now = new Date();

    const day =
        now.getDay();

    const start =
        new Date(now);

    /*
       自然周：周日 -> 周六
    */

    start.setHours(0,0,0,0);

    start.setDate(
        now.getDate()-day
    );

    const end =
        new Date(start);

    end.setDate(
        start.getDate()+7
    );

    return {
        start:start.getTime(),
        end:end.getTime()
    };
}

function getMonthRange(){

    const now = new Date();

    const start =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            1
        );

    const end =
        new Date(
            now.getFullYear(),
            now.getMonth()+1,
            1
        );

    return {
        start:start.getTime(),
        end:end.getTime()
    };
}


/*
   处理跨时间范围事件。

   一个事件如果跨越筛选区间，
   只统计它落在区间内的部分。
*/

function getEventsInRange(start,end){

    const events =
        getAllEvents();

    const result = [];

    for(const event of events){

        const eventStart =
            event.startTime;

        const eventEnd =
            isEventRunning(event)
            ? Date.now()
            : event.endTime;

        const clippedStart =
            Math.max(eventStart,start);

        const clippedEnd =
            Math.min(eventEnd,end);

        if(clippedEnd <= clippedStart){
            continue;
        }

        result.push({

            ...event,

            duration:
                clippedEnd-clippedStart
        });
    }

    return result;
}


/* =========================================================
   Review Render
========================================================= */

function renderReview(){

    const range =
        reviewPeriod === "week"
        ? getWeekRange()
        : getMonthRange();

    const events =
        getEventsInRange(
            range.start,
            range.end
        );

    const total =
        events.reduce(
            (sum,e)=>sum+e.duration,
            0
        );

    const voidEvents =
        events.filter(e =>
            e.icon === "❔" ||
            !e.title ||
            e.title === "未命名"
        );

    const voidTotal =
        voidEvents.reduce(
            (sum,e)=>sum+e.duration,
            0
        );

    const percent =
        total > 0
        ? Math.round(
            voidTotal/total*100
        )
        : 0;

    /*
       SVG 圆环
       circumference = 2πr
    */

    const r = 48;

    const circumference =
        2*Math.PI*r;

    const dash =
        circumference *
        percent / 100;

    const donut =
        document.getElementById(
            "donutVoid"
        );

    donut.style.strokeDasharray =
        `${dash} ${circumference-dash}`;

    donut.style.strokeDashoffset =
        "0";

    document.getElementById(
        "voidPercent"
    ).textContent =
        `${percent}%`;


    /* TOP 5 */

    const top5 =
        [...voidEvents]
            .sort((a,b) =>
                b.duration-a.duration
            )
            .slice(0,5);

    const ranking =
        document.getElementById(
            "ranking"
        );

    if(top5.length === 0){

        ranking.innerHTML = `
            <div class="empty">
                这段时间没有发现时间黑洞。
            </div>
        `;

    }else{

        const max =
            top5[0].duration;

        ranking.innerHTML =
            top5.map((event,index)=>{

                const width =
                    max > 0
                    ? event.duration/max*100
                    : 0;

                return `
                    <div class="rank-row">

                        <div class="rank-num">
                            ${index+1}
                        </div>

                        <div class="rank-info">

                            <div class="rank-name">
                                ${event.icon || "❔"}
                                ${escapeHtml(
                                    event.title || "未命名"
                                )}
                            </div>

                            <div class="rank-bar-bg">
                                <div
                                    class="rank-bar"
                                    style="width:${width}%"
                                ></div>
                            </div>

                        </div>

                        <div class="rank-duration">
                            ${formatShortDuration(event.duration)}
                        </div>

                    </div>
                `;

            }).join("");
    }


    /* 预估 vs 实际 */

    const compared =
        events
            .filter(
                e => e.estimatedSeconds > 0
            )
            .sort(
                (a,b)=>b.duration-a.duration
            )
            .slice(0,12);

    const compareList =
        document.getElementById(
            "compareList"
        );

    if(compared.length === 0){

        compareList.innerHTML = `
            <div class="empty">
                暂时没有设置预估时间的事件。
            </div>
        `;

    }else{

        const max =
            Math.max(
                ...compared.map(
                    e =>
                        Math.max(
                            e.duration,
                            e.estimatedSeconds*1000
                        )
                ),
                1
            );

        compareList.innerHTML =
            compared.map(event=>{

                const estimated =
                    event.estimatedSeconds*1000;

                const real =
                    event.duration;

                const estWidth =
                    estimated/max*100;

                const realWidth =
                    real/max*100;

                const diff =
                    real-estimated;

                let resultClass = "";

                let resultText = "";

                if(
                    real >
                    estimated*1.5
                ){

                    resultClass = "over";

                    resultText =
                        `+${formatShortDuration(diff)} · 超时`;

                }else if(real < estimated){

                    resultClass = "saved";

                    resultText =
                        `-${formatShortDuration(Math.abs(diff))} · 节省`;

                }else{

                    resultText =
                        `${diff >= 0 ? "+" : "-"}${formatShortDuration(Math.abs(diff))}`;
                }

                return `
                    <div class="compare-item">

                        <div class="compare-name">
                            ${event.icon || "❔"}
                            ${escapeHtml(
                                event.title || "未命名"
                            )}
                        </div>

                        <div class="compare-track">

                            <div
                                class="compare-estimate"
                                style="width:${estWidth}%"
                            ></div>

                            <div
                                class="compare-real"
                                style="width:${realWidth}%"
                            ></div>

                        </div>

                        <div
                            class="compare-result ${resultClass}"
                        >

                            <span>
                                预估
                                ${formatShortDuration(estimated)}
                                · 实际
                                ${formatShortDuration(real)}
                            </span>

                            <span>
                                ${resultText}
                            </span>

                        </div>

                    </div>
                `;

            }).join("");
    }
}

                layer.classList.remove("show");
            }
        });
    });


/* =========================================================
   初始化时间滑轮
========================================================= */

buildWheel(
    document.getElementById("hourWheel"),
    12,
    1
);

buildWheel(
    document.getElementById("minuteWheel"),
    55,
    5
);

buildWheel(
    document.getElementById("editHourWheel"),
    12,
    1
);

buildWheel(
    document.getElementById("editMinuteWheel"),
    55,
    5
);


/* =========================================================
   初始化
========================================================= */

buildTicks();

renderAll();

updateTimer();


/* =========================================================
   页面可见性

   手机浏览器切后台后 requestAnimationFrame
   可能暂停，因此恢复时重新计算。
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(!document.hidden){

            splitCrossDayRunningEvent();

            renderAll();
        }
    }
);


/* =========================================================
   午夜刷新

   每 30 秒检查一次跨天。
========================================================= */

setInterval(()=>{

    splitCrossDayRunningEvent();

    renderAll();

},30000);

</script>

</body>
</html>
