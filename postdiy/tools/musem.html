<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>国博带娃文物卡｜一问一答</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{
  background:#000;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 0;
}
.wrap{
  width:100%;
  max-width:420px;
  height:82vh;
  position:relative;
  perspective:1200px;
}
.card-container{
  width:100%;
  height:100%;
  position:relative;
}
.card{
  position:absolute;
  width:100%;
  height:100%;
  background:#111;
  border-radius:18px;
  overflow:hidden;
  transform-origin:center center;
  transition:transform 0.4s ease,opacity 0.4s ease;
  display:flex;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  border:1px solid #222;
}
.card.active{
  opacity:1;
  pointer-events:auto;
  transform:translateX(0) scale(1);
  z-index:10;
}
.card.prev{
  transform:translateX(-85%) scale(0.82) rotateY(12deg);
  opacity:0.45;
  z-index:5;
}
.card.next{
  transform:translateX(85%) scale(0.82) rotateY(-12deg);
  opacity:0.45;
  z-index:5;
}
.img-box{
  width:100%;
  flex:1;
  background:#0a0a0a;
  cursor:pointer;
}
.img-box img{
  width:100%;
  height:100%;
  object-fit:contain; /* 完整显示图片，不裁切 */
  display:block;
}
.card-body{
  padding:16px 18px;
  flex-shrink:0;
}
.title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:6px;
  color:#fff;
}
.info{
  font-size:14px;
  color:#aaa;
  margin-bottom:14px;
}
.question{
  font-size:17px;
  color:#ffd782;
  line-height:1.5;
  margin-bottom:12px;
}
.answer-wrap{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.35s ease;
}
.answer-wrap.open{
  max-height:220px;
}
.answer{
  font-size:15px;
  color:#ddd;
  line-height:1.55;
}
.btn-toggle{
  margin-top:12px;
  padding:8px 16px;
  background:#222;
  color:#fff;
  border:1px solid #444;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
}
.nav-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(40,40,40,0.75);
  color:#fff;
  border:none;
  font-size:22px;
  z-index:20;
  cursor:pointer;
}
.arrow-left{left:-10px;}
.arrow-right{right:-10px;}
.dots{
  display:flex;
  gap:8px;
  position:absolute;
  bottom:-32px;
  left:50%;
  transform:translateX(-50%);
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#333;
}
.dot.active{background:#fff;}
.progress{
  position:absolute;
  top:-28px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  color:#999;
}
/* 大图弹窗 */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  z-index:999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.modal.show{display:flex;}
.modal img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
}
.modal-close{
  position:absolute;
  top:16px;
  right:20px;
  font-size:32px;
  color:#fff;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="progress" id="progress">1/22</div>
  <div class="card-container" id="cardWrap"></div>
  <button class="nav-arrow arrow-left" id="btnLeft">‹</button>
  <button class="nav-arrow arrow-right" id="btnRight">›</button>
  <div class="dots" id="dots"></div>
</div>

<!-- 大图弹窗 -->
<div class="modal" id="modal">
  <span class="modal-close" id="modalClose">×</span>
  <img id="modalImg" src="" alt="">

let currentIndex = 0;
const cardWrap = document.getElementById('cardWrap');
const dotsWrap = document.getElementById('dots');
const progressDom = document.getElementById('progress');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalClose = document.getElementById('modalClose');

// 渲染卡片
function render(){
  cardWrap.innerHTML = '';
  dotsWrap.innerHTML = '';
  progressDom.innerText = `${currentIndex+1}/${data.length}`;
  data.forEach((item,idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    if(idx === currentIndex) card.classList.add('active');
    if(idx === currentIndex -1) card.classList.add('prev');
    if(idx === currentIndex +1) card.classList.add('next');
    card.innerHTML = `
      <div class="img-box"><img src="${item.imgUrl}" alt="${item.title}"></div>
      <div class="card-body">
        <div class="title">${item.title}</div>
        <div class="info">${item.info}</div>
        <div class="question">❓ ${item.question}</div>
        <div class="answer-wrap">
          <div class="answer">${item.answer}</div>
        </div>
        <button class="btn-toggle">看答案</button>
      </div>
    `;
    // 大图弹窗
    card.querySelector('.img-box img').onclick = ()=>{
      modalImg.src = item.imgUrl;
      modal.classList.add('show');
    }
    // 展开答案
    const toggleBtn = card.querySelector('.btn-toggle');
    const ansWrap = card.querySelector('.answer-wrap');
    toggleBtn.onclick = ()=>{
      ansWrap.classList.toggle('open');
      toggleBtn.innerText = ansWrap.classList.contains('open') ? '收起' : '看答案';
    }
    cardWrap.appendChild(card);
    // 圆点
    const dot = document.createElement('div');
    dot.className = 'dot'+(idx===currentIndex?' active':'');
    dot.onclick = ()=>goTo(idx);
    dotsWrap.appendChild(dot);
  })
}
function goTo(i){
  currentIndex = Math.max(0,Math.min(i,data.length-1));
  render();
}
document.getElementById('btnLeft').onclick = ()=>goTo(currentIndex-1);
document.getElementById('btnRight').onclick = ()=>goTo(currentIndex+1);
// 键盘
document.onkeydown = e=>{
  if(e.key==='ArrowLeft') goTo(currentIndex-1);
  if(e.key==='ArrowRight') goTo(currentIndex+1);
}
// 触屏滑动
let startX=0,moveX=0;
cardWrap.addEventListener('touchstart',e=>startX=e.touches[0].clientX);
cardWrap.addEventListener('touchmove',e=>moveX=e.touches[0].clientX);
cardWrap.addEventListener('touchend',()=>{
  const diff = moveX - startX;
  if(Math.abs(diff)>40){
    if(diff>0) goTo(currentIndex-1);
    else goTo(currentIndex+1);
  }
  startX=moveX=0;
})
// 关闭大图
modalClose.onclick = ()=>modal.classList.remove('show');
modal.onclick = (e)=>{if(e.target===modal) modal.classList.remove('show');}
document.onkeydown = e=>{
  if(e.key==='Escape') modal.classList.remove('show');
}
render();
</script>
