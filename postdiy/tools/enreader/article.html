<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英语朗读</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<link rel="stylesheet" href="assets/style.css?v=25">
</head>
<body>

<!-- 左上角浮动返回按钮 -->
<button class="backfab" id="backBtn" title="返回阶段课程">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>

<main class="wrap">
  <div class="art-head">
    <h1 id="artTitle"></h1>
    <div class="art-sub" id="artSub"></div>
    <div class="art-meta" id="artMeta"></div>
  </div>
  <hr class="sep">
  <article id="artBody"></article>
</main>

<!-- 底部播放条 -->
<div class="player" id="player">
  <div class="player-in">
    <button class="pbtn" id="prevBtn" title="上一句">⏮</button>
    <button class="pbtn main" id="playBtn" title="播放 / 暂停">
      <svg id="icPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
      <svg id="icPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
    <button class="pbtn" id="nextBtn" title="下一句">⏭</button>
    <div class="pprog" id="pprog" title="点击跳转到对应句子">
      <div class="txt"><span id="pCount"></span><span class="cur-cn" id="pCur"></span></div>
      <div class="track"><div class="fill" id="pFill"></div></div>
    </div>
    <select class="ratesel" id="rateSel" title="语速">
      <option value="0.7">0.7x</option><option value="1" selected>1.0x</option>
      <option value="1.1">1.1x</option><option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option><option value="2">2x</option>
      <option value="3">3x</option>
    </select>
  </div>
</div>

<script src="data/course-manifest.js?v=19"></script>
<script src="assets/common.js?v=27"></script>
<script src="assets/article.js?v=27"></script>
</body>
</html>
