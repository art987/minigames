<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>闪喵抽奖</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 8px 40px; color: #fff;
}
h1 { font-size: 20px; margin-bottom: 4px; }
.subtitle { font-size: 12px; opacity: .6; margin-bottom: 12px; }

.grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; width: 320px; max-width: 100%; }
.cell {
  aspect-ratio: 1; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; background: rgba(255,255,255,.08);
  user-select: none; position: relative;
}
.cell.big-prize { background: rgba(255, 50, 50, .15); }
.cell.active {
  background: radial-gradient(circle, #fff 0%, #ffe066 30%, #ff8c00 60%, #e74c3c 100%);
  box-shadow: 0 0 15px 4px rgba(255,224,102,.8), 0 0 40px 10px rgba(255,140,0,.5), 0 0 80px 20px rgba(231,76,60,.3);
  z-index: 2;
}
.cell.winner {
  background: radial-gradient(circle, #ff6b6b, #ee5a24) !important;
  animation: winnerShake .4s infinite;
  box-shadow: 0 0 30px 10px rgba(255,107,107,.9), 0 0 60px 20px rgba(255,165,0,.5);
}
@keyframes winnerShake { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

.btn-area { margin-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.start-btn {
  padding: 16px 48px; font-size: 20px; font-weight: 800; border: none; border-radius: 30px;
  cursor: pointer; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
  box-shadow: 0 4px 20px rgba(102,126,234,.5); transition: transform .1s;
}
.start-btn:active { transform: scale(.95); }
.start-btn.boost { background: linear-gradient(135deg, #ff6b35, #f7931e); animation: shake .3s infinite; }
@keyframes shake { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05) rotate(1deg)} }

.fire-bar-wrap { width: 200px; height: 10px; background: rgba(255,255,255,.15); border-radius: 5px; overflow: hidden; }
.fire-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff6b35, #ffd700); border-radius: 5px; transition: width .2s; }
.countdown-text { font-size: 13px; color: #ffd700; height: 18px; }

.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 200; }
.modal-mask.show { display: flex; }
.modal {
  position: relative; background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 24px; padding: 32px 28px; text-align: center; max-width: 320px; width: 90%; color: #fff;
  box-shadow: 0 0 60px rgba(102,126,234,.6);
}
.close-x { position: absolute; top: 12px; right: 16px; font-size: 30px; line-height: 1; color: rgba(255,255,255,.7); cursor: pointer; font-weight: 700; }
.close-x:active { color: #fff; transform: scale(.85); }
.modal .modal-emoji { font-size: 56px; margin-bottom: 12px; animation: bounce 1s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.modal h3 { font-size: 20px; margin-bottom: 8px; }
.modal p { font-size: 14px; opacity: .9; margin-bottom: 20px; }
.modal button { padding: 14px 36px; background: linear-gradient(135deg, #ffd700, #ff8c00); color: #333; border: none; border-radius: 25px; font-size: 16px; font-weight: 700; cursor: pointer; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 150; }

.records { margin-top: 14px; width: 320px; max-width: 100%; }
.records h3 { font-size: 13px; opacity: .8; margin-bottom: 6px; }
.record-item { background: rgba(255,255,255,.1); border-radius: 6px; padding: 8px 10px; margin-bottom: 4px; font-size: 12px; display: flex; justify-content: space-between; cursor: pointer; }
.record-item:active { background: rgba(255,255,255,.2); }
.record-item.vip7 { color: #ffd700; }
.record-item.month { color: #ff6b6b; }
.record-item.year { color: #ff1493; font-weight: 700; }
</style>
</head>
<body>

<h1>🎡 闪喵幸运抽奖</h1>
<p class="subtitle">8×8 · 从外圈螺旋转到中心 · 无限测试版</p>

<div class="grid" id="grid"></div>

<div class="btn-area">
  <button class="start-btn" id="startBtn">🎯 开始抽奖</button>
  <div class="fire-bar-wrap"><div class="fire-bar" id="fireBar"></div></div>
  <div class="countdown-text" id="countdownText"></div>
</div>

<canvas id="confetti"></canvas>

<div class="modal-mask" id="modal">
  <div class="modal">
    <span class="close-x" onclick="closeModal()">×</span>
    <div class="modal-emoji" id="modalEmoji">🎉</div>
    <h3 id="modalTitle">恭喜中奖！</h3>
    <p id="modalDesc">你获得了xxx</p>
    <button onclick="closeModal()">太棒了！</button>
  </div>
</div>

<div class="records" id="records"></div>

<script>
/* ============================================================
 *  关键设计：全程只有一个位置变量 pos (0~63，螺旋顺序)
 *  - 跑动高亮：spiral[pos]        -> 取格子坐标
 *  - 奖品映射：PRIZES[pos]        -> 取该格奖品
 *  PRIZES 长度严格 = 64，索引 = pos，彻底消除两套索引错位
 * ============================================================ */

// 64 个奖品，索引 0~63 直接对应螺旋位置 pos
// pos 0=vip7, 1=month, 2=year, 3~63=资料(doc，共61个)
// 用程序生成，保证精确 64 条，杜绝手写遗漏
const DOC_EMOJIS = [
  '🍊','🍇','🍓','🫐','🍑','🍒','🥝','🍍','🥥','🥭', // 水果
  '🍌','🍐','🍋','🍈','🍉','🍏','🌸','🌹','🌻','🌺', // 水果+鲜花
  '🌷','🌼','🌵','🌴','🎋','🎍','🎑','🎐','🎏','🎀', // 植物+节庆
  '🎁','🎂','🍰','🧁','🍩','🍪','🍫','🍬','🍭','🍮', // 礼物甜点
  '⭐','🌟','✨','💫','🌙','☀️','🌈','☁️','⚡','🔥', // 星月天气
  '💖','💝','💗','💓','💞','💕','🎈','🎊','🏆','🎯', // 爱心+庆典
  '🍷','🍸','🥂','🍹','🥤','🧊','🍦','🍨','🥧','🥨'  // 补满到61个（饮品点心）
];

const PRIZES = [
  { emoji: '🍎', label: '7日VIP体验卡', type: 'vip7' },
  { emoji: '💎', label: '月卡VIP',       type: 'month' },
  { emoji: '👑', label: '年卡VIP',       type: 'year' },
  ...DOC_EMOJIS.slice(0, 61).map(emoji => ({ emoji, label: '虚拟资料礼包', type: 'doc' }))
];
console.assert(PRIZES.length === 64, 'PRIZES 必须为64，实际：' + PRIZES.length);

// 螺旋路径：pos -> (row, col)，顺时针从外圈到中心
const spiral = [];
for (let layer = 0; layer < 4; layer++) {
  const mn = layer, mx = 7 - layer;
  if (mn === mx) { spiral.push([mn, mn]); break; }
  for (let c = mn; c <= mx; c++) spiral.push([mn, c]);
  for (let r = mn + 1; r <= mx; r++) spiral.push([r, mx]);
  for (let c = mx - 1; c >= mn; c--) spiral.push([mx, c]);
  for (let r = mx - 1; r > mn; r--) spiral.push([r, mn]);
}
console.assert(spiral.length === 64, 'spiral 必须为64，实际：' + spiral.length);

// 奖品概率：返回 0~63 之间的 pos
function pickResultPos() {
  const r = Math.random();
  if (r < 0.00001) return 2;        // 年卡 0.001%  -> pos 2
  if (r < 0.00011) return 1;        // 月卡 0.01%   -> pos 1
  if (r < 0.05)   return 0;         // 7日VIP 5%   -> pos 0
  return 3 + Math.floor(Math.random() * 61);  // 资料 -> pos 3~63
}

// ===== 状态 =====
let state = {
  running: false,
  fire: 0,
  countdownTimer: null,
  records: []   // 每条: { pos, time }  —— 只存螺旋位置，三处都通过 PRIZES[pos] 取图标
};

// ===== 渲染网格：第 pos 格显示 PRIZES[pos].emoji =====
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let pos = 0; pos < 64; pos++) {
    const [r, c] = spiral[pos];
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.pos = pos;
    cell.innerHTML = PRIZES[pos].emoji;                 // ✅ 网格图标
    if (PRIZES[pos].type !== 'doc') cell.classList.add('big-prize');
    grid.appendChild(cell);
  }
}

// ===== 音效 =====
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playTick() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
  osc1.type = 'triangle'; osc1.frequency.value = 1200;
  g1.gain.setValueAtTime(.08, t); g1.gain.exponentialRampToValueAtTime(.001, t + .04);
  osc1.connect(g1).connect(audioCtx.destination); osc1.start(t); osc1.stop(t + .04);
  const osc2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
  osc2.type = 'sine'; osc2.frequency.value = 2400;
  g2.gain.setValueAtTime(.04, t); g2.gain.exponentialRampToValueAtTime(.001, t + .03);
  osc2.connect(g2).connect(audioCtx.destination); osc2.start(t); osc2.stop(t + .03);
  const notes = [523, 659, 784, 1047];
  const osc3 = audioCtx.createOscillator(), g3 = audioCtx.createGain();
  osc3.type = 'square'; osc3.frequency.value = notes[Math.floor(Math.random() * notes.length)];
  g3.gain.setValueAtTime(.03, t); g3.gain.exponentialRampToValueAtTime(.001, t + .05);
  osc3.connect(g3).connect(audioCtx.destination); osc3.start(t); osc3.stop(t + .05);
}

function playFireSound(fire) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const baseFreq = 300 + fire * 60;
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(baseFreq, t);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 4, t + .15);
  g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
  osc.connect(g).connect(audioCtx.destination); osc.start(t); osc.stop(t + .18);
  const bufferSize = audioCtx.sampleRate * .15;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
  const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 800;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(.2, t); ng.gain.exponentialRampToValueAtTime(.001, t + .15);
  noise.connect(bp).connect(ng).connect(audioCtx.destination); noise.start(t); noise.stop(t + .15);
}

function playWin() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [523, 659, 784, 1047].forEach((freq, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.frequency.value = freq; osc.type = 'triangle';
    gain.gain.setValueAtTime(.12, t + i * .1); gain.gain.exponentialRampToValueAtTime(.001, t + i * .1 + .3);
    osc.connect(gain).connect(audioCtx.destination); osc.start(t + i * .1); osc.stop(t + i * .1 + .3);
  });
}

function fireConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const particles = [];
  for (let i = 0; i < 100; i++) {
    particles.push({
      x: canvas.width / 2, y: canvas.height / 2,
      vx: (Math.random() - .5) * 16, vy: (Math.random() - .8) * 16,
      color: `hsl(${Math.random()*360},100%,60%)`,
      size: Math.random() * 7 + 3, life: 1
    });
  }
  function anim() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.vy += .25; p.life -= .012;
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;
    if (alive) requestAnimationFrame(anim);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  anim();
}

// ===== 开始抽奖 =====
function startLottery() {
  initAudio();
  state.running = true;
  state.fire = 0;
  updateFireBar();
  document.getElementById('countdownText').textContent = '';

  const btn = document.getElementById('startBtn');
  btn.classList.add('boost');
  btn.textContent = '🔥 加火力！狂点这里';

  // resultPos：最终停在哪个螺旋位置（0~63）
  const resultPos = pickResultPos();
  let stepIndex = 0;
  let currentInterval = 50;                 // 默认速度（翻倍）
  const totalSteps = (2 + state.fire) * 64 + resultPos + 1;

  document.querySelectorAll('.cell').forEach(c => c.classList.remove('active', 'winner'));
  startCountdown();

  function stepOnce() {
    if (!state.running) return;

    // 清除上一格高亮，点亮当前格：pos = stepIndex % 64
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
    const pos = stepIndex % 64;
    const [r, c] = spiral[pos];
    const cell = getCellAt(r, c);
    if (cell) { cell.classList.add('active'); playTick(); }

    stepIndex++;

    if (stepIndex < totalSteps) {
      // 最后20步减速
      let speed = currentInterval;
      if (stepIndex > totalSteps - 20) {
        speed = Math.min(currentInterval + (stepIndex - (totalSteps - 20)) * 12, 200);
      }
      timer = setTimeout(stepOnce, speed);
    } else {
      // ===== 停下：stepIndex === totalSteps
      // 此时 pos = (totalSteps - 1) % 64 = resultPos  ✅ 精确停在目标格
      document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
      const [fr, fc] = spiral[resultPos];
      const winner = getCellAt(fr, fc);
      if (winner) { winner.classList.add('winner'); showResult(resultPos); }  // ✅ 传 pos
      state.running = false;
      btn.classList.remove('boost');
      btn.textContent = '🎯 开始抽奖';
      clearInterval(state.countdownTimer);
      document.getElementById('countdownText').textContent = '';
    }
  }
  let timer = setTimeout(stepOnce, currentInterval);
}

function addFire() {
  if (!state.running) return;
  if (state.fire >= 10) return;
  state.fire++;
  updateFireBar();
  playFireSound(state.fire);
  startCountdown();
}

function startCountdown() {
  clearInterval(state.countdownTimer);
  let left = 3;
  document.getElementById('countdownText').textContent = '⏱ 停止倒计时：3秒';
  state.countdownTimer = setInterval(() => {
    left--;
    if (left > 0) document.getElementById('countdownText').textContent = `⏱ 停止倒计时：${left}秒`;
    else { document.getElementById('countdownText').textContent = ''; clearInterval(state.countdownTimer); }
  }, 1000);
}

function updateFireBar() { document.getElementById('fireBar').style.width = (state.fire / 10 * 100) + '%'; }
function getCellAt(r, c) { return document.getElementById('grid').children[r * 8 + c]; }

document.getElementById('startBtn').addEventListener('click', () => {
  if (!state.running) startLottery();
  else addFire();
});

// ===== 中奖展示：统一用 PRIZES[pos] =====
function showResult(pos) {
  const prize = PRIZES[pos];                              // ✅ 停下格子的奖品
  document.getElementById('modalEmoji').textContent = prize.emoji;   // ✅ 与格子同图标
  document.getElementById('modalDesc').textContent = prize.label;
  document.getElementById('modalTitle').textContent =
    prize.type === 'year' ? '💎 天选之子！年卡VIP！' :
    prize.type === 'month' ? '🃏 运气爆棚！月卡VIP！' :
    prize.type === 'vip7' ? '🍎 恭喜获得7日VIP！' : '🎁 恭喜获得虚拟资料！';
  document.getElementById('modal').classList.add('show');
  if (prize.type !== 'doc') playWin();
  if (prize.type === 'year' || prize.type === 'month') fireConfetti();

  state.records.unshift({ pos: pos, time: Date.now() });   // ✅ 只存 pos
  renderRecords();
}

// ===== 点历史记录再弹：同样 PRIZES[pos] =====
function reopenRecord(i) {
  const rec = state.records[i];
  if (rec == null) return;
  const prize = PRIZES[rec.pos];                            // ✅ 同一奖品
  document.getElementById('modalEmoji').textContent = prize.emoji;
  document.getElementById('modalDesc').textContent = prize.label;
  document.getElementById('modalTitle').textContent =
    prize.type === 'year' ? '💎 年卡VIP' :
    prize.type === 'month' ? '🃏 月卡VIP' :
    prize.type === 'vip7' ? '🍎 7日VIP' : '🎁 虚拟资料';
  document.getElementById('modal').classList.add('show');
  if (prize.type === 'year' || prize.type === 'month') fireConfetti();
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

// ===== 记录渲染：PRIZES[pos] =====
function renderRecords() {
  const el = document.getElementById('records');
  el.innerHTML = '<h3>📋 中奖记录（点击可重看）</h3>' +
    state.records.slice(0, 15).map((rec, i) => {
      const prize = PRIZES[rec.pos];
      return `<div class="record-item ${prize.type}" onclick="reopenRecord(${i})">
         <span>${prize.emoji} ${prize.label}</span>
         <span>${new Date(rec.time).toLocaleTimeString()}</span>
       </div>`;
    }).join('');
}

renderGrid();
</script>
</body>
</html>
