<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>闪喵推广视频制作工具</title>
    <meta name="description" content="闪喵海报：节日海报一键生成，自定义品牌信息，助力中小商家朋友圈营销。">
    <link rel="stylesheet" href="promo.css">
    <link rel="stylesheet" href="promo-edit.css">
</head>
<body>
    <!-- 自定义背景图层（点击页面空白背景区域可上传配置） -->
    <div class="custom-bg" id="customBg" aria-hidden="true"></div>
    <!-- 背景光斑 -->
    <div class="bg-orbs" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
        <span class="orb orb-4"></span>
    </div>

    <div class="page">
        <!-- 第一版块：主标题 / 副标题 -->
        <header class="hero">
            <h1 class="hero-title">中秋节快到了</h1>
            <p class="hero-subtitle">你的朋友圈海报准备好了吗</p>
        </header>

        <!-- 第二版块：应用展示 -->
        <main class="showcase">
            <!-- 左：手机模型 + 视频演示 -->
            <div class="phone-wrap">
                <div class="phone-glow" aria-hidden="true"></div>
                <div class="phone">
                    <span class="phone-notch" aria-hidden="true"></span>
                    <div class="phone-screen">
                        <!-- 视频未上传时默认展示官网页面（缩放 0.5，可直接操作页面内容）；视频上传/加载后由视频层覆盖 -->
                        <iframe class="screen-site" src="https://peacelove.top/postdiy/" title="闪喵海报演示页面" loading="lazy"></iframe>
                        <!--
                            交互：点击右侧 App logo 上传本地视频预览；长按 logo 1 秒移除视频，还原嵌套网页
                            视频文件就绪后，将下方 <source> 的 src 换成实际视频路径即可
                            例如：<source src="promo-demo.mp4" type="video/mp4">
                        -->
                        <video class="screen-video" muted loop playsinline autoplay preload="metadata" webkit-playsinline>
                            <source src="promo-demo.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>
            </div>

            <!-- 右：应用信息 + 特点罗列 -->
            <div class="app-info">
                <div class="app-badge">
                    <div class="app-logo">
                        <img src="../images/statics/applogo2.png" alt="闪喵海报Applogo">
                    </div>
                    <h2 class="app-name">闪喵海报</h2>
                </div>

                <ul class="feature-list">
                    <li class="feature-item">
                        <span class="feature-text">1、自定义品牌</span>
                        <span class="feature-check" aria-hidden="true">
                            <svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </li>
                    <li class="feature-item">
                        <span class="feature-text">2、引流文案模板</span>
                        <span class="feature-check" aria-hidden="true">
                            <svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </li>
                    <li class="feature-item">
                        <span class="feature-text">3、传统节日海报</span>
                        <span class="feature-check" aria-hidden="true">
                            <svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </li>
                    <li class="feature-item">
                        <span class="feature-text">4、国际节日海报</span>
                        <span class="feature-check" aria-hidden="true">
                            <svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </li>
                    <li class="feature-item">
                        <span class="feature-text">5、24节气海报</span>
                        <span class="feature-check" aria-hidden="true">
                            <svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </li>
                    <li class="feature-item">
                        <span class="feature-text">6、早/晚安海报</span>
                        <span class="feature-check" aria-hidden="true">
                            <svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </li>
                    <li class="feature-item">
                        <span class="feature-text">7、经营展示海报</span>
                        <span class="feature-check" aria-hidden="true">
                            <svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </li>
                </ul>
            </div>
        </main>

        <!-- 第三版块：口号 + 备案号 -->
        <footer class="slogan-section">
            <p class="slogan">把握每次宣传机会&nbsp;&nbsp;提升品牌认知与信任</p>
            <a class="icp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">闽ICP备2022019423号-3A</a>
        </footer>
    </div>

    <!-- 页面临时编辑功能（数据临时存于浏览器 localStorage） -->
    <input type="file" id="editVideoInput" class="edit-video-input" accept="video/mp4,video/webm,video/ogg">
    <div class="edit-modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
        <div class="edit-modal-mask" data-edit-close></div>
        <div class="edit-modal-card">
            <div class="edit-modal-head">
                <h3 class="edit-modal-title" id="editModalTitle">编辑文字</h3>
                <button type="button" class="edit-modal-close" data-edit-close aria-label="关闭">
                    <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2 L12 12 M12 2 L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <label class="edit-field-label" for="editTextArea">文字内容</label>
            <textarea id="editTextArea" class="edit-textarea" rows="3"></textarea>
            <div class="edit-size-row">
                <label class="edit-field-label" for="editSizeRange">字体大小</label>
                <input type="range" id="editSizeRange" class="edit-size-range" min="14" max="72" step="1">
                <span class="edit-size-value" id="editSizeValue">32px</span>
            </div>
            <div class="grad-section" id="gradSection" hidden>
                <label class="edit-field-label">标题渐变配色</label>
                <div class="grad-swatches" id="gradSwatches"></div>
            </div>
            <div class="grad-section" id="colorSection" hidden>
                <label class="edit-field-label">文字颜色</label>
                <div class="color-swatches" id="colorSwatches"></div>
            </div>
            <div class="edit-history" id="editHistoryWrap" hidden>
                <p class="edit-history-title">历史编辑（点击填充到编辑框）</p>
                <ul class="edit-history-list" id="editHistoryList"></ul>
            </div>
            <div class="edit-actions">
                <button type="button" class="edit-btn edit-btn-ghost" id="editResetBtn">恢复默认</button>
                <button type="button" class="edit-btn edit-btn-ghost" id="editCancelBtn">取消</button>
                <button type="button" class="edit-btn edit-btn-primary" id="editSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 自定义背景图片弹窗（点击页面空白背景区域打开） -->
    <div class="edit-modal" id="bgModal" role="dialog" aria-modal="true" aria-labelledby="bgModalTitle">
        <div class="edit-modal-mask" data-bg-close></div>
        <div class="edit-modal-card">
            <div class="edit-modal-head">
                <h3 class="edit-modal-title" id="bgModalTitle">自定义背景图片</h3>
                <button type="button" class="edit-modal-close" data-bg-close aria-label="关闭">
                    <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2 L12 12 M12 2 L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <input type="file" id="bgFileInput" accept="image/*" hidden>
            <label class="edit-field-label">铺放方式</label>
            <div class="bg-fits" id="bgFits">
                <button type="button" class="bg-opt" data-fit="cover">等比铺满</button>
                <button type="button" class="bg-opt" data-fit="contain">等比完整</button>
                <button type="button" class="bg-opt" data-fit="stretch">拉伸铺满</button>
                <button type="button" class="bg-opt" data-fit="repeat">平铺</button>
                <button type="button" class="bg-opt" data-fit="center">居中原图</button>
            </div>
            <div class="edit-size-row">
                <label class="edit-field-label" for="bgBlurRange">虚化程度</label>
                <input type="range" id="bgBlurRange" class="edit-size-range" min="0" max="30" step="1" value="0">
                <span class="edit-size-value" id="bgBlurValue">0px</span>
            </div>
            <p class="bg-tip">设置即时生效并临时保存在浏览器本地；点击页面空白背景区域可再次打开</p>
            <div class="edit-actions bg-actions">
                <button type="button" class="edit-btn edit-btn-ghost" id="tplPickerBtn">选模板图</button>
                <button type="button" class="edit-btn edit-btn-primary" id="bgUploadBtn">本地上传</button>
                <button type="button" class="edit-btn edit-btn-ghost" id="bgResetBtn">恢复默认</button>
            </div>
        </div>
    </div>

    <!-- 模板背景图选择弹窗（数据来自海报模板库 templates.js） -->
    <div class="edit-modal" id="tplModal" role="dialog" aria-modal="true" aria-labelledby="tplModalTitle">
        <div class="edit-modal-mask" data-tpl-close></div>
        <div class="edit-modal-card tpl-modal-card">
            <div class="edit-modal-head">
                <h3 class="edit-modal-title" id="tplModalTitle">模板背景图库</h3>
                <button type="button" class="edit-modal-close" data-tpl-close aria-label="关闭">
                    <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2 L12 12 M12 2 L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="tpl-months" id="tplMonths"></div>
            <div class="tpl-festivals" id="tplFestivals"></div>
            <div class="tpl-grid" id="tplGrid"></div>
            <p class="bg-tip">点击任意模板图即可设为推广页背景，关闭后可继续调整铺放方式与虚化</p>
        </div>
    </div>
    <script src="promo-edit.js"></script>
</body>
</html>
