<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工具库 - 闪喵经营诊断</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page-tools.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <!-- 页面头部：分类筛选 -->
  <header class="biz-page-header">
    <div class="tools-page-top">
      <span class="tools-page-back" onclick="window.location.href='solutions.html'">
        <i data-lucide="chevron-left" class="biz-icon" style="width:20px;height:20px;"></i>
      </span>
      <h1>工具库</h1>
      <span style="width:20px;"></span>
    </div>
    <div class="biz-filter-tags" id="filterTags">
      <!-- JS动态渲染 -->
    </div>
  </header>

  <!-- 工具列表 -->
  <main class="biz-page">
    <div class="biz-tool-list" id="toolList">
      <!-- JS动态渲染 -->
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/biz-data.js"></script>
  <script src="js/data-service.js"></script>
  <script>
    // 工具库页面逻辑
    var ToolsPage = {
      // 分类列表
      categories: ['全部', '营销', '管理', '财务', '客户', '运营'],
      currentCategory: '全部',
      allTools: [],

      // 分类对应 Lucide 图标名
      categoryIconNames: {
        '营销': 'megaphone',
        '管理': 'hard-hat',
        '财务': 'calculator',
        '客户': 'heart',
        '运营': 'bar-chart-3'
      },
      // 分类对应颜色
      categoryColors: {
        '营销': '#0071E3',
        '管理': '#0071E3',
        '财务': '#0071E3',
        '客户': '#0071E3',
        '运营': '#0071E3'
      },

      init: function() {
        BizDataService.init();
        this.checkAppEnvironment();
        this.renderFilterTags();
        this.loadTools();
      },

      // 检测是否在APP环境中
      checkAppEnvironment: function() {
        var ua = navigator.userAgent.toLowerCase();
        var isApp = ua.indexOf('wv') > -1 || // Android WebView
                    ua.indexOf('webview') > -1 ||
                    ua.indexOf('miniProgram') > -1 || // 小程序
                    window.self !== window.top; // 被嵌入iframe

        if (isApp) {
          // 隐藏顶部导航栏
          var topbar = document.querySelector('.tools-page-top');
          if (topbar) {
            topbar.style.display = 'none';
          }
        }
      },

      // 渲染筛选标签
      renderFilterTags: function() {
        var container = document.getElementById('filterTags');
        if (!container) return;
        container.innerHTML = this.categories.map(function(cat) {
          var activeClass = cat === ToolsPage.currentCategory ? ' active' : '';
          return '<span class="biz-filter-tag' + activeClass + '" onclick="ToolsPage.onFilter(\'' + cat + '\')">' + cat + '</span>';
        }).join('');
      },

      // 加载工具数据
      loadTools: function() {
        // 从BizData读取工具数据
        var toolsArr = [];
        if (Array.isArray(BizData.tools)) {
          toolsArr = BizData.tools;
        } else {
          var toolKeys = Object.keys(BizData.tools || {});
          for (var i = 0; i < toolKeys.length; i++) {
            toolsArr.push(BizData.tools[toolKeys[i]]);
          }
        }
        var rawTools = toolsArr;
        this.allTools = rawTools.map(function(t, i) {
          return Object.assign({}, t, {
            downloadCount: t.downloadCount || (1200 - i * 300 + Math.floor(Math.random() * 200))
          });
        });
        this.renderList();
      },

      // 渲染工具列表
      renderList: function() {
        var container = document.getElementById('toolList');
        if (!container) return;

        // 按分类筛选
        var filtered = this.allTools.filter(function(t) {
          return ToolsPage.currentCategory === '全部' || (t.category || '') === ToolsPage.currentCategory;
        });

        if (filtered.length === 0) {
          container.innerHTML = '<div class="biz-empty">' +
            '<span class="biz-empty-icon">' + BizUtils.icon('inbox', 40) + '</span>' +
            '<span class="biz-empty-text">暂无该分类工具</span>' +
          '</div>';
          BizUtils.replaceIcons();
          return;
        }

        container.innerHTML = filtered.map(function(t) {
          var iconName = ToolsPage.categoryIconNames[t.category] || 'file-text';
          var iconColor = ToolsPage.categoryColors[t.category] || '#0071E3';
          var bgColor = iconColor + '14';
          return '<div class="biz-tool-card" onclick="ToolsPage.onView(\'' + t._id + '\')">' +
            '<div class="card-top">' +
              '<div class="card-icon" style="background:' + bgColor + ';color:' + iconColor + '">' + BizUtils.icon(iconName, 22) + '</div>' +
              '<div class="card-info">' +
                '<div class="card-name">' + t.name + '</div>' +
                '<div class="card-type">' + t.type + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="card-bottom">' +
              '<span class="biz-tag biz-tag-primary">' + t.category + '</span>' +
              '<span class="card-download">下载 <strong>' + BizUtils.formatNumber(t.downloadCount) + '</strong> 次</span>' +
            '</div>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      // 切换分类
      onFilter: function(category) {
        this.currentCategory = category;
        this.renderFilterTags();
        this.renderList();
      },

      // 查看工具详情
      onView: function(id) {
        window.location.href = 'tool-detail.html?toolId=' + id;
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      ToolsPage.init();
      BizUtils.replaceIcons();
    });
  </script>
</body>
</html>
