<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清除缓存</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    h1 { margin-bottom: 20px; }
    p { margin: 10px 0; font-size: 16px; }
    .success { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>清除缓存中...</h1>
    <p id="status">正在清除 localStorage...</p>
    <p id="result"></p>
  </div>

  <script>
    // 清除所有缓存数据
    setTimeout(function() {
      try {
        localStorage.removeItem('admin_cases_v3');
        localStorage.removeItem('admin_tools_v3');
        localStorage.removeItem('admin_tags_v3');
        localStorage.removeItem('admin_problems_v2');
        localStorage.removeItem('admin_solutions_v2');
        localStorage.removeItem('admin_paths_v3');
        localStorage.removeItem('admin_data_timestamp');

        document.getElementById('status').textContent = '缓存已清除！';
        document.getElementById('result').innerHTML = '<span class="success">✓ 将在2秒后跳转到方案库</span>';

        // 2秒后跳转到方案库
        setTimeout(function() {
          window.location.href = 'solutions.html?chapter=3&sub=301';
        }, 2000);
      } catch (e) {
        document.getElementById('status').textContent = '清除失败：' + e.message;
      }
    }, 500);
  </script>
</body>
</html>
