<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>闪喵经营诊断 - 你的店，我来把脉</title>
  <meta name="description" content="3步找到你的经营答案，实体老板的经营诊断助手。">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page-index.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="index-topbar">
    <span class="index-topbar-back" onclick="window.location.href='solutions.html'">
      <i data-lucide="chevron-left" class="biz-icon" style="width:20px;height:20px;"></i>
    </span>
    <span class="index-topbar-title">经营诊断</span>
    <span style="width:20px;"></span>
  </header>

  <main class="biz-page">
    <!-- 核心问题入口 -->
    <section class="biz-section">
      <p class="biz-question-title">老板，你现在遇到<em>什么问题</em>？</p>
      <div class="biz-problem-grid" id="problemGrid">
        <!-- JS动态渲染 -->
      </div>
    </section>
  </main>

  <!-- 店铺资料引导弹窗 -->
  <div class="shop-profile-overlay" id="shopProfileOverlay" style="display:none">
    <div class="shop-profile-card">
      <div class="shop-profile-title">先设置你的店铺信息</div>
      <div class="shop-profile-subtitle">设置后，后续诊断将自动匹配</div>

      <div class="shop-profile-label" id="profileShopNameLabel">店名（选填）</div>
      <input type="text" class="shop-profile-input" id="profileShopName" placeholder="比如：张姐火锅店" maxlength="20">
      <input type="hidden" id="profileShopNameAuto" value="">

      <div class="shop-profile-label">你的行业</div>
      <div class="shop-profile-industry-scroll" id="profileIndustryOptions">
        <!-- JS动态渲染行业分组 -->
      </div>

      <div class="shop-profile-label">经营阶段</div>
      <div class="shop-profile-options" id="profileStageOptions">
        <div class="shop-profile-option" data-value="新店" onclick="ShopProfileGuide.selectStage(this, '新店')">
          <span class="opt-icon"><i data-lucide="sparkles" class="biz-icon" style="width:24px;height:24px;"></i></span>
          <span class="opt-name">新店</span>
        </div>
        <div class="shop-profile-option" data-value="成长期" onclick="ShopProfileGuide.selectStage(this, '成长期')">
          <span class="opt-icon"><i data-lucide="trending-up" class="biz-icon" style="width:24px;height:24px;"></i></span>
          <span class="opt-name">成长期</span>
        </div>
        <div class="shop-profile-option" data-value="老店" onclick="ShopProfileGuide.selectStage(this, '老店')">
          <span class="opt-icon"><i data-lucide="store" class="biz-icon" style="width:24px;height:24px;"></i></span>
          <span class="opt-name">老店</span>
        </div>
      </div>

      <button class="shop-profile-btn" id="profileStartBtn" disabled onclick="ShopProfileGuide.saveAndClose()">开始使用</button>
      <div class="shop-profile-footer">可随时在「我的」中修改</div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/biz-data.js"></script>
  <script src="js/data-service.js"></script>
  <script>
    // 问题卡片极淡蓝灰色系
    var problemTints = [
      'rgba(255,149,0,0.08)',   // 橙 - 没有客流
      'rgba(255,59,48,0.08)',   // 红 - 营业额下降
      'rgba(255,149,0,0.08)',   // 橙 - 利润太低
      'rgba(175,82,222,0.08)',  // 紫 - 产品卖不动
      'rgba(255,45,85,0.08)',   // 粉 - 老客户流失
      'rgba(175,82,222,0.08)',  // 紫 - 员工管理困难
      'rgba(52,199,89,0.08)',   // 绿 - 营销推广困难
      'rgba(0,122,255,0.08)'    // 蓝 - 竞争压力大
    ];
    var problemIconColors = [
      '#0071E3',  // 橙
      '#0071E3',  // 红
      '#0071E3',  // 橙
      '#0071E3',  // 紫
      '#0071E3',  // 粉
      '#0071E3',  // 紫
      '#0071E3',  // 绿
      '#0071E3'   // 蓝
    ];

    // 店铺资料引导弹窗逻辑
    var ShopProfileGuide = {
      selectedIndustry: '',
      selectedStage: '',

      init: function() {
        this.renderIndustryOptions();
      },

      renderIndustryOptions: function() {
        var container = document.getElementById('profileIndustryOptions');
        if (!container) return;
        var self = this;
        var majorIndustries = BizLocalData.majorIndustries || [];
        var selectedMajor = this.selectedMajorIndustry || '';

        var html = '';
        // 第一行：大类选择
        html += '<div class="shop-profile-industry-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px;">';
        for (var i = 0; i < majorIndustries.length; i++) {
          var mi = majorIndustries[i];
          var sel = selectedMajor === mi.code ? ' selected' : '';
          html += '<div class="shop-profile-industry-item' + sel + '" onclick="ShopProfileGuide.selectMajorIndustry(this, \'' + mi.code + '\')">' +
            '<span class="ii-icon">' + BizUtils.icon(mi.icon, 22) + '</span>' +
            '<span class="ii-name">' + mi.name + '</span>' +
          '</div>';
        }
        html += '</div>';

        // 第二行：已选大类对应的小类
        if (selectedMajor) {
          var minors = (BizLocalData.industries || []).filter(function(ind) {
            return ind.majorCategory === selectedMajor && ind.code !== '通用';
          });
          if (minors.length > 0) {
            html += '<div class="industry-group-title">选择细分行业（可选）</div>';
            html += '<div class="shop-profile-industry-grid">';
            for (var k = 0; k < minors.length; k++) {
              var item = minors[k];
              var minorSel = self.selectedIndustry === item.code ? ' selected' : '';
              html += '<div class="shop-profile-industry-item' + minorSel + '" data-value="' + item.code + '" onclick="ShopProfileGuide.selectIndustry(this, \'' + item.code + '\')">' +
                '<span class="ii-icon">' + BizUtils.icon(item.icon, 18) + '</span>' +
                '<span class="ii-name">' + item.name + '</span>' +
              '</div>';
            }
            html += '</div>';
          }
        }

        container.innerHTML = html;
        BizUtils.replaceIcons();
      },

      check: function() {
        var profile = localStorage.getItem('biz_shop_profile');
        if (!profile) {
          this.show();
        }
      },

      show: function() {
        // 如果海报系统有品牌名，自动填入并隐藏店名输入区域
        var sharedName = BizUtils.getSharedShopName();
        var nameInput = document.getElementById('profileShopName');
        var nameLabel = document.getElementById('profileShopNameLabel');
        var nameAuto = document.getElementById('profileShopNameAuto');
        if (sharedName) {
          nameInput.value = sharedName;
          nameAuto.value = sharedName;
          // 隐藏店名输入区域，用户不需要再填
          nameInput.style.display = 'none';
          nameLabel.style.display = 'none';
        } else {
          nameInput.style.display = '';
          nameLabel.style.display = '';
        }
        document.getElementById('shopProfileOverlay').style.display = 'flex';
      },

      hide: function() {
        document.getElementById('shopProfileOverlay').style.display = 'none';
      },

      selectMajorIndustry: function(el, value) {
        this.selectedMajorIndustry = value;
        // 选大类时自动设置 selectedIndustry 为大类
        this.selectedIndustry = value;
        this.renderIndustryOptions();
        this.updateBtn();
      },

      selectIndustry: function(el, value) {
        this.selectedIndustry = value;
        // 更新小类选中状态（不重新渲染大类，只切换 selected class）
        var options = document.querySelectorAll('#profileIndustryOptions .shop-profile-industry-grid:last-child .shop-profile-industry-item');
        for (var i = 0; i < options.length; i++) {
          options[i].classList.remove('selected');
        }
        el.classList.add('selected');
        this.updateBtn();
      },

      selectStage: function(el, value) {
        this.selectedStage = value;
        var options = document.querySelectorAll('#profileStageOptions .shop-profile-option');
        for (var i = 0; i < options.length; i++) {
          options[i].classList.remove('selected');
        }
        el.classList.add('selected');
        this.updateBtn();
      },

      updateBtn: function() {
        var btn = document.getElementById('profileStartBtn');
        btn.disabled = !this.selectedIndustry;
      },

      saveAndClose: function() {
        var shopName = document.getElementById('profileShopName').value.trim();
        var profile = {
          shopName: shopName,
          industry: this.selectedMajorIndustry || this.selectedIndustry,
          minorIndustry: (this.selectedIndustry !== this.selectedMajorIndustry) ? this.selectedIndustry : '',
          stage: this.selectedStage,
          createdAt: new Date().toISOString()
        };
        localStorage.setItem('biz_shop_profile', JSON.stringify(profile));
        this.hide();
      }
    };

    // 首页逻辑
    var HomePage = {
      problems: [],
      init: function() {
        BizDataService.init();
        // 渲染 Header Logo 图标
        var headerLogo = document.getElementById('headerLogoIcon');
        if (headerLogo) headerLogo.innerHTML = BizUtils.icon('activity', 28);
        this.loadProblems();
        ShopProfileGuide.init();
        ShopProfileGuide.check();
        BizUtils.replaceIcons();
      },

      loadProblems: function() {
        this.problems = BizData.problems;
        this.renderProblems();
      },

      renderProblems: function() {
        var grid = document.getElementById('problemGrid');
        if (!grid) return;
        grid.innerHTML = this.problems.map(function(p, i) {
          var tint = problemTints[i % problemTints.length];
          var iconColor = problemIconColors[i % problemIconColors.length];
          return '<div class="biz-problem-card" data-code="' + p.code + '" onclick="HomePage.startDiagnosis(\'' + p.code + '\')" style="--card-bg-tint:' + tint + ';--icon-color:' + iconColor + '">' +
            '<span class="p-icon" style="color:' + iconColor + '">' + BizUtils.icon(p.icon, 28) + '</span>' +
            '<span class="p-name">' + p.name + '</span>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      renderHotList: function() {
        var list = document.getElementById('hotList');
        if (!list) return;
        var sorted = this.problems.slice().sort(function(a, b) {
          return b.diagnosisCount - a.diagnosisCount;
        }).slice(0, 5);

        list.innerHTML = sorted.map(function(p, i) {
          var rankClass = i < 3 ? ' top' + (i + 1) : '';
          return '<div class="biz-hot-item" onclick="HomePage.startDiagnosis(\'' + p.code + '\')">' +
            '<span class="biz-hot-rank' + rankClass + '">' + (i + 1) + '</span>' +
            '<span class="biz-hot-name">' + BizUtils.icon(p.icon, 16) + ' ' + p.name + '</span>' +
            '<span class="biz-hot-count">' + BizUtils.formatNumber(p.diagnosisCount) + '人</span>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      loadChapterList: function() {
        var list = document.getElementById('chapterList');
        if (!list) return;
        var chapters = BizData.chapters || [];
        list.innerHTML = chapters.map(function(ch) {
          var subsHtml = '';
          if (ch.subs && ch.subs.length) {
            subsHtml = '<div class="ce-subs">' +
              ch.subs.map(function(sub) {
                return '<span class="ce-sub" onclick="event.stopPropagation();window.location.href=\'solutions.html?chapter=' + ch.id + '&sub=' + sub.id + '\'">' + sub.name + '</span>';
              }).join('') +
            '</div>';
          }
          return '<div class="biz-chapter-entry" style="background-image:linear-gradient(' + HomePage.hexToRgba(ch.color, 0.06) + ',' + HomePage.hexToRgba(ch.color, 0.06) + '),#fff;" onclick="window.location.href=\'solutions.html?chapter=' + ch.id + '\'">' +
            '<div class="ce-header">' +
              '<span class="ce-icon" style="color:' + ch.color + '">' + BizUtils.icon(ch.icon, 22) + '</span>' +
              '<div>' +
                '<div class="ce-name">' + ch.name + '</div>' +
                '<div class="ce-desc">' + ch.desc + '</div>' +
              '</div>' +
            '</div>' +
            subsHtml +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      hexToRgba: function(hex, alpha) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      },

      loadTools: function() {
        var scroll = document.getElementById('toolScroll');
        if (!scroll) return;
        var toolIconMap = {
          '客流管理': 'bar-chart-3',
          '门店运营': 'layout-grid',
          '营销推广': 'megaphone',
          '客户管理': 'users',
          '经营分析': 'line-chart',
          '成本管理': 'scissors',
          '产品管理': 'package',
          '人员管理': 'user-check',
          '营销': 'megaphone',
          '管理': 'clipboard-list',
          '财务': 'calculator',
          '客户': 'heart'
        };
        var toolColorMap = {
          '客流管理': '#0071E3',
          '门店运营': '#0071E3',
          '营销推广': '#0071E3',
          '客户管理': '#0071E3',
          '经营分析': '#0071E3',
          '成本管理': '#0071E3',
          '产品管理': '#0071E3',
          '人员管理': '#0071E3',
          '营销': '#0071E3',
          '管理': '#0071E3',
          '财务': '#0071E3',
          '客户': '#0071E3'
        };
        var toolsArr = [];
        var toolKeys = Object.keys(BizData.tools || {});
        for (var i = 0; i < toolKeys.length; i++) {
          toolsArr.push(BizData.tools[toolKeys[i]]);
        }
        scroll.innerHTML = toolsArr.map(function(t) {
          var iconName = t.icon || toolIconMap[t.category] || 'file-text';
          var iconColor = toolColorMap[t.category] || '#0071E3';
          return '<div class="biz-tool-card">' +
            '<div class="t-icon" style="background:' + iconColor + '14;color:' + iconColor + '">' + BizUtils.icon(iconName, 20) + '</div>' +
            '<div class="t-name">' + t.name + '</div>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      startDiagnosis: function(problemCode) {
        BizUtils.saveDiagnosisState({
          currentStep: 1,
          problemCode: problemCode,
          industry: '',
          stage: '',
          symptomIds: [],
          startTime: Date.now()
        });
        window.location.href = 'diagnosis.html?problem=' + problemCode;
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      HomePage.init();
    });
  </script>

</body>
</html>
