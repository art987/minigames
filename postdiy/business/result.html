<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>诊断结果 - 闪喵经营诊断</title>
  <meta name="description" content="查看你的经营诊断结果，获取改善方案">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/page-result.css">
</head>
<body>
  <!-- 顶部栏 -->
  <header class="result-topbar">
    <div class="result-topbar-left">
      <span class="result-topbar-back" id="btnBack" onclick="history.back()"></span>
      <span class="result-topbar-title">诊断结果</span>
    </div>
    <button class="result-fav-btn" id="favBtn" onclick="ResultPage.toggleFav()">
      <span id="favIcon"></span>
      <span id="favText">收藏</span>
    </button>
  </header>

  <main class="biz-page">
    <!-- 1. 问题概览 -->
    <section class="biz-section" id="overviewSection">
      <p class="biz-section-title"><i data-lucide="clipboard-list" class="biz-icon" style="width:16px;height:16px;"></i> 你的问题</p>
    </section>

    <!-- 2. 可能原因排序 -->
    <section class="biz-section result-causes" id="causesSection">
      <p class="biz-section-title"><i data-lucide="search" class="biz-icon" style="width:16px;height:16px;"></i> 问题原因</p>
      <div id="causesList"></div>
    </section>

    <!-- 3. 推荐方案卡片 -->
    <section class="biz-section result-solutions" id="solutionsSection">
      <p class="biz-section-title"><i data-lucide="lightbulb" class="biz-icon" style="width:16px;height:16px;"></i> 推荐方案</p>
      <div id="solutionsList"></div>
    </section>

    <!-- 4. 今日执行任务 -->
    <section class="biz-section result-today" id="todaySection">
      <p class="biz-section-title"><i data-lucide="zap" class="biz-icon" style="width:16px;height:16px;"></i> 立即执行</p>
      <div id="todayTasksList"></div>
    </section>

    <!-- 5. 7天改善计划 -->
    <section class="biz-section result-weekplan" id="weekPlanSection">
      <p class="biz-section-title"><i data-lucide="calendar" class="biz-icon" style="width:16px;height:16px;"></i> 7天改善计划</p>
      <div class="result-week-tabs" id="weekTabs"></div>
      <div id="weekContent"></div>
    </section>

    <!-- 6. 长期优化方向 -->
    <section class="biz-section" id="longTermSection">
      <p class="biz-section-title"><i data-lucide="target" class="biz-icon" style="width:16px;height:16px;"></i> 长期优化方向</p>
      <div class="long-term-advice" id="longTermList"></div>
    </section>

    <!-- 7. 相关案例 -->
    <section class="biz-section result-cases" id="casesSection">
      <p class="biz-section-title"><i data-lucide="book-open" class="biz-icon" style="width:16px;height:16px;"></i> 相关案例</p>
      <div id="casesList"></div>
    </section>

    <!-- 8. 相关工具 -->
    <section class="biz-section result-tools" id="toolsSection">
      <p class="biz-section-title"><i data-lucide="wrench" class="biz-icon" style="width:16px;height:16px;"></i> 相关工具</p>
      <div class="result-tool-scroll" id="toolsList"></div>
    </section>

    <!-- 重新诊断按钮 -->
    <div class="result-bottom-action">
      <button class="biz-btn biz-btn-ghost" onclick="ResultPage.redoDiagnosis()">重新诊断</button>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/biz-data.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/biz-favorite.js"></script>
  <script>
    var ResultPage = {
      resultData: null,
      path: null,
      currentDay: 1,
      isFaved: false,
      toolIcons: ['bar-chart-3', 'clipboard-list', 'wallet', 'smartphone', 'file-text', 'trending-up', 'folder', 'calculator'],
      causeTints: [
        'rgba(0,113,227,0.05)',
        'rgba(240,147,251,0.05)',
        'rgba(250,112,154,0.05)',
        'rgba(161,140,209,0.05)',
        'rgba(79,172,254,0.05)'
      ],
      solutionTints: [
        'rgba(0,113,227,0.05)',
        'rgba(79,172,254,0.05)',
        'rgba(67,233,123,0.05)',
        'rgba(161,140,209,0.05)',
        'rgba(240,147,251,0.05)'
      ],

      init: function() {
        BizDataService.init();
        this.loadData();
      },

      loadData: function() {
        try {
          var stored = sessionStorage.getItem('biz_diagnosis_result');
          if (stored) {
            this.resultData = JSON.parse(stored);
          }
        } catch (e) {
          console.warn('[Result] \u8BFB\u53D6\u8BCA\u65AD\u7ED3\u679C\u5931\u8D25', e);
        }

        if (!this.resultData) {
          var state = BizUtils.loadDiagnosisState() || {};
          this.resultData = {
            path: null,
            problemName: '\u6CA1\u6709\u5BA2\u6D41',
            industry: state.industry || '\u9910\u996E',
            stage: state.stage || '\u6210\u957F\u671F',
            selectedSymptoms: []
          };
          if (BizLocalData && BizLocalData.diagnosisResult) {
            this.resultData.path = {
              judgment: BizLocalData.diagnosisResult.judgment,
              severity: BizLocalData.diagnosisResult.severity,
              causes: BizLocalData.diagnosisResult.causes,
              todayTasks: BizLocalData.diagnosisResult.todayTasks,
              weekPlan: BizLocalData.diagnosisResult.weekPlan,
              longTermAdvice: [],
              solutionIds: [],
              caseIds: [],
              toolIds: []
            };
          }
        }

        this.path = this.resultData.path || {};

        if (this.path) {
          this.renderAll();
        }
      },

      renderAll: function() {
        this.renderOverview();
        this.renderCauses();
        this.renderSolutions();
        this.renderTodayTasks();
        this.renderWeekPlan();
        this.renderLongTermAdvice();
        this.renderCases();
        this.renderTools();
        this.loadFavState();
        this.loadTaskStates();
        // \u521D\u59CB\u5316\u9759\u6001\u56FE\u6807
        document.getElementById('btnBack').innerHTML = BizUtils.icon('chevron-left', 16) + ' \u8FD4\u56DE';
        BizUtils.replaceIcons();
      },

      // ===== 1. \u4F60\u7684\u95EE\u9898 =====
      renderOverview: function() {
        var path = this.path;
        var result = this.resultData;
        var severity = path.severity || 0;
        var color = BizUtils.getSeverityColor(severity);
        var label = BizUtils.getSeverityLabel(severity);
        var peerPercent = Math.round(severity * 0.8 + Math.random() * 10);
        var problemName = result.problemName || '\u7ECF\u8425\u95EE\u9898';
        var industry = result.industry || '';
        var stage = result.stage || '';

        // \u8BA1\u7B97\u5706\u73AFstroke-dashoffset
        var circumference = 2 * Math.PI * 30; // r=30
        var offset = circumference - (severity / 100) * circumference;

        var section = document.getElementById('overviewSection');
        section.innerHTML =
          '<div class="result-overview">' +
            '<h1 class="result-overview-title">' + problemName + '</h1>' +
            '<div class="result-overview-tags">' +
              (industry ? '<span class="biz-tag biz-tag-primary">' + industry + '</span>' : '') +
              (stage ? '<span class="biz-tag biz-tag-accent">' + stage + '</span>' : '') +
            '</div>' +
            '<p class="result-overview-judgment">' + (path.judgment || '') + '</p>' +
            '<div class="result-severity">' +
              '<div class="result-severity-ring">' +
                '<svg viewBox="0 0 72 72">' +
                  '<circle class="sev-ring-bg" cx="36" cy="36" r="30"></circle>' +
                  '<circle class="sev-ring-fill" cx="36" cy="36" r="30" stroke="' + color + '" style="stroke-dasharray:' + circumference + ';stroke-dashoffset:' + circumference + '" data-target-offset="' + offset + '"></circle>' +
                '</svg>' +
                '<span class="sev-ring-value" style="color:' + color + '">' + severity + '</span>' +
              '</div>' +
              '<div class="result-severity-info">' +
                '<div class="result-severity-label">\u4E25\u91CD\u7A0B\u5EA6</div>' +
                '<div class="result-severity-level" style="color:' + color + '">' + label + '</div>' +
                '<div class="result-severity-peer">\u9AD8\u4E8E ' + peerPercent + '% \u540C\u884C</div>' +
              '</div>' +
            '</div>' +
          '</div>';

        // \u52A8\u753B\u542F\u52A8\u4E25\u91CD\u7A0B\u5EA6\u5706\u73AF
        setTimeout(function() {
          var fillEl = section.querySelector('.sev-ring-fill');
          if (fillEl) {
            fillEl.style.strokeDashoffset = fillEl.getAttribute('data-target-offset');
          }
        }, 100);
        BizUtils.replaceIcons();
      },

      // ===== 2. \u95EE\u9898\u539F\u56E0 =====
      renderCauses: function() {
        var causes = (this.path.causes || []).slice().sort(function(a, b) {
          return (b.weight || 0) - (a.weight || 0);
        });
        var self = this;
        var list = document.getElementById('causesList');
        list.innerHTML = causes.map(function(c, i) {
          var tint = self.causeTints[i % self.causeTints.length];
          return '<div class="result-cause-item expanded" data-index="' + i + '" onclick="ResultPage.toggleCause(' + i + ')" style="--cause-tint:' + tint + '">' +
            '<div class="result-cause-header">' +
              '<div class="result-cause-left">' +
                '<span class="result-cause-rank">' + (i + 1) + '</span>' +
                '<span class="result-cause-name">' + c.name + '</span>' +
              '</div>' +
              '<div class="result-cause-right">' +
                '<span class="result-cause-weight">' + c.weight + '%</span>' +
                '<span class="result-cause-arrow">\u25BE</span>' +
              '</div>' +
            '</div>' +
            '<div class="result-cause-detail">' +
              '<p class="result-cause-judgment">' + BizUtils.icon('lightbulb', 14) + ' ' + c.judgment + '</p>' +
              '<p class="result-cause-desc">' + c.description + '</p>' +
            '</div>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      toggleCause: function(index) {
        var items = document.querySelectorAll('.result-cause-item');
        var item = items[index];
        if (item) {
          item.classList.toggle('expanded');
        }
      },

      // ===== 3. \u63A8\u8350\u65B9\u6848\u5361\u7247 =====
      renderSolutions: function() {
        var solutionIds = this.path.solutionIds || [];
        var solutions = [];
        var allSolutions = BizData.solutions || [];
        for (var i = 0; i < solutionIds.length; i++) {
          var found = null;
          if (Array.isArray(allSolutions)) {
            for (var j = 0; j < allSolutions.length; j++) {
              if (allSolutions[j]._id === solutionIds[i]) { found = allSolutions[j]; break; }
            }
          } else {
            found = allSolutions[solutionIds[i]];
          }
          if (found) solutions.push(found);
        }
        var list = document.getElementById('solutionsList');
        var self = this;

        var diffClasses = { '\u7B80\u5355': 'meta-difficulty-easy', '\u4E2D\u7B49': 'meta-difficulty-mid', '\u56F0\u96BE': 'meta-difficulty-hard' };

        list.innerHTML = solutions.map(function(s, i) {
          var tint = self.solutionTints[i % self.solutionTints.length];
          var diffCls = diffClasses[s.difficulty] || 'meta-neutral';
          return '<div class="result-solution-card" onclick="window.location.href=\'solution-detail.html?solutionId=' + s._id + '\'" style="cursor:pointer;--solution-tint:' + tint + '">' +
            '<h3 class="result-solution-title">' + s.title + '</h3>' +
            '<p class="result-solution-summary">' + s.summary + '</p>' +
            '<div class="result-solution-meta">' +
              '<span class="result-solution-meta-item ' + diffCls + '">' +
                '<span class="meta-icon">' + BizUtils.icon('target', 12) + '</span>' +
                s.difficulty +
              '</span>' +
              '<span class="result-solution-meta-item meta-neutral">' +
                '<span class="meta-icon">' + BizUtils.icon('clock', 12) + '</span>' +
                s.effectiveTime +
              '</span>' +
              '<span class="result-solution-meta-item meta-neutral">' +
                '<span class="meta-icon">' + BizUtils.icon('wallet', 12) + '</span>' +
                s.costRange +
              '</span>' +
            '</div>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      // ===== 4. \u7ACB\u5373\u6267\u884C =====
      renderTodayTasks: function() {
        var tasks = this.path.todayTasks || [];
        var list = document.getElementById('todayTasksList');

        list.innerHTML = tasks.map(function(t, i) {
          return '<div class="result-task-item" id="taskItem' + i + '">' +
            '<div class="result-task-checkbox" id="taskCheck' + i + '" onclick="ResultPage.toggleTask(' + i + ')"></div>' +
            '<div class="result-task-content">' +
              '<div class="result-task-text">' + t.task + '</div>' +
              '<div class="result-task-meta">' +
                '<span class="result-task-duration">' + BizUtils.icon('clock', 12) + ' ' + t.duration + '</span>' +
                '<span class="result-task-purpose">\u2022 ' + t.purpose + '</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      toggleTask: function(index) {
        var key = 'biz_task_done_' + index;
        var isDone = localStorage.getItem(key) === '1';
        localStorage.setItem(key, isDone ? '0' : '1');
        this.applyTaskState(index);
        this.checkAllDone();
      },

      applyTaskState: function(index) {
        var key = 'biz_task_done_' + index;
        var isDone = localStorage.getItem(key) === '1';
        var item = document.getElementById('taskItem' + index);
        var check = document.getElementById('taskCheck' + index);
        if (item) {
          item.classList.toggle('done', isDone);
        }
        if (check) {
          check.classList.toggle('checked', isDone);
        }
      },

      loadTaskStates: function() {
        var tasks = this.path.todayTasks || [];
        for (var i = 0; i < tasks.length; i++) {
          this.applyTaskState(i);
        }
        this.checkAllDone();
      },

      checkAllDone: function() {
        var tasks = this.path.todayTasks || [];
        var allDone = true;
        for (var i = 0; i < tasks.length; i++) {
          if (localStorage.getItem('biz_task_done_' + i) !== '1') {
            allDone = false;
            break;
          }
        }
        var section = document.getElementById('todaySection');
        var existing = section.querySelector('.result-all-done');
        if (allDone && tasks.length > 0) {
          if (!existing) {
            var el = document.createElement('div');
            el.className = 'result-all-done';
            el.textContent = '\u4ECA\u65E5\u4EFB\u52A1\u5168\u90E8\u5B8C\u6210\uFF01';
            section.appendChild(el);
          }
        } else if (existing) {
          existing.remove();
        }
      },

      // ===== 5. 7\u5929\u6539\u5584\u8BA1\u5212 =====
      renderWeekPlan: function() {
        var plan = this.path.weekPlan || [];
        var tabs = document.getElementById('weekTabs');

        tabs.innerHTML = plan.map(function(d) {
          return '<div class="result-week-tab' + (d.day === 1 ? ' active' : '') + '" data-day="' + d.day + '" onclick="ResultPage.switchDay(' + d.day + ')">D' + d.day + '</div>';
        }).join('');

        this.renderWeekDayContent(1);
      },

      switchDay: function(day) {
        this.currentDay = day;
        var tabs = document.querySelectorAll('.result-week-tab');
        tabs.forEach(function(tab) {
          tab.classList.toggle('active', parseInt(tab.dataset.day) === day);
        });
        this.renderWeekDayContent(day);
      },

      renderWeekDayContent: function(day) {
        var plan = this.path.weekPlan || [];
        var dayData = null;
        for (var i = 0; i < plan.length; i++) {
          if (plan[i].day === day) { dayData = plan[i]; break; }
        }
        var container = document.getElementById('weekContent');

        if (!dayData) {
          container.innerHTML = '<div class="biz-empty"><span class="biz-empty-text">\u6682\u65E0\u8BA1\u5212</span></div>';
          return;
        }

        var taskItems = (dayData.tasks || []).map(function(t) {
          return '<li class="result-week-task-item">' +
            '<span class="result-week-task-dot"></span>' +
            '<span>' + t + '</span>' +
          '</li>';
        }).join('');

        container.innerHTML =
          '<h3 class="result-week-day-title">D' + dayData.day + ' \u00B7 ' + dayData.title + '</h3>' +
          '<ul class="result-week-task-list">' + taskItems + '</ul>';
        BizUtils.replaceIcons();
      },

      // ===== 6. \u957F\u671F\u4F18\u5316\u65B9\u5411 =====
      renderLongTermAdvice: function() {
        var advices = this.path.longTermAdvice || [];
        var list = document.getElementById('longTermList');

        if (advices.length === 0) {
          list.innerHTML = '<div class="biz-empty"><span class="biz-empty-text">\u6682\u65E0\u957F\u671F\u5EFA\u8BAE</span></div>';
          return;
        }

        list.innerHTML = advices.map(function(a, i) {
          var title = typeof a === 'string' ? a : (a.title || '');
          var desc = typeof a === 'object' && a.desc ? a.desc : '';
          var html = '<div class="long-term-item">' +
            '<span class="long-term-num">' + (i + 1) + '</span>' +
            '<div class="long-term-content">' +
              '<div class="long-term-title">' + title + '</div>';
          if (desc) {
            html += '<div class="long-term-desc">' + desc + '</div>';
          }
          html += '</div></div>';
          return html;
        }).join('');
        BizUtils.replaceIcons();
      },

      // ===== 7. \u76F8\u5173\u6848\u4F8B =====
      renderCases: function() {
        var caseIds = this.path.caseIds || [];
        var cases = [];
        var allCases = BizData.cases || [];
        for (var i = 0; i < caseIds.length; i++) {
          var found = null;
          if (Array.isArray(allCases)) {
            for (var j = 0; j < allCases.length; j++) {
              if (allCases[j]._id === caseIds[i]) { found = allCases[j]; break; }
            }
          } else {
            found = allCases[caseIds[i]];
          }
          if (found) cases.push(found);
        }
        var list = document.getElementById('casesList');
        list.innerHTML = cases.map(function(c) {
          return '<div class="result-case-card" onclick="window.location.href=\'case-detail.html?caseId=' + c._id + '\'" style="cursor:pointer">' +
            '<h3 class="result-case-title">' + c.title + '</h3>' +
            '<div class="result-case-meta">' +
              '<span class="result-case-industry">' + c.industry + '</span>' +
              '<span class="result-case-effect">' + c.effectData + '</span>' +
            '</div>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      // ===== 8. \u76F8\u5173\u5DE5\u5177 =====
      renderTools: function() {
        var toolIds = this.path.toolIds || [];
        var tools = [];
        var allTools = BizData.tools || [];
        for (var i = 0; i < toolIds.length; i++) {
          var found = null;
          if (Array.isArray(allTools)) {
            for (var j = 0; j < allTools.length; j++) {
              if (allTools[j]._id === toolIds[i]) { found = allTools[j]; break; }
            }
          } else {
            found = allTools[toolIds[i]];
          }
          if (found) tools.push(found);
        }
        var scroll = document.getElementById('toolsList');
        var self = this;

        scroll.innerHTML = tools.map(function(t, i) {
          var iconName = t.icon || self.toolIcons[i % self.toolIcons.length] || 'box';
          return '<div class="result-tool-card" onclick="window.location.href=\'tool-detail.html?toolId=' + t._id + '\'">' +
            '<div class="t-icon">' + BizUtils.icon(iconName, 18) + '</div>' +
            '<div class="t-name">' + t.name + '</div>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      // ===== \u6536\u85CF\u6309\u94AE =====
      toggleFav: function() {
        if (!BizFavorite.isLoggedIn()) {
          BizFavorite.requireLogin('result');
          return;
        }

        var result = this.resultData;
        var problemName = result ? (result.problemName || '\u7ECF\u8425\u95EE\u9898') : '\u7ECF\u8425\u95EE\u9898';
        var diagnosisId = result && result.path ? 'diag_' + (result.problemName || '') + '_' + (result.industry || '') : 'diag_default';

        if (this.isFaved) {
          BizFavorite.remove('diagnosis', diagnosisId);
          this.isFaved = false;
        } else {
          BizFavorite.add('diagnosis', diagnosisId, problemName);
          this.isFaved = true;
        }

        var btn = document.getElementById('favBtn');
        var icon = document.getElementById('favIcon');
        var text = document.getElementById('favText');

        if (this.isFaved) {
          btn.classList.add('faved');
          icon.innerHTML = BizUtils.icon('heart', 14);
          text.textContent = '\u5DF2\u6536\u85CF';
          BizUtils.showToast('\u5DF2\u6536\u85CF');
        } else {
          btn.classList.remove('faved');
          icon.innerHTML = BizUtils.icon('heart', 14);
          text.textContent = '\u6536\u85CF';
          BizUtils.showToast('\u5DF2\u53D6\u6D88\u6536\u85CF');
        }
        BizUtils.replaceIcons();
      },

      loadFavState: function() {
        var result = this.resultData;
        var diagnosisId = result && result.path ? 'diag_' + (result.problemName || '') + '_' + (result.industry || '') : 'diag_default';
        this.isFaved = BizFavorite.isFavorited('diagnosis', diagnosisId);
        var btn = document.getElementById('favBtn');
        var icon = document.getElementById('favIcon');
        var text = document.getElementById('favText');
        if (this.isFaved) {
          btn.classList.add('faved');
          icon.innerHTML = BizUtils.icon('heart', 14);
          text.textContent = '\u5DF2\u6536\u85CF';
        } else {
          icon.innerHTML = BizUtils.icon('heart', 14);
        }
        BizUtils.replaceIcons();
      },

      redoDiagnosis: function() {
        BizUtils.clearDiagnosisState();
        this.clearTaskStates();
        try { sessionStorage.removeItem('biz_diagnosis_result'); } catch (e) {}
        window.location.href = 'index.html';
      },

      clearTaskStates: function() {
        var tasks = this.path.todayTasks || [];
        for (var i = 0; i < tasks.length; i++) {
          localStorage.removeItem('biz_task_done_' + i);
        }
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      ResultPage.init();
    });
  </script>
