<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工具详情 - 闪喵经营诊断</title>
  <meta name="description" content="查看经营工具的详细信息和使用说明。">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/page-tool-detail.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="td-topbar">
    <div class="td-topbar-left">
      <span class="td-topbar-back" onclick="history.back()"><i data-lucide="chevron-left" class="biz-icon" style="width:20px;height:20px;"></i></span>
      <span class="td-topbar-title">工具详情</span>
    </div>
  </header>

  <main class="biz-page">
    <!-- 1. 工具概览 -->
    <section class="biz-section" id="overviewSection">
      <!-- JS动态渲染 -->
    </section>

    <!-- 2. 工具描述 -->
    <section class="biz-section td-description" id="descSection">
      <!-- JS动态渲染 -->
    </section>

    <!-- 3. 使用说明 -->
    <section class="biz-section td-usage" id="usageSection">
      <!-- JS动态渲染 -->
    </section>

    <!-- 4. 下载/使用按钮 -->
    <section class="biz-section td-action" id="actionSection">
      <!-- JS动态渲染 -->
    </section>

    <div class="td-bottom-space"></div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/biz-data.js"></script>
  <script src="js/data-service.js"></script>
  <script>
    /**
     * 工具详情页面对象
     * 从URL参数获取toolId，从BizData.tools读取工具详情并渲染
     */
    var TDPage = {
      // 当前工具数据
      toolData: null,
      // 工具ID
      toolId: null,
      // 分类 Lucide 图标名映射
      categoryIconNames: {
        '客流管理': 'bar-chart-3',
        '门店运营': 'clipboard-list',
        '营销推广': 'megaphone',
        '客户管理': 'heart',
        '经营分析': 'trending-up',
        '成本管理': 'calculator',
        '产品管理': 'tag',
        '员工管理': 'hard-hat',
        '营销': 'megaphone',
        '管理': 'hard-hat',
        '财务': 'calculator',
        '客户': 'heart',
        '运营': 'bar-chart-3'
      },
      // 分类对应颜色
      categoryColors: {
        '客流管理': '#0071E3',
        '门店运营': '#0071E3',
        '营销推广': '#0071E3',
        '客户管理': '#0071E3',
        '经营分析': '#0071E3',
        '成本管理': '#0071E3',
        '产品管理': '#0071E3',
        '员工管理': '#0071E3',
        '营销': '#0071E3',
        '管理': '#0071E3',
        '财务': '#0071E3',
        '客户': '#0071E3',
        '运营': '#0071E3'
      },

      // 初始化
      init: function() {
        BizDataService.init();
        this.toolId = BizUtils.getParam('toolId');
        this.loadTool();
      },

      // 根据ID查找工具
      findTool: function(id) {
        var tools = BizData.tools;
        if (!tools) return null;
        if (!Array.isArray(tools)) return tools[id] || null;
        for (var i = 0; i < tools.length; i++) {
          if (tools[i]._id === id) return tools[i];
        }
        return null;
      },

      // 加载工具数据
      loadTool: function() {
        if (!this.toolId) {
          this.showEmpty('缺少工具ID参数');
          return;
        }
        this.toolData = this.findTool(this.toolId);
        if (!this.toolData) {
          this.showEmpty('未找到该工具');
          return;
        }
        this.renderAll();
      },

      // 显示空状态
      showEmpty: function(msg) {
        var main = document.querySelector('.biz-page');
        main.innerHTML = '<div class="biz-empty">' +
          '<span class="biz-empty-icon">' + BizUtils.icon('inbox', 40) + '</span>' +
          '<span class="biz-empty-text">' + (msg || '暂无数据') + '</span>' +
        '</div>';
        BizUtils.replaceIcons();
      },

      // 渲染所有模块
      renderAll: function() {
        this.renderOverview();
        this.renderDescription();
        this.renderUsage();
        this.renderAction();
        BizUtils.replaceIcons();
      },

      // ===== 1. 工具概览 =====
      renderOverview: function() {
        var t = this.toolData;
        var iconName = this.categoryIconNames[t.category] || 'file-text';
        var iconColor = this.categoryColors[t.category] || '#0071E3';
        var bgColor = iconColor + '14';

        var section = document.getElementById('overviewSection');
        section.innerHTML =
          '<div class="td-overview">' +
            '<div class="td-overview-icon" style="background:' + bgColor + ';color:' + iconColor + '">' + BizUtils.icon(iconName, 28) + '</div>' +
            '<h1 class="td-overview-name">' + t.name + '</h1>' +
            '<div class="td-overview-tags">' +
              '<span class="biz-tag biz-tag-primary">' + (t.type || '模板') + '</span>' +
              '<span class="biz-tag">' + (t.category || '通用') + '</span>' +
            '</div>' +
          '</div>';
      },

      // ===== 2. 工具描述 =====
      renderDescription: function() {
        var t = this.toolData;
        var desc = t.description || '暂无描述';
        var section = document.getElementById('descSection');
        section.innerHTML =
          '<p class="biz-section-title">' + BizUtils.icon('file-text', 16) + ' 工具介绍</p>' +
          '<div class="td-desc-card">' +
            '<p class="td-desc-text">' + desc + '</p>' +
          '</div>';
      },

      // ===== 3. 使用说明 =====
      renderUsage: function() {
        // 通用模板使用指引
        var steps = [
          '点击下载按钮获取模板文件',
          '用Excel或WPS打开模板文件',
          '根据模板中的示例数据，替换为你自己的经营数据',
          '按照模板中的公式和说明，填写每日/每周数据',
          '定期查看自动生成的分析图表和趋势'
        ];

        var items = '';
        for (var i = 0; i < steps.length; i++) {
          items += '<li class="td-usage-item">' +
            '<span class="td-usage-num">' + (i + 1) + '</span>' +
            '<span>' + steps[i] + '</span>' +
          '</li>';
        }

        var section = document.getElementById('usageSection');
        section.innerHTML =
          '<p class="biz-section-title">' + BizUtils.icon('clipboard-list', 16) + ' 使用说明</p>' +
          '<div class="td-usage-card">' +
            '<div class="td-usage-title">模板使用指引</div>' +
            '<ul class="td-usage-list">' + items + '</ul>' +
          '</div>';
      },

      // ===== 4. 下载/使用按钮 =====
      renderAction: function() {
        var section = document.getElementById('actionSection');
        section.innerHTML =
          '<button class="td-action-btn disabled" onclick="BizUtils.showToast(\'即将上线，敬请期待\')">' + BizUtils.icon('download', 16) + ' 下载模板</button>' +
          '<p class="td-coming-soon">模板下载功能即将上线，敬请期待</p>';
      },

    };

    document.addEventListener('DOMContentLoaded', function() {
      TDPage.init();
      BizUtils.replaceIcons();
    });
  </script>
</body>
</html>
