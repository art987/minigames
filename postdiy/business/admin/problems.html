<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问题管理 - 闪喵经营诊断</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    /* 问题行展开/收起 */
    .problem-row { cursor: pointer; }
    .problem-row .expand-icon {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 12px;
      color: #9ca3af;
      margin-right: 4px;
    }
    .problem-row.expanded .expand-icon {
      transform: rotate(90deg);
    }
    .symptom-sub-table {
      display: none;
      background: #f9fafb;
    }
    .symptom-sub-table.show {
      display: table-row;
    }
    .symptom-sub-table td {
      padding: 0 !important;
    }
    .symptom-inner {
      padding: 12px 24px 12px 56px;
    }
    .symptom-inner .symptom-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 4px;
      background: #fff;
      border: 1px solid #f3f4f6;
      font-size: 13px;
    }
    .symptom-item:hover {
      border-color: #e0e7ff;
    }
    .symptom-item .sym-info { flex: 1; }
    .symptom-item .sym-id { color: #9ca3af; font-size: 12px; margin-left: 8px; }
    .symptom-item .sym-filters { font-size: 12px; color: #6b7280; margin-top: 2px; }

    /* 弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      z-index: 500;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-box {
      background: #fff;
      border-radius: 14px;
      width: 560px;
      max-width: 92vw;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
    }
    .modal-close {
      width: 32px; height: 32px;
      border: none; background: none;
      font-size: 20px; color: #9ca3af;
      cursor: pointer; border-radius: 6px;
    }
    .modal-close:hover { background: #f3f4f6; color: #374151; }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid #f3f4f6;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .modal-footer .btn { width: auto; min-width: 80px; }

    /* 颜色选择器 */
    .color-preview {
      display: inline-block;
      width: 20px; height: 20px;
      border-radius: 4px;
      vertical-align: middle;
      margin-left: 8px;
      border: 1px solid #e5e7eb;
    }

    /* 工具栏 */
    .page-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .page-toolbar .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-toolbar .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-input {
      height: 36px;
      padding: 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #6366f1;
    }

    /* 状态开关 */
    .status-toggle {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .status-toggle input { opacity: 0; width: 0; height: 0; }
    .status-toggle .slider {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #d1d5db;
      border-radius: 22px;
      cursor: pointer;
      transition: 0.2s;
    }
    .status-toggle .slider:before {
      content: '';
      position: absolute;
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .status-toggle input:checked + .slider {
      background: #6366f1;
    }
    .status-toggle input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* 排序指示器 */
    .sort-th {
      cursor: pointer;
      user-select: none;
    }
    .sort-th:hover {
      color: #4f46e5;
    }
    .sort-th .sort-arrow {
      font-size: 10px;
      margin-left: 2px;
      opacity: 0.3;
    }
    .sort-th.active .sort-arrow {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="admin-layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 侧边栏 -->
  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="sidebar-brand-icon">⚡</span>
        <span>闪喵诊断</span>
      </div>
      <div class="sidebar-sub">管理后台 v1.0</div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html" data-page="dashboard">
        <span class="nav-icon">📊</span><span>首页</span>
      </a>
      <a class="nav-item active" href="problems.html" data-page="problems">
        <span class="nav-icon">❓</span><span>问题管理</span>
      </a>
      <a class="nav-item" href="diagnosis-paths.html" data-page="diagnosis">
        <span class="nav-icon">🔀</span><span>诊断路径管理</span>
      </a>
      <a class="nav-item" href="solutions.html" data-page="solutions">
        <span class="nav-icon">💡</span><span>方案管理</span>
      </a>
      <a class="nav-item" data-page="cases">
        <span class="nav-icon">📖</span><span>案例管理</span>
      </a>
      <a class="nav-item" data-page="tools">
        <span class="nav-icon">📦</span><span>工具管理</span>
      </a>
      <a class="nav-item" data-page="tags">
        <span class="nav-icon">🏷️</span><span>标签管理</span>
      </a>
      <a class="nav-item" data-page="stats">
        <span class="nav-icon">📊</span><span>数据统计</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="nav-item" onclick="handleLogout()">
        <span class="nav-icon">🚪</span><span>退出登录</span>
      </div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="topbar-hamburger" id="hamburgerBtn">☰</button>
        <span class="topbar-title">问题管理</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-admin">
          <span class="admin-avatar" id="adminAvatar">管</span>
          <span id="adminName">管理员</span>
        </div>
        <button class="topbar-logout" onclick="handleLogout()">退出</button>
      </div>
    </header>

    <main class="admin-content">
      <!-- 工具栏 -->
      <div class="page-toolbar">
        <div class="toolbar-left">
          <input type="text" class="search-input" id="searchInput" placeholder="搜索问题名称/编码...">
        </div>
        <div class="toolbar-right">
          <button class="btn btn-sm btn-primary" onclick="openProblemModal()" style="width:auto;">＋ 新增问题</button>
        </div>
      </div>

      <!-- 问题列表 -->
      <div class="content-card">
        <div class="card-header">
          <span class="card-title">❓ 经营问题列表</span>
          <span class="card-extra" id="problemCount">共 0 条</span>
        </div>
        <div class="card-body" style="padding:0; overflow-x:auto;">
          <table class="admin-table" id="problemTable">
            <thead>
              <tr>
                <th style="width:50px;">序号</th>
                <th class="sort-th" data-sort="name">问题名 <span class="sort-arrow">▲</span></th>
                <th class="sort-th" data-sort="code">编码 <span class="sort-arrow">▲</span></th>
                <th>图标</th>
                <th>颜色</th>
                <th class="sort-th" data-sort="sortOrder">排序 <span class="sort-arrow">▲</span></th>
                <th>状态</th>
                <th style="width:140px;">操作</th>
              </tr>
            </thead>
            <tbody id="problemBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 新增/编辑问题弹窗 -->
<div class="modal-overlay" id="problemModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="problemModalTitle">新增问题</h3>
      <button class="modal-close" onclick="closeProblemModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="problemEditId">
      <div class="form-group">
        <label>问题名称</label>
        <input type="text" class="form-input" id="pName" placeholder="如：没有客流">
      </div>
      <div class="form-group">
        <label>编码（英文大写+下划线）</label>
        <input type="text" class="form-input" id="pCode" placeholder="如：TRAFFIC_LOW">
      </div>
      <div style="display:flex;gap:16px;">
        <div class="form-group" style="flex:1;">
          <label>图标（Emoji）</label>
          <input type="text" class="form-input" id="pIcon" placeholder="如：🚶" style="font-size:20px;">
        </div>
        <div class="form-group" style="flex:1;">
          <label>颜色</label>
          <div style="display:flex;align-items:center;gap:8px;">
            <input type="color" id="pColor" value="#0071E3" style="width:44px;height:44px;border:1px solid #d1d5db;border-radius:8px;cursor:pointer;padding:2px;">
            <span class="color-preview" id="pColorPreview" style="background:#0071E3;"></span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>描述</label>
        <textarea class="form-textarea" id="pDesc" placeholder="问题的详细描述..."></textarea>

      <div style="display:flex;gap:16px;">
        <div class="form-group" style="flex:1;">
          <label>排序号</label>

        </div>
        <div class="form-group" style="flex:1;">
          <label>状态</label>
          <select class="form-select" id="pStatus">
            <option value="active">启用</option>
            <option value="inactive">停用</option>

        </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-sm btn-ghost" onclick="closeProblemModal()">取消</button>
      <button class="btn btn-sm btn-primary" onclick="saveProblem()" style="width:auto;">保存</button>
    </div>
  </div>
</div>

<!-- 新增/编辑症状弹窗 -->
<div class="modal-overlay" id="symptomModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="symptomModalTitle">新增症状</h3>
      <button class="modal-close" onclick="closeSymptomModal()">✕</button>

    <div class="modal-body">
      <input type="hidden" id="symptomEditId">
      <input type="hidden" id="symptomProblemCode">
      <div class="form-group">

        <input type="text" class="form-input" id="sName" placeholder="如：工作日进店不足20人">

        <label>适用行业（多选）</label>

          <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">

      </div>

        <label>适用阶段（多选）</label>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;">

            <input type="checkbox" value="新店" class="sStage"> 新店
          </label>
          <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">
            <input type="checkbox" value="成长期" class="sStage"> 成长期
          </label>
          <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">
            <input type="checkbox" value="老店" class="sStage"> 老店

    <div class="modal-footer">
      <button class="btn btn-sm btn-ghost" onclick="closeSymptomModal()">取消</button>
      <button class="btn btn-sm btn-primary" onclick="saveSymptom()" style="width:auto;">保存</button>

  </div>
</div>

<script src="../js/biz-data.js"></script>
<script src="../js/utils.js"></script>
<script>
/**
 * 问题+症状管理页面逻辑
 */

// ===== 登录鉴权 =====
(function checkAuth() {
  var session = localStorage.getItem('biz_admin_session');
  if (!session) { location.href = 'login.html'; return; }
  try {
    var info = JSON.parse(session);
    if (!info || !info.loggedIn) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = info.name || info.username;
    document.getElementById('adminAvatar').textContent = (info.name || info.username || '管').charAt(0);
  } catch (e) { location.href = 'login.html'; }
})();

// ===== 退出登录 =====
function handleLogout() {
  localStorage.removeItem('biz_admin_session');
  location.href = 'login.html';
}

// ===== 侧边栏交互 =====
(function() {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  var hamburger = document.getElementById('hamburgerBtn');
  hamburger.addEventListener('click', function() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', function() {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });
})();

// ===== 本地数据管理（localStorage） =====
var STORAGE_KEY = 'biz_admin_problems';
var SYMPTOM_KEY = 'biz_admin_symptoms';

/**
 * 获取问题列表（优先从localStorage读取，首次从BizData初始化）
 */
function getProblems() {
  var stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { return JSON.parse(stored); } catch (e) {}
  }
  // 首次：从BizData初始化
  var problems = (typeof BizData !== 'undefined' && BizData.problems) ? BizData.problems.map(function(p) {
    return {
      _id: p._id,
      name: p.name,
      code: p.code,
      icon: p.icon,
      color: p.color,
      description: p.description || '',
      sortOrder: p.sortOrder || 0,
      status: 'active'
    };
  }) : [];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(problems));
  return problems;
}

function saveProblems(problems) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(problems));
}

function getSymptoms() {
  var stored = localStorage.getItem(SYMPTOM_KEY);
  if (stored) {
    try { return JSON.parse(stored); } catch (e) {}
  }
  var symptoms = (typeof BizData !== 'undefined' && BizData.symptoms) ? JSON.parse(JSON.stringify(BizData.symptoms)) : {};
  localStorage.setItem(SYMPTOM_KEY, JSON.stringify(symptoms));
  return symptoms;
}

function saveSymptomsData(symptoms) {
  localStorage.setItem(SYMPTOM_KEY, JSON.stringify(symptoms));
}

// ===== 排序 =====
var currentSort = { field: 'sortOrder', dir: 'asc' };

function sortProblems(problems, field, dir) {
  return problems.slice().sort(function(a, b) {
    var va = a[field] || '';
    var vb = b[field] || '';
    if (typeof va === 'number' && typeof vb === 'number') {
      return dir === 'asc' ? va - vb : vb - va;
    }
    va = String(va).toLowerCase();
    vb = String(vb).toLowerCase();
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

// ===== 渲染问题列表 =====
var expandedRows = {};

function renderProblems(searchKeyword) {
  var problems = getProblems();
  var symptoms = getSymptoms();

  // 搜索过滤
  if (searchKeyword) {
    var kw = searchKeyword.toLowerCase();
    problems = problems.filter(function(p) {
      return p.name.toLowerCase().indexOf(kw) >= 0 || (p.code || '').toLowerCase().indexOf(kw) >= 0;
    });
  }

  // 排序
  problems = sortProblems(problems, currentSort.field, currentSort.dir);

  var tbody = document.getElementById('problemBody');
  var html = '';

  problems.forEach(function(p, idx) {
    var symptomList = symptoms[p.code] || [];
    var isExpanded = expandedRows[p._id];

    html += '<tr class="problem-row ' + (isExpanded ? 'expanded' : '') + '" data-id="' + p._id + '" data-code="' + p.code + '">';
    html += '<td>' + (idx + 1) + '</td>';
    html += '<td><span class="expand-icon">▶</span> ' + escHtml(p.name) + '</td>';
    html += '<td><span class="table-tag tag-blue">' + escHtml(p.code) + '</span></td>';
    html += '<td style="font-size:20px;">' + escHtml(p.icon) + '</td>';
    html += '<td><span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:' + escHtml(p.color) + ';vertical-align:middle;"></span> ' + escHtml(p.color) + '</td>';
    html += '<td>' + p.sortOrder + '</td>';
    html += '<td>';
    html += '<label class="status-toggle"><input type="checkbox" ' + (p.status !== 'inactive' ? 'checked' : '') + ' onchange="toggleProblemStatus(\'' + p._id + '\', this.checked)"><span class="slider"></span></label>';
    html += '</td>';
    html += '<td>';
    html += '<div class="table-actions">';
    html += '<button class="action-btn edit" onclick="event.stopPropagation();openProblemModal(\'' + p._id + '\')">编辑</button>';
    html += '<button class="action-btn delete" onclick="event.stopPropagation();deleteProblem(\'' + p._id + '\')">删除</button>';
    html += '</div>';
    html += '</td>';
    html += '</tr>';

    // 症状子行
    html += '<tr class="symptom-sub-table ' + (isExpanded ? 'show' : '') + '" data-parent="' + p._id + '">';
    html += '<td colspan="8"><div class="symptom-inner">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">';
    html += '<span style="font-size:13px;font-weight:600;color:#4f46e5;">📋 症状列表（' + symptomList.length + '条）</span>';
    html += '<button class="btn btn-sm btn-ghost" onclick="openSymptomModal(\'' + p.code + '\')">＋ 新增症状</button>';
    html += '</div>';
    if (symptomList.length === 0) {
      html += '<div style="color:#9ca3af;font-size:13px;padding:8px 0;">暂无症状，点击上方按钮新增</div>';
    } else {
      symptomList.forEach(function(s) {
        html += '<div class="symptom-item">';
        html += '<div class="sym-info">';
        html += '<span>' + escHtml(s.name) + '</span>';
        html += '<span class="sym-id">' + escHtml(s._id) + '</span>';
        html += '<div class="sym-filters">行业：' + (s.industryFilter || []).join('、') + '　阶段：' + (s.stageFilter || []).join('、') + '</div>';
        html += '</div>';
        html += '<div class="table-actions">';
        html += '<button class="action-btn edit" onclick="openSymptomModal(\'' + p.code + '\',\'' + s._id + '\')">编辑</button>';
        html += '<button class="action-btn delete" onclick="deleteSymptom(\'' + p.code + '\',\'' + s._id + '\')">删除</button>';
        html += '</div>';
        html += '</div>';
      });
    }
    html += '</div></td></tr>';
  });

  tbody.innerHTML = html;
  document.getElementById('problemCount').textContent = '共 ' + problems.length + ' 条';

  // 绑定行展开/收起
  var rows = tbody.querySelectorAll('.problem-row');
  rows.forEach(function(row) {
    row.addEventListener('click', function() {
      var id = row.getAttribute('data-id');
      expandedRows[id] = !expandedRows[id];
      row.classList.toggle('expanded');
      var sub = tbody.querySelector('.symptom-sub-table[data-parent="' + id + '"]');
      if (sub) sub.classList.toggle('show');
    });
  });
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 排序点击 =====
document.querySelectorAll('.sort-th').forEach(function(th) {
  th.addEventListener('click', function() {
    var field = th.getAttribute('data-sort');
    if (currentSort.field === field) {
      currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort.field = field;
      currentSort.dir = 'asc';
    }
    document.querySelectorAll('.sort-th').forEach(function(t) { t.classList.remove('active'); });
    th.classList.add('active');
    renderProblems(document.getElementById('searchInput').value.trim());
  });
});

// ===== 搜索 =====
document.getElementById('searchInput').addEventListener('input', function() {
  renderProblems(this.value.trim());
});

// ===== 状态切换 =====
function toggleProblemStatus(id, checked) {
  var problems = getProblems();
  var p = problems.find(function(x) { return x._id === id; });
  if (p) {
    p.status = checked ? 'active' : 'inactive';
    saveProblems(problems);
    BizUtils.showToast(checked ? '已启用' : '已停用');
  }
}

// ===== 问题弹窗 =====
function openProblemModal(editId) {
  var modal = document.getElementById('problemModal');
  document.getElementById('problemEditId').value = '';
  document.getElementById('pName').value = '';
  document.getElementById('pCode').value = '';
  document.getElementById('pIcon').value = '';
  document.getElementById('pColor').value = '#0071E3';
  document.getElementById('pColorPreview').style.background = '#0071E3';
  document.getElementById('pDesc').value = '';
  document.getElementById('pSort').value = '1';
  document.getElementById('pStatus').value = 'active';
  document.getElementById('problemModalTitle').textContent = '新增问题';

  if (editId) {
    var problems = getProblems();
    var p = problems.find(function(x) { return x._id === editId; });
    if (p) {
      document.getElementById('problemEditId').value = p._id;
      document.getElementById('pName').value = p.name;
      document.getElementById('pCode').value = p.code;
      document.getElementById('pIcon').value = p.icon;
      document.getElementById('pColor').value = p.color || '#0071E3';
      document.getElementById('pColorPreview').style.background = p.color || '#0071E3';
      document.getElementById('pDesc').value = p.description || '';
      document.getElementById('pSort').value = p.sortOrder || 1;
      document.getElementById('pStatus').value = p.status || 'active';
      document.getElementById('problemModalTitle').textContent = '编辑问题';
    }
  }
  modal.classList.add('show');
}

function closeProblemModal() {
  document.getElementById('problemModal').classList.remove('show');
}

// 颜色实时预览
document.getElementById('pColor').addEventListener('input', function() {
  document.getElementById('pColorPreview').style.background = this.value;
});

function saveProblem() {
  var editId = document.getElementById('problemEditId').value;
  var name = document.getElementById('pName').value.trim();
  var code = document.getElementById('pCode').value.trim().toUpperCase();
  var icon = document.getElementById('pIcon').value.trim();
  var color = document.getElementById('pColor').value;
  var desc = document.getElementById('pDesc').value.trim();
  var sort = parseInt(document.getElementById('pSort').value) || 1;
  var status = document.getElementById('pStatus').value;

  if (!name) { BizUtils.showToast('请输入问题名称'); return; }
  if (!code) { BizUtils.showToast('请输入编码'); return; }

  var problems = getProblems();

  if (editId) {
    var p = problems.find(function(x) { return x._id === editId; });
    if (p) {
      // 如果code变了，同步症状key
      var oldCode = p.code;
      p.name = name;
      p.code = code;
      p.icon = icon;
      p.color = color;
      p.description = desc;
      p.sortOrder = sort;
      p.status = status;
      if (oldCode !== code) {
        var symptoms = getSymptoms();
        if (symptoms[oldCode]) {
          symptoms[code] = symptoms[oldCode];
          delete symptoms[oldCode];
          saveSymptomsData(symptoms);
        }
      }
    }
  } else {
    // 编码唯一性检查
    var exists = problems.find(function(x) { return x.code === code; });
    if (exists) { BizUtils.showToast('编码已存在，请更换'); return; }
    problems.push({
      _id: 'prob_' + BizUtils.genId(),
      name: name,
      code: code,
      icon: icon || '❓',
      color: color,
      description: desc,
      sortOrder: sort,
      status: status
    });
    // 初始化症状分组
    var symptoms = getSymptoms();
    if (!symptoms[code]) {
      symptoms[code] = [];
      saveSymptomsData(symptoms);
    }
  }

  saveProblems(problems);
  closeProblemModal();
  renderProblems(document.getElementById('searchInput').value.trim());
  BizUtils.showToast('保存成功');
}

function deleteProblem(id) {
  if (!confirm('确认删除该问题？关联的症状也会一并删除。')) return;
  var problems = getProblems();
  var p = problems.find(function(x) { return x._id === id; });
  if (p) {
    // 删除关联症状
    var symptoms = getSymptoms();
    delete symptoms[p.code];
    saveSymptomsData(symptoms);
  }
  problems = problems.filter(function(x) { return x._id !== id; });
  saveProblems(problems);
  renderProblems(document.getElementById('searchInput').value.trim());
  BizUtils.showToast('已删除');
}

// ===== 症状弹窗 =====
function openSymptomModal(problemCode, editId) {
  var modal = document.getElementById('symptomModal');
  document.getElementById('symptomEditId').value = '';
  document.getElementById('symptomProblemCode').value = problemCode;
  document.getElementById('sName').value = '';
  document.querySelectorAll('.sIndustry').forEach(function(cb) { cb.checked = false; });
  document.querySelectorAll('.sStage').forEach(function(cb) { cb.checked = false; });
  document.getElementById('symptomModalTitle').textContent = '新增症状';

  if (editId) {
    var symptoms = getSymptoms();
    var list = symptoms[problemCode] || [];
    var s = list.find(function(x) { return x._id === editId; });
    if (s) {
      document.getElementById('symptomEditId').value = s._id;
      document.getElementById('sName').value = s.name;
      (s.industryFilter || []).forEach(function(v) {
        var cb = document.querySelector('.sIndustry[value="' + v + '"]');
        if (cb) cb.checked = true;
      });
      (s.stageFilter || []).forEach(function(v) {
        var cb = document.querySelector('.sStage[value="' + v + '"]');
        if (cb) cb.checked = true;
      });
      document.getElementById('symptomModalTitle').textContent = '编辑症状';
    }
  }
  modal.classList.add('show');
}

function closeSymptomModal() {
  document.getElementById('symptomModal').classList.remove('show');
}

function saveSymptom() {
  var editId = document.getElementById('symptomEditId').value;
  var problemCode = document.getElementById('symptomProblemCode').value;
  var name = document.getElementById('sName').value.trim();

  if (!name) { BizUtils.showToast('请输入症状名称'); return; }

  var industries = [];
  document.querySelectorAll('.sIndustry:checked').forEach(function(cb) { industries.push(cb.value); });
  var stages = [];
  document.querySelectorAll('.sStage:checked').forEach(function(cb) { stages.push(cb.value); });

  var symptoms = getSymptoms();
  if (!symptoms[problemCode]) symptoms[problemCode] = [];

  if (editId) {
    var s = symptoms[problemCode].find(function(x) { return x._id === editId; });
    if (s) {
      s.name = name;
      s.industryFilter = industries;
      s.stageFilter = stages;
    }
  } else {
    symptoms[problemCode].push({
      _id: 'sym_' + BizUtils.genId(),
      name: name,
      industryFilter: industries,
      stageFilter: stages
    });
  }

  saveSymptomsData(symptoms);
  closeSymptomModal();
  renderProblems(document.getElementById('searchInput').value.trim());
  BizUtils.showToast('保存成功');
}

function deleteSymptom(problemCode, symptomId) {
  if (!confirm('确认删除该症状？')) return;
  var symptoms = getSymptoms();
  if (symptoms[problemCode]) {
    symptoms[problemCode] = symptoms[problemCode].filter(function(x) { return x._id !== symptomId; });
    saveSymptomsData(symptoms);
  }
  renderProblems(document.getElementById('searchInput').value.trim());
  BizUtils.showToast('已删除');
}

// ===== 初始渲染 =====
renderProblems();
</script>
