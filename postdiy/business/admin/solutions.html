<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案管理 - 闪喵经营诊断</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    /* 工具栏 */
    .page-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .page-toolbar .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-toolbar .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-input {
      height: 36px; padding: 0 12px;
      border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 13px; width: 220px; outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #6366f1; }

    /* 排序指示器 */
    .sort-th { cursor: pointer; user-select: none; }
    .sort-th:hover { color: #4f46e5; }
    .sort-th .sort-arrow { font-size: 10px; margin-left: 2px; opacity: 0.3; }
    .sort-th.active .sort-arrow { opacity: 1; }

    /* 弹窗 */
    .modal-overlay {
      display: none; position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45); z-index: 500;
      justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff; border-radius: 14px;
      width: 640px; max-width: 92vw; max-height: 85vh;
      overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-header {
      padding: 20px 24px; border-bottom: 1px solid #f3f4f6;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 16px; font-weight: 600; color: #1f2937; }
    .modal-close {
      width: 32px; height: 32px; border: none; background: none;
      font-size: 20px; color: #9ca3af; cursor: pointer; border-radius: 6px;
    }
    .modal-close:hover { background: #f3f4f6; color: #374151; }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px; border-top: 1px solid #f3f4f6;
      display: flex; justify-content: flex-end; gap: 10px;
    }
    .modal-footer .btn { width: auto; min-width: 80px; }

    /* 步骤动态添加 */
    .step-list { margin-top: 8px; }
    .step-item {
      background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 12px; margin-bottom: 8px; position: relative;
    }
    .step-item .step-num {
      position: absolute; top: 8px; left: 8px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #6366f1; color: #fff; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600;
    }
    .step-item .step-fields { margin-left: 30px; }
    .step-item .step-fields .form-group { margin-bottom: 10px; }
    .step-item .step-fields .form-group:last-child { margin-bottom: 0; }
    .step-item .step-remove {
      position: absolute; top: 8px; right: 8px;
      width: 24px; height: 24px; border: none; background: #fee2e2;
      color: #dc2626; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    .step-item .step-remove:hover { background: #fecaca; }
    .step-item input, .step-item textarea { font-size: 13px; }
    .step-item .form-input { height: 36px; }
    .step-item .form-textarea { min-height: 60px; }

    /* 预览弹窗 */
    .preview-box {
      background: #f9fafb; border-radius: 10px; padding: 20px;
      border: 1px solid #e5e7eb;
    }
    .preview-box h4 { font-size: 15px; font-weight: 600; color: #1f2937; margin-bottom: 12px; }
    .preview-box .preview-step {
      display: flex; gap: 12px; margin-bottom: 12px;
      padding-bottom: 12px; border-bottom: 1px solid #e5e7eb;
    }
    .preview-box .preview-step:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .preview-step .step-circle {
      width: 28px; height: 28px; border-radius: 50%;
      background: #6366f1; color: #fff; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; flex-shrink: 0;
    }
    .preview-step .step-body { flex: 1; }
    .preview-step .step-title { font-weight: 600; color: #1f2937; font-size: 14px; }
    .preview-step .step-content { font-size: 13px; color: #6b7280; margin-top: 4px; }
  </style>
</head>
<body>

<div class="admin-layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 侧边栏 -->
  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="sidebar-brand-icon">⚡</span>
        <span>闪喵诊断</span>
      </div>
      <div class="sidebar-sub">管理后台 v1.0</div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html" data-page="dashboard">
        <span class="nav-icon">📊</span><span>首页</span>
      </a>
      <a class="nav-item" href="problems.html" data-page="problems">
        <span class="nav-icon">❓</span><span>问题管理</span>
      </a>
      <a class="nav-item" href="diagnosis-paths.html" data-page="diagnosis">
        <span class="nav-icon">🔀</span><span>诊断路径管理</span>
      </a>
      <a class="nav-item active" href="solutions.html" data-page="solutions">
        <span class="nav-icon">💡</span><span>方案管理</span>
      </a>
      <a class="nav-item" data-page="cases">
        <span class="nav-icon">📖</span><span>案例管理</span>
      </a>
      <a class="nav-item" data-page="tools">
        <span class="nav-icon">📦</span><span>工具管理</span>
      </a>
      <a class="nav-item" data-page="tags">
        <span class="nav-icon">🏷️</span><span>标签管理</span>
      </a>
      <a class="nav-item" data-page="stats">
        <span class="nav-icon">📊</span><span>数据统计</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="nav-item" onclick="handleLogout()">
        <span class="nav-icon">🚪</span><span>退出登录</span>
      </div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="topbar-hamburger" id="hamburgerBtn">☰</button>
        <span class="topbar-title">方案管理</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-admin">
          <span class="admin-avatar" id="adminAvatar">管</span>
          <span id="adminName">管理员</span>
        </div>
        <button class="topbar-logout" onclick="handleLogout()">退出</button>
      </div>
    </header>

    <main class="admin-content">
      <!-- 工具栏 -->
      <div class="page-toolbar">
        <div class="toolbar-left">
          <input type="text" class="search-input" id="searchInput" placeholder="搜索方案标题...">
        </div>
        <div class="toolbar-right">
          <button class="btn btn-sm btn-primary" onclick="openSolutionModal()" style="width:auto;">＋ 新增方案</button>
        </div>
      </div>

      <!-- 方案列表 -->
      <div class="content-card">
        <div class="card-header">
          <span class="card-title">💡 解决方案列表</span>
          <span class="card-extra" id="solutionCount">共 0 条</span>
        </div>
        <div class="card-body" style="padding:0; overflow-x:auto;">
          <table class="admin-table" id="solutionTable">
            <thead>
              <tr>
                <th style="width:50px;">序号</th>
                <th class="sort-th" data-sort="title">标题 <span class="sort-arrow">▲</span></th>
                <th class="sort-th" data-sort="difficulty">难度 <span class="sort-arrow">▲</span></th>
                <th>关联问题</th>
                <th>见效时间</th>
                <th>成本</th>
                <th>状态</th>
                <th style="width:180px;">操作</th>
              </tr>
            </thead>
            <tbody id="solutionBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 新增/编辑方案弹窗 -->
<div class="modal-overlay" id="solutionModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="solutionModalTitle">新增方案</h3>
      <button class="modal-close" onclick="closeSolutionModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="solutionEditId">
      <div class="form-group">
        <label>方案标题</label>
        <input type="text" class="form-input" id="solTitle" placeholder="如：周边3公里精准引流方案">
      </div>
      <div class="form-group">
        <label>摘要</label>
        <textarea class="form-textarea" id="solSummary" placeholder="方案核心概述..."></textarea>
      </div>
      <div style="display:flex;gap:16px;">
        <div class="form-group" style="flex:1;">
          <label>难度</label>
          <select class="form-select" id="solDifficulty">
            <option value="简单">简单</option>
            <option value="中等">中等</option>
            <option value="较难">较难</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;">
          <label>见效时间</label>
          <input type="text" class="form-input" id="solEffTime" placeholder="如：1-2周见效">
        </div>
      </div>
      <div class="form-group">
        <label>成本范围</label>
        <input type="text" class="form-input" id="solCost" placeholder="如：500-2000元/月">
      </div>
      <div class="form-group">
        <label>关联问题（多选）</label>
        <div id="problemCheckboxes" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;"></div>
      </div>

      <!-- 步骤动态列表 -->
      <div class="form-group">
        <label>执行步骤</label>
        <div class="step-list" id="stepList"></div>
        <button type="button" class="btn btn-sm btn-ghost" onclick="addStep()" style="margin-top:6px;">＋ 添加步骤</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm btn-ghost" onclick="closeSolutionModal()">取消</button>
      <button class="btn btn-sm btn-primary" onclick="saveSolution()" style="width:auto;">保存</button>
    </div>
  </div>
</div>

<!-- 预览弹窗 -->
<div class="modal-overlay" id="previewModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>方案预览</h3>
      <button class="modal-close" onclick="closePreviewModal()">✕</button>
    </div>
    <div class="modal-body" id="previewContent"></div>
    <div class="modal-footer">
      <button class="btn btn-sm btn-ghost" onclick="closePreviewModal()">关闭</button>
    </div>
  </div>
</div>

<script src="../js/biz-data.js"></script>
<script src="../js/utils.js"></script>
<script>
/**
 * 方案管理页面逻辑
 */

// ===== 登录鉴权 =====
(function checkAuth() {
  var session = localStorage.getItem('biz_admin_session');
  if (!session) { location.href = 'login.html'; return; }
  try {
    var info = JSON.parse(session);
    if (!info || !info.loggedIn) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = info.name || info.username;
    document.getElementById('adminAvatar').textContent = (info.name || info.username || '管').charAt(0);
  } catch (e) { location.href = 'login.html'; }
})();

function handleLogout() {
  localStorage.removeItem('biz_admin_session');
  location.href = 'login.html';
}

// ===== 侧边栏交互 =====
(function() {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  var hamburger = document.getElementById('hamburgerBtn');
  hamburger.addEventListener('click', function() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', function() {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });
})();

// ===== 本地数据管理 =====
var SOLUTION_KEY = 'biz_admin_solutions';

function getSolutions() {
  var stored = localStorage.getItem(SOLUTION_KEY);
  if (stored) {
    try { return JSON.parse(stored); } catch (e) {}
  }
  var solutions = (typeof BizData !== 'undefined' && BizData.solutions) ? BizData.solutions.map(function(s) {
    return {
      _id: s._id,
      title: s.title,
      summary: s.summary || '',
      difficulty: s.difficulty || '中等',
      effectiveTime: s.effectiveTime || '',
      costRange: s.costRange || '',
      problemCodes: s.problemCodes || [],
      steps: (s.steps || []).map(function(st) {
        return { title: st.title, content: st.content, checklist: st.checklist || [] };
      }),
      status: 'active'
    };
  }) : [];
  localStorage.setItem(SOLUTION_KEY, JSON.stringify(solutions));
  return solutions;
}

function saveSolutions(solutions) {
  localStorage.setItem(SOLUTION_KEY, JSON.stringify(solutions));
}

// ===== 排序 =====
var currentSort = { field: 'title', dir: 'asc' };
var difficultyOrder = { '简单': 1, '中等': 2, '较难': 3 };

function sortSolutions(solutions, field, dir) {
  return solutions.slice().sort(function(a, b) {
    var va = a[field] || '';
    var vb = b[field] || '';
    if (field === 'difficulty') {
      va = difficultyOrder[va] || 0;
      vb = difficultyOrder[vb] || 0;
      return dir === 'asc' ? va - vb : vb - va;
    }
    va = String(va).toLowerCase();
    vb = String(vb).toLowerCase();
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

// ===== 渲染 =====
function renderSolutions(searchKeyword) {
  var solutions = getSolutions();

  if (searchKeyword) {
    var kw = searchKeyword.toLowerCase();
    solutions = solutions.filter(function(s) {
      return s.title.toLowerCase().indexOf(kw) >= 0;
    });
  }

  solutions = sortSolutions(solutions, currentSort.field, currentSort.dir);

  var problems = (typeof BizData !== 'undefined' && BizData.problems) ? BizData.problems : [];

  var tbody = document.getElementById('solutionBody');
  var html = '';

  solutions.forEach(function(s, idx) {
    var diffTag = 'tag-green';
    if (s.difficulty === '中等') diffTag = 'tag-orange';
    if (s.difficulty === '较难') diffTag = 'tag-red';

    // 关联问题名称
    var probNames = (s.problemCodes || []).map(function(code) {
      var p = problems.find(function(x) { return x.code === code; });
      return p ? p.name : code;
    });

    html += '<tr>';
    html += '<td>' + (idx + 1) + '</td>';
    html += '<td style="font-weight:500;">' + escHtml(s.title) + '</td>';
    html += '<td><span class="table-tag ' + diffTag + '">' + escHtml(s.difficulty) + '</span></td>';
    html += '<td>' + probNames.map(function(n) { return '<span class="table-tag tag-blue" style="margin:1px;">' + escHtml(n) + '</span>'; }).join(' ') + '</td>';
    html += '<td>' + escHtml(s.effectiveTime) + '</td>';
    html += '<td>' + escHtml(s.costRange) + '</td>';
    html += '<td>' + (s.status === 'active' ? '<span class="table-tag tag-green">启用</span>' : '<span class="table-tag tag-gray">停用</span>') + '</td>';
    html += '<td>';
    html += '<div class="table-actions">';
    html += '<button class="action-btn view" onclick="previewSolution(\'' + s._id + '\')">预览</button>';
    html += '<button class="action-btn edit" onclick="openSolutionModal(\'' + s._id + '\')">编辑</button>';
    html += '<button class="action-btn delete" onclick="deleteSolution(\'' + s._id + '\')">删除</button>';
    html += '</div>';
    html += '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
  document.getElementById('solutionCount').textContent = '共 ' + solutions.length + ' 条';
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== 排序 =====
document.querySelectorAll('.sort-th').forEach(function(th) {
  th.addEventListener('click', function() {
    var field = th.getAttribute('data-sort');
    if (currentSort.field === field) {
      currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort.field = field;
      currentSort.dir = 'asc';
    }
    document.querySelectorAll('.sort-th').forEach(function(t) { t.classList.remove('active'); });
    th.classList.add('active');
    renderSolutions(document.getElementById('searchInput').value.trim());
  });
});

document.getElementById('searchInput').addEventListener('input', function() {
  renderSolutions(this.value.trim());
});

// ===== 方案弹窗 =====
var stepCounter = 0;

function openSolutionModal(editId) {
  var modal = document.getElementById('solutionModal');
  document.getElementById('solutionEditId').value = '';
  document.getElementById('solTitle').value = '';
  document.getElementById('solSummary').value = '';
  document.getElementById('solDifficulty').value = '简单';
  document.getElementById('solEffTime').value = '';
  document.getElementById('solCost').value = '';
  stepCounter = 0;
  document.getElementById('stepList').innerHTML = '';
  document.getElementById('solutionModalTitle').textContent = '新增方案';

  // 渲染问题复选框
  renderProblemCheckboxes([]);

  if (editId) {
    var solutions = getSolutions();
    var s = solutions.find(function(x) { return x._id === editId; });
    if (s) {
      document.getElementById('solutionEditId').value = s._id;
      document.getElementById('solTitle').value = s.title;
      document.getElementById('solSummary').value = s.summary || '';
      document.getElementById('solDifficulty').value = s.difficulty || '简单';
      document.getElementById('solEffTime').value = s.effectiveTime || '';
      document.getElementById('solCost').value = s.costRange || '';
      renderProblemCheckboxes(s.problemCodes || []);
      // 填充步骤
      (s.steps || []).forEach(function(st) { addStep(st.title, st.content, (st.checklist || []).join('\n')); });
      document.getElementById('solutionModalTitle').textContent = '编辑方案';
    }
  }
  modal.classList.add('show');
}

function closeSolutionModal() {
  document.getElementById('solutionModal').classList.remove('show');
}

function renderProblemCheckboxes(selectedCodes) {
  var problems = (typeof BizData !== 'undefined' && BizData.problems) ? BizData.problems : [];
  var container = document.getElementById('problemCheckboxes');
  var html = '';
  problems.forEach(function(p) {
    var checked = selectedCodes.indexOf(p.code) >= 0 ? 'checked' : '';
    html += '<label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">';
    html += '<input type="checkbox" value="' + p.code + '" class="solProblem" ' + checked + '> ' + escHtml(p.icon) + ' ' + escHtml(p.name);
    html += '</label>';
  });
  container.innerHTML = html;
}

function addStep(title, content, checklist) {
  stepCounter++;
  var list = document.getElementById('stepList');
  var div = document.createElement('div');
  div.className = 'step-item';
  div.setAttribute('data-step', stepCounter);
  div.innerHTML =
    '<span class="step-num">' + stepCounter + '</span>' +
    '<div class="step-fields">' +
      '<div class="form-group"><label>步骤标题</label><input type="text" class="form-input step-title" value="' + escAttr(title || '') + '" placeholder="步骤标题"></div>' +
      '<div class="form-group"><label>步骤内容</label><textarea class="form-textarea step-content" placeholder="步骤详细说明...">' + escHtml(content || '') + '</textarea></div>' +
      '<div class="form-group"><label>检查项（每行一条）</label><textarea class="form-textarea step-checklist" placeholder="检查项1\n检查项2" style="min-height:50px;">' + escHtml(checklist || '') + '</textarea></div>' +
    '</div>' +
    '<button class="step-remove" onclick="removeStep(this)" title="删除步骤">✕</button>';
  list.appendChild(div);
}

function removeStep(btn) {
  btn.closest('.step-item').remove();
  reindexSteps();
}

function reindexSteps() {
  var items = document.querySelectorAll('#stepList .step-item');
  items.forEach(function(item, idx) {
    item.querySelector('.step-num').textContent = idx + 1;
  });
}

function escAttr(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function saveSolution() {
  var editId = document.getElementById('solutionEditId').value;
  var title = document.getElementById('solTitle').value.trim();
  var summary = document.getElementById('solSummary').value.trim();
  var difficulty = document.getElementById('solDifficulty').value;
  var effectiveTime = document.getElementById('solEffTime').value.trim();
  var costRange = document.getElementById('solCost').value.trim();

  if (!title) { BizUtils.showToast('请输入方案标题'); return; }

  var problemCodes = [];
  document.querySelectorAll('.solProblem:checked').forEach(function(cb) { problemCodes.push(cb.value); });

  // 收集步骤
  var steps = [];
  document.querySelectorAll('#stepList .step-item').forEach(function(item) {
    var st = {
      title: item.querySelector('.step-title').value.trim(),
      content: item.querySelector('.step-content').value.trim(),
      checklist: item.querySelector('.step-checklist').value.trim().split('\n').filter(function(l) { return l.trim(); })
    };
    if (st.title) steps.push(st);
  });

  var solutions = getSolutions();

  if (editId) {
    var s = solutions.find(function(x) { return x._id === editId; });
    if (s) {
      s.title = title;
      s.summary = summary;
      s.difficulty = difficulty;
      s.effectiveTime = effectiveTime;
      s.costRange = costRange;
      s.problemCodes = problemCodes;
      s.steps = steps;
    }
  } else {
    solutions.push({
      _id: 'sol_' + BizUtils.genId(),
      title: title,
      summary: summary,
      difficulty: difficulty,
      effectiveTime: effectiveTime,
      costRange: costRange,
      problemCodes: problemCodes,
      steps: steps,
      status: 'active'
    });
  }

  saveSolutions(solutions);
  closeSolutionModal();
  renderSolutions(document.getElementById('searchInput').value.trim());
  BizUtils.showToast('保存成功');
}

function deleteSolution(id) {
  if (!confirm('确认删除该方案？')) return;
  var solutions = getSolutions();
  solutions = solutions.filter(function(x) { return x._id !== id; });
  saveSolutions(solutions);
  renderSolutions(document.getElementById('searchInput').value.trim());
  BizUtils.showToast('已删除');
}

// ===== 预览 =====
function previewSolution(id) {
  var solutions = getSolutions();
  var s = solutions.find(function(x) { return x._id === id; });
  if (!s) return;

  var problems = (typeof BizData !== 'undefined' && BizData.problems) ? BizData.problems : [];
  var probNames = (s.problemCodes || []).map(function(code) {
    var p = problems.find(function(x) { return x.code === code; });
    return p ? p.name : code;
  });

  var html = '<div class="preview-box">';
  html += '<h4>' + escHtml(s.title) + '</h4>';
  html += '<p style="color:#6b7280;font-size:13px;margin-bottom:12px;">' + escHtml(s.summary) + '</p>';
  html += '<div style="display:flex;gap:16px;margin-bottom:16px;font-size:13px;">';
  html += '<span>难度：<span class="table-tag ' + (s.difficulty === '简单' ? 'tag-green' : s.difficulty === '中等' ? 'tag-orange' : 'tag-red') + '">' + escHtml(s.difficulty) + '</span></span>';
  html += '<span>见效：' + escHtml(s.effectiveTime) + '</span>';
  html += '<span>成本：' + escHtml(s.costRange) + '</span>';
  html += '</div>';
  html += '<div style="margin-bottom:12px;font-size:13px;">关联问题：' + probNames.map(function(n) { return '<span class="table-tag tag-blue">' + escHtml(n) + '</span>'; }).join(' ') + '</div>';

  if (s.steps && s.steps.length) {
    html += '<h4 style="margin-top:16px;">📋 执行步骤</h4>';
    s.steps.forEach(function(st, idx) {
      html += '<div class="preview-step">';
      html += '<span class="step-circle">' + (idx + 1) + '</span>';
      html += '<div class="step-body">';
      html += '<div class="step-title">' + escHtml(st.title) + '</div>';
      html += '<div class="step-content">' + escHtml(st.content) + '</div>';
      if (st.checklist && st.checklist.length) {
        html += '<ul style="margin-top:6px;padding-left:16px;font-size:12px;color:#6b7280;">';
        st.checklist.forEach(function(c) {
          html += '<li>☐ ' + escHtml(c) + '</li>';
        });
        html += '</ul>';
      }
      html += '</div></div>';
    });
  }

  html += '</div>';

  document.getElementById('previewContent').innerHTML = html;
  document.getElementById('previewModal').classList.add('show');
}

function closePreviewModal() {
  document.getElementById('previewModal').classList.remove('show');
}

// ===== 初始渲染 =====
renderSolutions();
</script>
