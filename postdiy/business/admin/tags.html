<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标签管理 - 闪喵经营诊断</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      z-index: 500;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 14px;
      width: 500px;
      max-width: 92vw;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 18px; font-weight: 600; }
    .modal-close {
      width: 32px; height: 32px;
      border: none;
      background: #f3f4f6;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }
    .modal-body { padding: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: #6366f1;
    }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid #f3f4f6;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn-cancel {
      padding: 10px 20px;
      border: 1px solid #d1d5db;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-save {
      padding: 10px 24px;
      border: none;
      background: #6366f1;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .status-active { background: #d1fae5; color: #065f46; }
    .status-inactive { background: #fee2e2; color: #991b1b; }
    .tag-type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    .type-industry { background: #e0e7ff; color: #4f46e5; }
    .type-stage { background: #fef3c7; color: #92400e; }
    .type-problem { background: #fee2e2; color: #991b1b; }
    .type-other { background: #f3f4f6; color: #374151; }
    .page-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-input {
      height: 36px;
      padding: 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      width: 220px;
      outline: none;
    }
    .search-input:focus {
      border-color: #6366f1;
    }
    .btn-link {
      background: none;
      border: none;
      color: #6366f1;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 13px;
    }
    .btn-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="admin-layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 侧边栏 -->
  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="sidebar-brand-icon">⚡</span>
        <span>闪喵诊断</span>
      </div>
      <div class="sidebar-sub">管理后台 v1.0</div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="index.html" data-page="dashboard">
        <span class="nav-icon">📊</span><span>首页</span>
      </a>
      <a class="nav-item" href="problems.html" data-page="problems">
        <span class="nav-icon">❓</span><span>问题管理</span>
      </a>
      <a class="nav-item" href="diagnosis-paths.html" data-page="diagnosis">
        <span class="nav-icon">🔀</span><span>诊断路径管理</span>
      </a>
      <a class="nav-item" href="solutions.html" data-page="solutions">
        <span class="nav-icon">💡</span><span>方案管理</span>
      </a>
      <a class="nav-item" href="cases.html" data-page="cases">
        <span class="nav-icon">📖</span><span>案例管理</span>
      </a>
      <a class="nav-item" href="tools.html" data-page="tools">
        <span class="nav-icon">📦</span><span>工具管理</span>
      </a>
      <a class="nav-item active" href="tags.html" data-page="tags">
        <span class="nav-icon">🏷️</span><span>标签管理</span>
      </a>
      <a class="nav-item" href="stats.html" data-page="stats">
        <span class="nav-icon">📊</span><span>数据统计</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="nav-item" onclick="handleLogout()">
        <span class="nav-icon">🚪</span><span>退出登录</span>
      </div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="topbar-hamburger" id="hamburgerBtn">☰</button>
        <span class="topbar-title">标签管理</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-admin">
          <span class="admin-avatar" id="adminAvatar">管</span>
          <span id="adminName">管理员</span>
        </div>
        <button class="topbar-logout" onclick="handleLogout()">退出</button>
      </div>
    </header>

    <main class="admin-content">
      <div class="page-toolbar">
        <div class="toolbar-left">
          <input type="text" class="search-input" placeholder="搜索标签名称..." id="searchInput" oninput="filterTags()">
        </div>
        <div class="toolbar-right">
          <button class="btn btn-primary" onclick="openAddModal()">+ 新增标签</button>
        </div>
      </div>

      <div class="content-card">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:60px;">序号</th>
              <th>标签名称</th>
              <th style="width:100px;">类型</th>
              <th style="width:80px;">状态</th>
              <th style="width:140px;">操作</th>
            </tr>
          </thead>
          <tbody id="dataTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">新增标签</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>标签名称</label>
        <input type="text" id="editName" placeholder="请输入标签名称">
      </div>
      <div class="form-group">
        <label>类型</label>
        <select id="editType">
          <option value="industry">行业标签</option>
          <option value="stage">阶段标签</option>
          <option value="problem">问题标签</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>状态</label>
        <select id="editStatus">
          <option value="active">启用</option>
          <option value="inactive">禁用</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveTag()">保存</button>
    </div>
  </div>
</div>

<script src="admin-store.js"></script>
<script>
// 登录鉴权
(function checkAuth() {
  var session = localStorage.getItem('biz_admin_session');
  if (!session) { location.href = 'login.html'; return; }
  try {
    var info = JSON.parse(session);
    if (!info || !info.loggedIn) { location.href = 'login.html'; return; }
    document.getElementById('adminName').textContent = info.name || info.username;
    document.getElementById('adminAvatar').textContent = (info.name || info.username || '管').charAt(0);
  } catch (e) { location.href = 'login.html'; }
})();

function handleLogout() {
  localStorage.removeItem('biz_admin_session');
  location.href = 'login.html';
}

// 侧边栏交互
(function() {
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  var hamburger = document.getElementById('hamburgerBtn');
  hamburger.addEventListener('click', function() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', function() {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });
})();

// 类型映射
var typeNames = {
  industry: '行业标签',
  stage: '阶段标签',
  problem: '问题标签',
  other: '其他'
};

// 渲染标签列表
function renderTags(list) {
  var tbody = document.getElementById('dataTableBody');
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:#9ca3af;">暂无数据</td></tr>';
    return;
  }
  var html = '';
  list.forEach(function(item, index) {
    var statusClass = item.status === 'inactive' ? 'status-inactive' : 'status-active';
    var statusText = item.status === 'inactive' ? '禁用' : '启用';
    var typeClass = 'type-' + (item.type || 'other');
    var typeText = typeNames[item.type] || '其他';
    html += '<tr>' +
      '<td>' + (index + 1) + '</td>' +
      '<td>' + (item.name || '-') + '</td>' +
      '<td><span class="tag-type-badge ' + typeClass + '">' + typeText + '</span></td>' +
      '<td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>' +
      '<td>' +
        '<button class="btn-link" onclick="editTag(\'' + item._id + '\')">编辑</button> ' +
        '<button class="btn-link" style="color:#ef4444;" onclick="deleteTag(\'' + item._id + '\')">删除</button>' +
      '</td>' +
    '</tr>';
  });
  tbody.innerHTML = html;
}

// 过滤标签
function filterTags() {
  var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  var allTags = AdminStore.getTags();
  if (!keyword) {
    renderTags(allTags);
    return;
  }
  var filtered = allTags.filter(function(item) {
    return (item.name || '').toLowerCase().indexOf(keyword) > -1 ||
           (typeNames[item.type] || '').toLowerCase().indexOf(keyword) > -1;
  });
  renderTags(filtered);
}

// 打开新增弹窗
function openAddModal() {
  document.getElementById('modalTitle').textContent = '新增标签';
  document.getElementById('editId').value = '';
  document.getElementById('editName').value = '';
  document.getElementById('editType').value = 'industry';
  document.getElementById('editStatus').value = 'active';
  document.getElementById('editModal').classList.add('show');
}

// 编辑标签
function editTag(id) {
  var allTags = AdminStore.getTags();
  var item = allTags.find(function(t) { return t._id === id; });
  if (!item) return;
  document.getElementById('modalTitle').textContent = '编辑标签';
  document.getElementById('editId').value = id;
  document.getElementById('editName').value = item.name || '';
  document.getElementById('editType').value = item.type || 'industry';
  document.getElementById('editStatus').value = item.status || 'active';
  document.getElementById('editModal').classList.add('show');
}

// 关闭弹窗
function closeModal() {
  document.getElementById('editModal').classList.remove('show');
}

// 保存标签
function saveTag() {
  var id = document.getElementById('editId').value;
  var name = document.getElementById('editName').value.trim();
  if (!name) {
    alert('请输入标签名称');
    return;
  }
  var data = {
    _id: id || ('tag_' + Date.now()),
    name: name,
    type: document.getElementById('editType').value,
    status: document.getElementById('editStatus').value
  };

  var allTags = AdminStore.getTags();

  if (id) {
    // 编辑
    var index = allTags.findIndex(function(t) { return t._id === id; });
    if (index > -1) {
      allTags[index] = Object.assign({}, allTags[index], data);
    }
  } else {
    // 新增
    allTags.push(data);
  }

  // 保存到localStorage
  AdminStore.saveTags(allTags);

  closeModal();
  renderTags(allTags);
  alert('保存成功');
}

// 删除标签
function deleteTag(id) {
  if (!confirm('确定要删除这个标签吗？')) return;
  var allTags = AdminStore.getTags();
  var index = allTags.findIndex(function(t) { return t._id === id; });
  if (index > -1) {
    allTags.splice(index, 1);
    // 保存到localStorage
    AdminStore.saveTags(allTags);
  }
  renderTags(allTags);
}

// 初始化
renderTags(AdminStore.getTags());
</script>

</body>
</html>
