<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人中心 - 闪喵经营诊断</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    /* ===== 图标通用 ===== */
    .biz-icon {
      display: inline-block;
      vertical-align: middle;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== 底部导航覆盖 ===== */
    .biz-tab-bar {
      background: rgba(255, 255, 255, 0.92);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 0.5px solid rgba(0, 0, 0, 0.08);
    }
    .biz-tab-item .biz-tab-icon {
      font-size: 0;
    }

    /* 用户信息卡片 */
    .biz-user-card {
      background: linear-gradient(135deg, #1A73E8 0%, #4F8EF7 100%);
      border-radius: var(--biz-radius-lg);
      padding: 20px;
      color: #fff;
      margin-bottom: 16px;
    }
    .biz-user-card .user-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .biz-user-card .user-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .biz-user-card .user-info {
      flex: 1;
      min-width: 0;
    }
    .biz-user-card .user-phone {
      font-size: var(--biz-font-h3);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .biz-user-card .user-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .biz-user-card .user-tag {
      padding: 2px 8px;
      border-radius: var(--biz-radius-pill);
      font-size: 11px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .biz-user-card .user-stats {
      display: flex;
      gap: 0;
    }
    .biz-user-card .user-stat {
      flex: 1;
      text-align: center;
    }
    .biz-user-card .user-stat + .user-stat {
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }
    .biz-user-card .user-stat .stat-num {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }
    .biz-user-card .user-stat .stat-label {
      font-size: 12px;
      opacity: 0.8;
    }
    .biz-user-card .user-logout {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 4px 10px;
      border-radius: var(--biz-radius-pill);
      font-size: 11px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
    }
    .biz-user-card .user-logout:active {
      background: rgba(255, 255, 255, 0.35);
    }
    .biz-user-card {
      position: relative;
    }

    /* 未登录状态 */
    .biz-login-guide {
      background: #fff;
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--biz-radius-lg);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      padding: 40px 24px;
      text-align: center;
      margin-bottom: 16px;
    }
    .biz-login-guide .guide-icon {
      margin-bottom: 12px;
      color: var(--biz-primary);
    }
    .biz-login-guide .guide-title {
      font-size: var(--biz-font-h3);
      font-weight: 600;
      color: var(--biz-text-primary);
      margin-bottom: 8px;
    }
    .biz-login-guide .guide-desc {
      font-size: var(--biz-font-small);
      color: var(--biz-text-tertiary);
      margin-bottom: 20px;
    }
    .biz-login-guide .guide-btn {
      display: inline-block;
      padding: 10px 32px;
      border-radius: var(--biz-radius-pill);
      background: linear-gradient(135deg, #1A73E8 0%, #4F8EF7 100%);
      color: #fff;
      font-size: var(--biz-font-body);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .biz-login-guide .guide-btn:active {
      transform: scale(0.97);
    }

    /* 取消收藏按钮 */
    .biz-fav-item .fav-remove {
      font-size: var(--biz-font-tiny);
      color: var(--biz-accent);
      padding: 2px 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 最近诊断记录 */
    .biz-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .biz-section-header .section-title {
      font-size: var(--biz-font-h3);
      font-weight: 600;
      color: var(--biz-text-primary);
    }
    .biz-section-header .section-more {
      font-size: var(--biz-font-small);
      color: var(--biz-text-tertiary);
    }
    .biz-record-list {
      background: #fff;
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--biz-radius-md);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .biz-record-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #F3F4F6;
      cursor: pointer;
      transition: background 0.15s;
    }
    .biz-record-item:last-child {
      border-bottom: none;
    }
    .biz-record-item:active {
      background: #F9FAFB;
    }
    .biz-record-item .record-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--biz-radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .biz-record-item .record-info {
      flex: 1;
      min-width: 0;
    }
    .biz-record-item .record-title {
      font-size: var(--biz-font-body);
      font-weight: 500;
      color: var(--biz-text-primary);
    }
    .biz-record-item .record-date {
      font-size: var(--biz-font-tiny);
      color: var(--biz-text-tertiary);
      margin-top: 2px;
    }
    .biz-record-item .record-arrow {
      color: var(--biz-text-tertiary);
      font-size: 14px;
    }

    /* 收藏Tab */
    .biz-fav-section {
      margin-bottom: 16px;
    }
    .biz-fav-tabs {
      display: flex;
      gap: 0;
      background: rgba(0, 0, 0, 0.03);
      border-radius: var(--biz-radius-md);
      padding: 3px;
      margin-bottom: 12px;
    }
    .biz-fav-tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: var(--biz-font-small);
      font-weight: 500;
      color: var(--biz-text-secondary);
      border-radius: var(--biz-radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      -webkit-user-select: none;
      user-select: none;
    }
    .biz-fav-tab.active {
      background: #fff;
      color: var(--biz-primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .biz-fav-content {
      background: #fff;
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--biz-radius-md);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }
    .biz-fav-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #F3F4F6;
      cursor: pointer;
      transition: background 0.15s;
    }
    .biz-fav-item:last-child {
      border-bottom: none;
    }
    .biz-fav-item:active {
      background: #F9FAFB;
    }
    .biz-fav-item .fav-icon {
      margin-right: 10px;
      flex-shrink: 0;
      color: var(--biz-primary);
    }
    .biz-fav-item .fav-name {
      flex: 1;
      font-size: var(--biz-font-body);
      color: var(--biz-text-primary);
      font-weight: 500;
    }
    .biz-fav-item .fav-arrow {
      color: var(--biz-text-tertiary);
      font-size: 14px;
    }

    /* 更多菜单 */
    .biz-more-list {
      background: #fff;
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--biz-radius-md);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }
    .biz-more-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #F3F4F6;
      cursor: pointer;
      transition: background 0.15s;
    }
    .biz-more-item:last-child {
      border-bottom: none;
    }
    .biz-more-item:active {
      background: #F9FAFB;
    }
    .biz-more-item .more-icon {
      margin-right: 10px;
      flex-shrink: 0;
      color: var(--biz-text-secondary);
    }
    .biz-more-item .more-name {
      flex: 1;
      font-size: var(--biz-font-body);
      color: var(--biz-text-primary);
    }
    .biz-more-item .more-arrow {
      color: var(--biz-text-tertiary);
      font-size: 14px;
    }

    /* ===== 店铺资料卡片 ===== */
    .biz-shop-card {
      background: #fff;
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--biz-radius-md);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
      padding: 16px;
      margin-bottom: 16px;
    }
    .biz-shop-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .biz-shop-card-title {
      font-size: var(--biz-font-h3);
      font-weight: 600;
      color: var(--biz-text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .biz-shop-card-edit {
      font-size: var(--biz-font-small);
      color: var(--biz-primary);
      cursor: pointer;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--biz-radius-pill);
      background: var(--biz-primary-light, #EBF0FF);
      border: none;
    }
    .biz-shop-card-edit:active {
      opacity: 0.7;
    }
    .biz-shop-info-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .biz-shop-info-row {
      display: flex;
      align-items: center;
      font-size: var(--biz-font-body);
    }
    .biz-shop-info-label {
      color: var(--biz-text-secondary);
      width: 72px;
      flex-shrink: 0;
    }
    .biz-shop-info-value {
      color: var(--biz-text-primary);
      font-weight: 500;
    }
    .biz-shop-empty {
      font-size: var(--biz-font-small);
      color: var(--biz-text-tertiary);
      text-align: center;
      padding: 8px 0;
    }

    /* ===== 店铺资料编辑弹窗 ===== */
    .shop-profile-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .shop-profile-overlay.show {
      display: flex;
    }
    .shop-profile-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 380px;
      padding: 32px 24px 24px;
      animation: profileCardIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes profileCardIn {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .shop-profile-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--biz-text-primary);
      margin-bottom: 6px;
    }
    .shop-profile-subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--biz-text-secondary);
      margin-bottom: 24px;
    }
    .shop-profile-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--biz-text-primary);
      margin-bottom: 10px;
    }
    .shop-profile-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      font-size: 15px;
      color: var(--biz-text-primary);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
      background: #F9FAFB;
    }
    .shop-profile-input:focus {
      border-color: var(--biz-primary);
      background: #fff;
    }
    .shop-profile-input::placeholder {
      color: #9CA3AF;
    }
    .shop-profile-options {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .shop-profile-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 14px 8px;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-user-select: none;
      user-select: none;
      background: #F9FAFB;
    }
    .shop-profile-option:active {
      transform: scale(0.96);
    }
    .shop-profile-option.selected {
      border-color: var(--biz-primary);
      background: var(--biz-primary-light, #EBF0FF);
    }
    .shop-profile-option .opt-icon {
      line-height: 1;
      color: var(--biz-text-secondary);
    }
    .shop-profile-option.selected .opt-icon {
      color: var(--biz-primary);
    }
    .shop-profile-option .opt-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--biz-text-primary);
    }
    .shop-profile-option.selected .opt-name {
      color: var(--biz-primary);
    }
    .shop-profile-btn {
      width: 100%;
      padding: 14px 0;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #1A73E8 0%, #4F8EF7 100%);
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .shop-profile-btn:active {
      transform: scale(0.97);
    }
    .shop-profile-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .shop-profile-footer {
      text-align: center;
      font-size: 12px;
      color: var(--biz-text-tertiary);
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <main class="biz-page">
    <!-- 已登录：用户信息卡片 -->
    <div class="biz-user-card" id="userCard" style="display:none">
      <button class="user-logout" onclick="ProfilePage.doLogout()">退出登录</button>
      <div class="user-top">
        <div class="user-avatar"><i data-lucide="user" class="biz-icon" style="width:28px;height:28px;"></i></div>
        <div class="user-info">
          <div class="user-phone" id="userPhone">--</div>
          <div class="user-tags">
            <span class="user-tag" id="userIndustry">--</span>
            <span class="user-tag" id="userStage">--</span>
          </div>
        </div>
      </div>
      <div class="user-stats">
        <div class="user-stat">
          <div class="stat-num" id="diagCount">0</div>
          <div class="stat-label">诊断次数</div>
        </div>
        <div class="user-stat">
          <div class="stat-num" id="favCount">0</div>
          <div class="stat-label">收藏数</div>
        </div>
      </div>
    </div>

    <!-- 未登录：登录引导 -->
    <div class="biz-login-guide" id="loginGuide" style="display:none">
      <div class="guide-icon"><i data-lucide="paw-print" class="biz-icon" style="width:48px;height:48px;"></i></div>
      <div class="guide-title">登录闪喵经营诊断</div>
      <div class="guide-desc">登录后可收藏方案、同步诊断记录</div>
      <button class="guide-btn" onclick="window.location.href='login.html?from=profile'">立即登录</button>
    </div>

    <!-- 店铺资料卡片 -->
    <div class="biz-shop-card" id="shopCard">
      <div class="biz-shop-card-header">
        <span class="biz-shop-card-title"><i data-lucide="store" class="biz-icon" style="width:16px;height:16px;"></i> 店铺资料</span>
        <button class="biz-shop-card-edit" onclick="ShopProfileEdit.open()">修改</button>
      </div>
      <div class="biz-shop-info-list" id="shopInfoList">
        <!-- JS动态渲染 -->
      </div>
    </div>

    <!-- 店铺资料编辑弹窗 -->
    <div class="shop-profile-overlay" id="shopProfileOverlay">
      <div class="shop-profile-card">
        <div class="shop-profile-title">修改店铺信息</div>
        <div class="shop-profile-subtitle">修改后，后续诊断将自动匹配新信息</div>

        <div class="shop-profile-label">店名（选填）</div>
        <input type="text" class="shop-profile-input" id="editShopName" placeholder="比如：张姐火锅店" maxlength="20">

        <div class="shop-profile-label">你的行业</div>
        <div class="shop-profile-options" id="editIndustryOptions">
          <div class="shop-profile-option" data-value="餐饮" onclick="ShopProfileEdit.selectIndustry(this, '餐饮')">
            <span class="opt-icon"><i data-lucide="utensils" class="biz-icon" style="width:24px;height:24px;"></i></span>
            <span class="opt-name">餐饮</span>
          </div>
          <div class="shop-profile-option" data-value="零售" onclick="ShopProfileEdit.selectIndustry(this, '零售')">
            <span class="opt-icon"><i data-lucide="shopping-bag" class="biz-icon" style="width:24px;height:24px;"></i></span>
            <span class="opt-name">零售</span>
          </div>
          <div class="shop-profile-option" data-value="服务业" onclick="ShopProfileEdit.selectIndustry(this, '服务业')">
            <span class="opt-icon"><i data-lucide="scissors" class="biz-icon" style="width:24px;height:24px;"></i></span>
            <span class="opt-name">服务业</span>
          </div>
        </div>

        <div class="shop-profile-label">经营阶段</div>
        <div class="shop-profile-options" id="editStageOptions">
          <div class="shop-profile-option" data-value="新店" onclick="ShopProfileEdit.selectStage(this, '新店')">
            <span class="opt-icon"><i data-lucide="sparkles" class="biz-icon" style="width:24px;height:24px;"></i></span>
            <span class="opt-name">新店（0-3月）</span>
          </div>
          <div class="shop-profile-option" data-value="成长期" onclick="ShopProfileEdit.selectStage(this, '成长期')">
            <span class="opt-icon"><i data-lucide="trending-up" class="biz-icon" style="width:24px;height:24px;"></i></span>
            <span class="opt-name">成长期（3月-2年）</span>
          </div>
          <div class="shop-profile-option" data-value="老店" onclick="ShopProfileEdit.selectStage(this, '老店')">
            <span class="opt-icon"><i data-lucide="store" class="biz-icon" style="width:24px;height:24px;"></i></span>
            <span class="opt-name">老店（2年+）</span>
          </div>
        </div>

        <button class="shop-profile-btn" id="editSaveBtn" onclick="ShopProfileEdit.save()">保存修改</button>
        <div class="shop-profile-footer" onclick="ShopProfileEdit.close()" style="cursor:pointer">取消</div>
      </div>
    </div>

    <!-- 最近诊断记录 -->
    <div class="biz-section-header">
      <span class="section-title">最近诊断</span>
      <span class="section-more" onclick="ProfilePage.viewAllDiagnosis()">查看全部 ›</span>
    </div>
    <div class="biz-record-list" id="recordList">
      <!-- JS动态渲染 -->
    </div>

    <!-- 我的收藏 -->
    <div class="biz-fav-section">
      <div class="biz-section-header">
        <span class="section-title">我的收藏</span>
      </div>
      <div class="biz-fav-tabs" id="favTabs">
        <!-- JS动态渲染 -->
      </div>
      <div class="biz-fav-content" id="favContent">
        <!-- JS动态渲染 -->
      </div>
    </div>

    <!-- 更多 -->
    <div class="biz-section-header">
      <span class="section-title">更多</span>
    </div>
    <div class="biz-more-list">
      <div class="biz-more-item" onclick="ProfilePage.openPage('agreement')">
        <span class="more-icon"><i data-lucide="file-text" class="biz-icon" style="width:18px;height:18px;"></i></span>
        <span class="more-name">用户协议</span>
        <span class="more-arrow">›</span>
      </div>
      <div class="biz-more-item" onclick="ProfilePage.openPage('privacy')">
        <span class="more-icon"><i data-lucide="lock" class="biz-icon" style="width:18px;height:18px;"></i></span>
        <span class="more-name">隐私政策</span>
        <span class="more-arrow">›</span>
      </div>
      <div class="biz-more-item" onclick="ProfilePage.openPage('feedback')">
        <span class="more-icon"><i data-lucide="message-circle" class="biz-icon" style="width:18px;height:18px;"></i></span>
        <span class="more-name">意见反馈</span>
        <span class="more-arrow">›</span>
      </div>
      <div class="biz-more-item" onclick="ProfilePage.openPage('about')">
        <span class="more-icon"><i data-lucide="info" class="biz-icon" style="width:18px;height:18px;"></i></span>
        <span class="more-name">关于我们</span>
        <span class="more-arrow">›</span>
      </div>
    </div>
  </main>

  <!-- 底部导航 -->
  <nav class="biz-tab-bar">
    <a href="index.html" class="biz-tab-item">
      <span class="biz-tab-icon"><i data-lucide="home" class="biz-icon" style="width:20px;height:20px;"></i></span>
      <span class="biz-tab-text">首页</span>
    </a>
    <a href="solutions.html" class="biz-tab-item">
      <span class="biz-tab-icon"><i data-lucide="book-open" class="biz-icon" style="width:20px;height:20px;"></i></span>
      <span class="biz-tab-text">方案库</span>
    </a>
    <a href="tools.html" class="biz-tab-item">
      <span class="biz-tab-icon"><i data-lucide="wrench" class="biz-icon" style="width:20px;height:20px;"></i></span>
      <span class="biz-tab-text">工具</span>
    </a>
    <a href="profile.html" class="biz-tab-item active">
      <span class="biz-tab-icon"><i data-lucide="user" class="biz-icon" style="width:20px;height:20px;"></i></span>
      <span class="biz-tab-text">我的</span>
    </a>
  </nav>

  <script src="js/utils.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/biz-favorite.js"></script>
  <script>
    // 店铺资料编辑弹窗逻辑
    var ShopProfileEdit = {
      selectedIndustry: '',
      selectedStage: '',

      // 行业/阶段名称映射
      industryNames: { 'catering': '餐饮', 'retail': '零售', 'service': '服务业', '餐饮': '餐饮', '零售': '零售', '服务业': '服务业' },
      stageNames: { 'new': '新店', 'growing': '成长期', 'mature': '老店', '新店': '新店', '成长期': '成长期', '老店': '老店' },

      // 打开编辑弹窗
      open: function() {
        // 读取当前店铺资料并预填
        var profile = this.getProfile();
        this.selectedIndustry = profile ? profile.industry : '';
        this.selectedStage = profile ? profile.stage : '';

        document.getElementById('editShopName').value = profile ? (profile.shopName || '') : '';

        // 预选行业
        var industryOptions = document.querySelectorAll('#editIndustryOptions .shop-profile-option');
        for (var i = 0; i < industryOptions.length; i++) {
          industryOptions[i].classList.remove('selected');
          if (industryOptions[i].getAttribute('data-value') === this.selectedIndustry) {
            industryOptions[i].classList.add('selected');
          }
        }

        // 预选阶段
        var stageOptions = document.querySelectorAll('#editStageOptions .shop-profile-option');
        for (var i = 0; i < stageOptions.length; i++) {
          stageOptions[i].classList.remove('selected');
          if (stageOptions[i].getAttribute('data-value') === this.selectedStage) {
            stageOptions[i].classList.add('selected');
          }
        }

        document.getElementById('shopProfileOverlay').classList.add('show');
        BizUtils.replaceIcons();
      },

      // 关闭编辑弹窗
      close: function() {
        document.getElementById('shopProfileOverlay').classList.remove('show');
      },

      selectIndustry: function(el, value) {
        this.selectedIndustry = value;
        var options = document.querySelectorAll('#editIndustryOptions .shop-profile-option');
        for (var i = 0; i < options.length; i++) {
          options[i].classList.remove('selected');
        }
        el.classList.add('selected');
      },

      selectStage: function(el, value) {
        this.selectedStage = value;
        var options = document.querySelectorAll('#editStageOptions .shop-profile-option');
        for (var i = 0; i < options.length; i++) {
          options[i].classList.remove('selected');
        }
        el.classList.add('selected');
      },

      // 保存修改
      save: function() {
        if (!this.selectedIndustry) {
          BizUtils.showToast('请选择行业');
          return;
        }
        var shopName = document.getElementById('editShopName').value.trim();
        var existing = this.getProfile();
        var profile = {
          shopName: shopName,
          industry: this.selectedIndustry,
          stage: this.selectedStage,
          createdAt: existing ? existing.createdAt : new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        localStorage.setItem('biz_shop_profile', JSON.stringify(profile));
        this.close();
        // 刷新卡片显示
        ProfilePage.renderShopCard();
        BizUtils.showToast('店铺信息已更新');
      },

      // 读取店铺资料
      getProfile: function() {
        try {
          var str = localStorage.getItem('biz_shop_profile');
          return str ? JSON.parse(str) : null;
        } catch (e) {
          return null;
        }
      }
    };

    // 个人中心页面逻辑
    var ProfilePage = {
      // 收藏Tab
      favTabs: ['方案', '工具', '案例', '诊断'],
      // Tab与BizFavorite类型的映射
      favTypeMap: { '方案': 'solution', '工具': 'tool', '案例': 'case', '诊断': 'diagnosis' },
      currentFavTab: '方案',

      // 模拟最近诊断记录
      recentDiagnosis: [
        { _id: 'd1', problem: '没有客流', icon: 'user-x', date: '2026-07-24', severity: 72 },
        { _id: 'd2', problem: '利润太低', icon: 'wallet', date: '2026-07-20', severity: 58 },
        { _id: 'd3', problem: '不会做营销', icon: 'megaphone', date: '2026-07-15', severity: 85 }
      ],

      init: function() {
        BizDataService.init();
        this.checkLoginStatus();
        this.renderShopCard();
        this.renderRecords();
        this.renderFavTabs();
        this.renderFavContent();
        BizUtils.replaceIcons();
      },

      // 检查登录状态
      checkLoginStatus: function() {
        var userInfo = BizFavorite.getUserInfo();
        var userCard = document.getElementById('userCard');
        var loginGuide = document.getElementById('loginGuide');

        if (userInfo) {
          // 已登录：显示用户卡片
          userCard.style.display = '';
          loginGuide.style.display = 'none';
          document.getElementById('userPhone').textContent = userInfo.nickname || userInfo.phone;
          this.loadUserInfo();
          // 更新收藏数
          document.getElementById('favCount').textContent = BizFavorite.getCount();
        } else {
          // 未登录：显示登录引导
          userCard.style.display = 'none';
          loginGuide.style.display = '';
        }
      },

      // 加载用户信息
      loadUserInfo: function() {
        var state = BizUtils.loadDiagnosisState();
        if (state) {
          var industryEl = document.getElementById('userIndustry');
          var stageEl = document.getElementById('userStage');
          if (state.industry && industryEl) industryEl.textContent = state.industry;
          if (state.stage && stageEl) stageEl.textContent = state.stage;
        }
      },

      // 渲染店铺资料卡片
      renderShopCard: function() {
        var container = document.getElementById('shopInfoList');
        if (!container) return;
        var profile = ShopProfileEdit.getProfile();
        // 优先使用共享的商家名称（海报系统 brandname）
        var shopName = BizUtils.getSharedShopName() || (profile ? profile.shopName : '') || '';
        if (!profile && !shopName) {
          container.innerHTML = '<div class="biz-shop-empty">暂未设置店铺资料，点击「修改」进行设置</div>';
          return;
        }
        var industryIcons = { 'catering': 'utensils', 'retail': 'shopping-bag', 'service': 'scissors', '餐饮': 'utensils', '零售': 'shopping-bag', '服务业': 'scissors' };
        var industryNames = { 'catering': '餐饮', 'retail': '零售', 'service': '服务业', '餐饮': '餐饮', '零售': '零售', '服务业': '服务业' };
        var stageIcons = { 'new': 'sparkles', 'growing': 'trending-up', 'mature': 'store', '新店': 'sparkles', '成长期': 'trending-up', '老店': 'store' };
        var stageNames = { 'new': '新店', 'growing': '成长期', 'mature': '老店', '新店': '新店', '成长期': '成长期', '老店': '老店' };
        var industryIcon = industryIcons[profile.industry] ? BizUtils.icon(industryIcons[profile.industry], 16) + ' ' : '';
        var stageIcon = stageIcons[profile.stage] ? BizUtils.icon(stageIcons[profile.stage], 16) + ' ' : '';
        var html =
          '<div class="biz-shop-info-row">' +
            '<span class="biz-shop-info-label">店名</span>' +
            '<span class="biz-shop-info-value">' + (shopName || '未设置') + '</span>' +
          '</div>' +
          '<div class="biz-shop-info-row">' +
            '<span class="biz-shop-info-label">行业</span>' +
            '<span class="biz-shop-info-value">' + industryIcon + (industryNames[profile.industry] || profile.industry || '未设置') + '</span>' +
          '</div>' +
          '<div class="biz-shop-info-row">' +
            '<span class="biz-shop-info-label">经营阶段</span>' +
            '<span class="biz-shop-info-value">' + stageIcon + (stageNames[profile.stage] || profile.stage || '未设置') + '</span>' +
          '</div>';
        container.innerHTML = html;
        BizUtils.replaceIcons();
      },

      // 登出
      doLogout: function() {
        localStorage.removeItem('biz_user_info');
        BizUtils.showToast('已退出登录');
        setTimeout(function() {
          location.reload();
        }, 600);
      },

      // 渲染最近诊断记录
      renderRecords: function() {
        var container = document.getElementById('recordList');
        if (!container) return;

        if (this.recentDiagnosis.length === 0) {
          container.innerHTML = '<div class="biz-empty" style="padding:24px">' +
            '<span class="biz-empty-icon">' + BizUtils.icon('clipboard-list', 40) + '</span>' +
            '<span class="biz-empty-text">暂无诊断记录</span>' +
          '</div>';
          BizUtils.replaceIcons();
          return;
        }

        container.innerHTML = this.recentDiagnosis.map(function(r) {
          var severityColor = BizUtils.getSeverityColor(r.severity);
          return '<div class="biz-record-item" onclick="ProfilePage.viewDiagnosis(\'' + r._id + '\')">' +
            '<div class="record-icon" style="background:' + severityColor + '15;color:' + severityColor + '">' + BizUtils.icon(r.icon, 18) + '</div>' +
            '<div class="record-info">' +
              '<div class="record-title">' + r.problem + '</div>' +
              '<div class="record-date">' + r.date + ' · 严重程度 ' + r.severity + '%</div>' +
            '</div>' +
            '<span class="record-arrow">›</span>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      // 渲染收藏Tab
      renderFavTabs: function() {
        var container = document.getElementById('favTabs');
        if (!container) return;
        container.innerHTML = this.favTabs.map(function(tab) {
          var activeClass = tab === ProfilePage.currentFavTab ? ' active' : '';
          return '<span class="biz-fav-tab' + activeClass + '" onclick="ProfilePage.onFavTab(\'' + tab + '\')">' + tab + '</span>';
        }).join('');
      },

      // 渲染收藏内容
      renderFavContent: function() {
        var container = document.getElementById('favContent');
        if (!container) return;
        var favType = this.favTypeMap[this.currentFavTab] || 'solution';
        var items = BizFavorite.getByType(favType);
        var tabIcons = { '方案': 'book-open', '工具': 'wrench', '案例': 'book-open', '诊断': 'search' };
        var iconName = tabIcons[this.currentFavTab] || 'file-text';

        if (items.length === 0) {
          container.innerHTML = '<div class="biz-empty" style="padding:24px">' +
            '<span class="biz-empty-icon">' + BizUtils.icon('star', 40) + '</span>' +
            '<span class="biz-empty-text">暂无收藏</span>' +
          '</div>';
          BizUtils.replaceIcons();
          return;
        }

        container.innerHTML = items.map(function(item) {
          return '<div class="biz-fav-item">' +
            '<span class="fav-icon">' + BizUtils.icon(iconName, 18) + '</span>' +
            '<span class="fav-name">' + item.title + '</span>' +
            '<span class="fav-remove" onclick="ProfilePage.removeFav(\'' + favType + '\',\'' + item.id + '\')">取消收藏</span>' +
            '<span class="fav-arrow">›</span>' +
          '</div>';
        }).join('');
        BizUtils.replaceIcons();
      },

      // 切换收藏Tab
      onFavTab: function(tab) {
        this.currentFavTab = tab;
        this.renderFavTabs();
        this.renderFavContent();
      },

      // 查看全部诊断（后续迭代）
      viewAllDiagnosis: function() {
        BizUtils.showToast('诊断记录列表开发中');
      },

      // 查看某次诊断（后续迭代）
      viewDiagnosis: function(id) {
        BizUtils.showToast('诊断详情开发中');
      },

      // 查看收藏项（后续迭代）
      viewFav: function(id) {
        BizUtils.showToast('收藏详情开发中');
      },

      // 取消收藏
      removeFav: function(type, id) {
        BizFavorite.remove(type, id);
        BizUtils.showToast('已取消收藏');
        this.renderFavContent();
        // 更新收藏数
        var favCountEl = document.getElementById('favCount');
        if (favCountEl) favCountEl.textContent = BizFavorite.getCount();
      },

      // 打开更多页面（后续迭代）
      openPage: function(page) {
        var pageNames = {
          'agreement': '用户协议',
          'privacy': '隐私政策',
          'feedback': '意见反馈',
          'about': '关于我们'
        };
        BizUtils.showToast(pageNames[page] + '页面开发中');
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      ProfilePage.init();
    });
  </script>
</body>
</html>
