<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>方案库 - 闪喵经营诊断</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page-solutions.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <!-- 页面头部 -->
  <header class="biz-page-header" id="pageHeader">
    <div class="header-row">
      <span class="biz-back-btn" id="backBtn" onclick="SolutionsPage.goBack()"><span id="backBtnContent">← 返回</span></span>
      <h1 id="pageTitle">方案库</h1>
      <div class="biz-search-box">
        <span class="search-icon" id="searchIconHolder"></span>
        <input type="text" id="searchInput" placeholder="搜索方案或案例..." oninput="SolutionsPage.onSearch(this.value)">
      </div>
    </div>
  </header>

  <!-- 篇章导航视图 -->
  <main class="biz-page" id="chapterView">
    <div class="biz-chapter-grid" id="chapterGrid">
      <!-- JS动态渲染 -->
    </div>
  </main>

  <!-- 方案列表视图 -->
  <main class="biz-page view-hidden" id="solutionView">
    <div id="chapterHeaderWrap"></div>
    <!-- 心得滚动版块 -->
    <div id="tipsScrollerWrap" class="tips-scroller-wrap" style="display: none;">
      <div class="tips-scroller-content">
        <div class="tips-scroller-header">
          <span class="tips-scroller-icon">💡</span>
          <span class="tips-scroller-title">经营心得</span>
        </div>
        <div id="tipsScroller" class="tips-scroller">
          <!-- JS动态渲染滚动内容 -->
        </div>
        <div class="tips-scroller-more" onclick="TipsScroller.openModal()">
          <span>查看全部30条心得</span>
          <i data-lucide="chevron-down" class="biz-icon"></i>
        </div>
      </div>
    </div>
    <div class="biz-solution-list" id="solutionList">
      <!-- JS动态渲染 -->
    </div>
    <div id="caseSectionWrap"></div>
  </main>

  <!-- 心得弹窗 -->
  <div id="tipsModal" class="tips-modal" style="display: none;">
    <div class="tips-modal-backdrop" onclick="TipsScroller.closeModal()"></div>
    <div class="tips-modal-content">
      <div class="tips-modal-header">
        <h3 id="tipsModalTitle">经营心得汇总</h3>
        <span class="tips-modal-close" onclick="TipsScroller.closeModal()">×</span>
      </div>
      <div id="tipsModalList" class="tips-modal-list">
        <!-- JS动态渲染 -->
      </div>
    </div>
  </div>

  <!-- 右下角浮动按钮 -->
  <div class="sol-fab-group">
    <div class="sol-fab sol-fab-profile" onclick="window.location.href='profile.html'" title="我的收藏">
      <i data-lucide="bookmark" class="biz-icon"></i>
    </div>
    <div class="sol-fab sol-fab-tools" onclick="window.location.href='tools.html'" title="工具">
      <i data-lucide="wrench" class="biz-icon"></i>
    </div>
    <div class="sol-fab sol-fab-diagnosis" onclick="window.location.href='index.html'" title="经营诊断">
      <i data-lucide="stethoscope" class="biz-icon"></i>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="detail-modal" id="detailModal">
    <div class="detail-modal-mask" onclick="SolutionsPage.closeModal()"></div>
    <div class="detail-modal-content">
      <div class="detail-modal-header">
        <span class="detail-modal-close" onclick="SolutionsPage.closeModal()">
          <i data-lucide="x" class="biz-icon" style="width:20px;height:20px;"></i>
        </span>
        <span class="detail-modal-title" id="modalTitle">详情</span>
        <span style="width:28px;"></span>
      </div>
      <div class="detail-modal-body" id="modalBody">
        <!-- JS动态渲染 -->
      </div>
      <div class="detail-modal-footer">
        <button class="detail-modal-fav-btn" id="modalFavBtn" onclick="SolutionsPage.toggleFav()">
          <span id="modalFavIcon">☆</span>
          <span id="modalFavText">收藏</span>
        </button>
        <button class="detail-modal-btn" id="modalOpenBtn" onclick="SolutionsPage.openInNewPage()">
          在新页面查看
        </button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/biz-data.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/biz-favorite.js"></script>
  <script src="js/tips-data.js"></script>
  <script>
    // 方案库页面逻辑 - 七大篇章导航
    var SolutionsPage = {
      currentChapter: null,
      currentSub: null,
      searchText: '',
      allSolutions: [],
      chapters: [],

      init: function() {
        BizDataService.init();
        this.loadChapters();
        this.checkUrlParams();
        this.loadSolutions();
        // 初始化搜索图标
        document.getElementById('searchIconHolder').innerHTML = BizUtils.icon('search', 16);
        BizUtils.replaceIcons();
      },

      // 加载篇章数据
      loadChapters: function() {
        this.chapters = BizData.chapters || [];
      },

      // 加载方案数据
      loadSolutions: function() {
        var solutionsArr = [];
        if (Array.isArray(BizData.solutions)) {
          solutionsArr = BizData.solutions;
        } else {
          var solKeys = Object.keys(BizData.solutions || {});
          for (var i = 0; i < solKeys.length; i++) {
            solutionsArr.push(BizData.solutions[solKeys[i]]);
          }
        }
        this.allSolutions = solutionsArr;

        // 如果URL有chapter参数，直接进入篇章详情
        if (this.currentChapter) {
          this.renderChapterDetail();
        } else {
          this.renderChapterGrid();
        }
      },

      // 检查URL参数
      checkUrlParams: function() {
        var params = new URLSearchParams(window.location.search);
        var ch = params.get('chapter');
        var sub = params.get('sub');
        if (ch) {
          this.currentChapter = parseInt(ch, 10);
        }
        if (sub) {
          this.currentSub = parseInt(sub, 10);
        }
      },

      // 统计每个篇章下的方案数量
      getChapterCount: function(chapterId) {
        return this.allSolutions.filter(function(s) {
          return s.chapter === chapterId;
        }).length;
      },

      // hex颜色转rgba（用于背景透明度）
      hexToRgba: function(hex, alpha) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      },

      // ===== 篇章网格渲染 =====
      renderChapterGrid: function() {
        var self = this;
        var container = document.getElementById('chapterGrid');
        if (!container) return;

        var allCases = BizData.cases || [];

        container.innerHTML = this.chapters.map(function(ch) {
          var count = self.getChapterCount(ch.id);
          // 二级分类按钮
          var subsHtml = '';
          if (ch.subs && ch.subs.length) {
            subsHtml = '<div class="chapter-subs">' +
              ch.subs.map(function(sub) {
                var subCaseCount = allCases.filter(function(c) {
                  return c.chapter === ch.id && c.sub === sub.id;
                }).length;
                var badge = subCaseCount > 0 ? '<em class="chapter-sub-badge">' + subCaseCount + '</em>' : '';
                return '<span class="chapter-sub-tag" onclick="event.stopPropagation();SolutionsPage.onSubTagClick(' + ch.id + ',' + sub.id + ')">' + sub.name + badge + '</span>';
              }).join('') +
            '</div>';
          }
          return '<div class="biz-chapter-card" onclick="SolutionsPage.onChapterClick(' + ch.id + ')" style="--ch-color:' + ch.color + '">' +
            '<div class="chapter-header">' +
              '<span class="chapter-icon" style="color:' + ch.color + '">' + BizUtils.icon(ch.icon) + '</span>' +
              '<div class="chapter-name">' + ch.name + '</div>' +
            '</div>' +
            '<div class="chapter-desc">' + ch.desc + '</div>' +
            subsHtml +
            '<div class="chapter-count"><em>' + count + '</em> 个方案</div>' +
          '</div>';
        }).join('');

        this.showView('chapter');
        BizUtils.replaceIcons();
      },

      // ===== 篇章详情渲染 =====
      renderChapterDetail: function() {
        var self = this;
        var chapterId = this.currentChapter;

        // 查找篇章信息
        var chapter = null;
        for (var i = 0; i < this.chapters.length; i++) {
          if (this.chapters[i].id === chapterId) {
            chapter = this.chapters[i];
            break;
          }
        }
        if (!chapter) return;

        // 更新页面标题
        document.getElementById('pageTitle').textContent = chapter.name;
        document.getElementById('backBtn').classList.add('visible');
        document.getElementById('backBtnContent').innerHTML = BizUtils.icon('chevron-left', 16) + ' 返回';

        // 渲染篇章头部 + 二级分类标签
        var headerWrap = document.getElementById('chapterHeaderWrap');
        if (headerWrap) {
          var html = '<div class="biz-chapter-header">' +
            '<span class="ch-icon" style="color:' + chapter.color + '">' + BizUtils.icon(chapter.icon) + '</span>' +
            '<div class="ch-info">' +
              '<div class="ch-name">' + chapter.name + '</div>' +
              '<div class="ch-desc">' + chapter.desc + '</div>' +
            '</div>' +
          '</div>';

          // 二级分类标签导航
          if (chapter.subs && chapter.subs.length) {
            html += '<div class="biz-sub-tabs">';
            html += '<span class="biz-sub-tab' + (self.currentSub === null ? ' active' : '') + '" onclick="SolutionsPage.onSubClick(null)">全部</span>';
            for (var j = 0; j < chapter.subs.length; j++) {
              var sub = chapter.subs[j];
              var isActive = self.currentSub === sub.id;
              html += '<span class="biz-sub-tab' + (isActive ? ' active' : '') + '" onclick="SolutionsPage.onSubClick(' + sub.id + ')">' + sub.name + '</span>';
            }
            html += '</div>';
          }
          headerWrap.innerHTML = html;
        }

        // 过滤该篇章下的方案
        var filtered = this.allSolutions.filter(function(s) {
          var matchChapter = s.chapter === chapterId;
          var matchSub = !self.currentSub || s.sub === self.currentSub;
          var matchSearch = !self.searchText || (s.title + s.summary).indexOf(self.searchText) > -1;
          return matchChapter && matchSub && matchSearch;
        });

        // 渲染方案列表
        var container = document.getElementById('solutionList');
        if (!container) return;

        if (filtered.length === 0) {
          container.innerHTML = '<div class="biz-empty">' +
            '<span class="biz-empty-icon">' + BizUtils.icon('inbox', 40) + '</span>' +
            '<span class="biz-empty-text">暂无匹配方案</span>' +
          '</div>';
        } else {
          var self3 = self;
          container.innerHTML = filtered.map(function(s) {
            return self3.renderSolutionCard(s);
          }).join('');
        }

        // 清空案例区域
        var caseWrap = document.getElementById('caseSectionWrap');
        if (caseWrap) {
          caseWrap.innerHTML = '';
        }

        this.showView('solution');

        // 初始化心得滚动
        if (this.currentSub && this.currentChapter) {
          TipsScroller.init(this.currentChapter, this.currentSub);
        } else {
          var wrap = document.getElementById('tipsScrollerWrap');
          if (wrap) wrap.style.display = 'none';
          TipsScroller.stop();
        }

        // 如果有选中的二级分类，滚动标签到中间
        if (this.currentSub) {
          setTimeout(function() {
            var tabs = document.querySelector('.biz-sub-tabs');
            var activeTab = tabs ? tabs.querySelector('.biz-sub-tab.active') : null;
            if (activeTab && tabs) {
              var tabLeft = activeTab.offsetLeft;
              var tabWidth = activeTab.offsetWidth;
              var tabsWidth = tabs.clientWidth;
              var scrollLeft = tabLeft - (tabsWidth / 2) + (tabWidth / 2);
              tabs.scrollTo({ left: scrollLeft, behavior: 'smooth' });
            }
          }, 100);
        }
        BizUtils.replaceIcons();
      },

      // 点击二级分类标签
      onSubClick: function(subId) {
        this.currentSub = subId;
        this.renderChapterDetail();

        // 初始化心得滚动
        if (subId && this.currentChapter) {
          TipsScroller.init(this.currentChapter, subId);
        } else {
          // 点击"全部"时隐藏心得滚动
          var wrap = document.getElementById('tipsScrollerWrap');
          if (wrap) wrap.style.display = 'none';
          TipsScroller.stop();
        }

        BizUtils.replaceIcons();
        // 滚动被点击的标签到可视区中间
        setTimeout(function() {
          var tabs = document.querySelector('.biz-sub-tabs');
          var activeTab = tabs ? tabs.querySelector('.biz-sub-tab.active') : null;
          if (activeTab && tabs) {
            var tabLeft = activeTab.offsetLeft;
            var tabWidth = activeTab.offsetWidth;
            var tabsWidth = tabs.clientWidth;
            var scrollLeft = tabLeft - (tabsWidth / 2) + (tabWidth / 2);
            tabs.scrollTo({ left: scrollLeft, behavior: 'smooth' });
          }
        }, 50);
      },

      // 视图切换
      showView: function(view) {
        var chapterView = document.getElementById('chapterView');
        var solutionView = document.getElementById('solutionView');

        if (view === 'chapter') {
          chapterView.classList.remove('view-hidden');
          solutionView.classList.add('view-hidden');
        } else {
          chapterView.classList.add('view-hidden');
          solutionView.classList.remove('view-hidden');
        }
      },

      // 点击篇章卡片
      onChapterClick: function(chapterId) {
        this.currentChapter = chapterId;
        this.currentSub = null;
        this.searchText = '';
        document.getElementById('searchInput').value = '';
        // 更新URL参数
        var url = new URL(window.location);
        url.searchParams.set('chapter', chapterId);
        url.searchParams.delete('sub');
        window.history.pushState({}, '', url);
        this.renderChapterDetail();
        // 滚动到顶部
        window.scrollTo(0, 0);
      },

      // 点击篇章卡片上的二级分类标签
      onSubTagClick: function(chapterId, subId) {
        this.currentChapter = chapterId;
        this.currentSub = subId;
        this.searchText = '';
        document.getElementById('searchInput').value = '';
        // 更新URL参数
        var url = new URL(window.location);
        url.searchParams.set('chapter', chapterId);
        url.searchParams.set('sub', subId);
        window.history.pushState({}, '', url);
        this.renderChapterDetail();
        BizUtils.replaceIcons();
        // 滚动到顶部
        window.scrollTo(0, 0);
      },

      // 返回篇章导航
      goBack: function() {
        this.currentChapter = null;
        this.currentSub = null;
        this.searchText = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('pageTitle').textContent = '方案库';
        document.getElementById('backBtn').classList.remove('visible');
        // 清除URL参数
        var url = new URL(window.location);
        url.searchParams.delete('chapter');
        window.history.pushState({}, '', url);
        this.renderChapterGrid();
      },

      // 搜索
      onSearch: function(text) {
        this.searchText = text.trim();
        if (this.currentChapter) {
          this.renderChapterDetail();
        } else {
          // 在篇章首页搜索时，切换到全量搜索结果
          this.renderSearchResults();
        }
      },

      // 全局搜索结果（在篇章首页时搜索）
      renderSearchResults: function() {
        var self = this;
        if (!this.searchText) {
          this.renderChapterGrid();
          return;
        }

        // 同时搜索方案和案例
        var filteredSolutions = this.allSolutions.filter(function(s) {
          return (s.title + (s.summary || '')).indexOf(self.searchText) > -1;
        });

        var allCases = BizData.cases || [];
        var filteredCases = allCases.filter(function(c) {
          return (c.title + (c.problem || '') + (c.solution || '') + (c.background || '')).indexOf(self.searchText) > -1;
        });

        var container = document.getElementById('solutionList');
        if (!container) return;

        var totalCount = filteredSolutions.length + filteredCases.length;

        // 更新标题
        document.getElementById('pageTitle').textContent = '搜索结果';
        document.getElementById('backBtn').classList.add('visible');
        document.getElementById('backBtnContent').innerHTML = BizUtils.icon('chevron-left', 16) + ' 返回';

        // 清空篇章头部
        var headerWrap = document.getElementById('chapterHeaderWrap');
        if (headerWrap) {
          headerWrap.innerHTML = '<div class="biz-chapter-header">' +
            '<span class="ch-icon">' + BizUtils.icon('search') + '</span>' +
            '<div class="ch-info">' +
              '<div class="ch-name">搜索: ' + this.searchText + '</div>' +
              '<div class="ch-desc">找到 ' + filteredSolutions.length + ' 个方案和 ' + filteredCases.length + ' 个案例</div>' +
            '</div>' +
          '</div>';
        }

        if (totalCount === 0) {
          container.innerHTML = '<div class="biz-empty">' +
            '<span class="biz-empty-icon">' + BizUtils.icon('inbox', 40) + '</span>' +
            '<span class="biz-empty-text">暂无匹配结果</span>' +
          '</div>';
        } else {
          var html = '';

          // 先展示方案
          if (filteredSolutions.length > 0) {
            html += '<div class="search-section-label">方案 (' + filteredSolutions.length + ')</div>';
            html += filteredSolutions.map(function(s) {
              return self.renderSolutionCard(s);
            }).join('');
          }

          // 再展示案例
          if (filteredCases.length > 0) {
            html += '<div class="search-section-label">案例 (' + filteredCases.length + ')</div>';
            html += filteredCases.map(function(c) {
              return '<div class="biz-solution-card" onclick="SolutionsPage.openCaseModal(\'' + c._id + '\')">' +
                '<div class="card-title">' + c.title + ' <span class="card-arrow">›</span></div>' +
                '<div class="card-meta" style="display:flex;">' +
                  '<span class="biz-tag biz-tag-primary">案例</span>' +
                '</div>' +
              '</div>';
            }).join('');
          }

          container.innerHTML = html;
        }

        this.showView('solution');
        BizUtils.replaceIcons();
      },

      renderSolutionCard: function(s) {
        var self = this;
        var matchedCases = (BizData.cases || []).filter(function(c) {
          if (c.solutionId) return c.solutionId === s._id;
          return c.chapter === s.chapter && c.sub === s.sub;
        });
        var caseLinks = '';
        if (matchedCases.length > 0) {
          caseLinks = '<div class="card-case-links">' +
            matchedCases.map(function(c) {
              return '<a class="card-case-link" href="javascript:void(0)" onclick="event.stopPropagation();SolutionsPage.openCaseModal(\'' + c._id + '\')">' + c.title + '</a>';
            }).join('') +
          '</div>';
        }
        return '<div class="biz-solution-card" onclick="SolutionsPage.openSolutionModal(\'' + s._id + '\')">' +
          '<div class="card-title">' + s.title + ' <span class="card-arrow">›</span></div>' +
          caseLinks +
        '</div>';
      },

      // 获取篇章信息
      getChapterInfo: function(chapterId) {
        for (var i = 0; i < this.chapters.length; i++) {
          if (this.chapters[i].id === chapterId) {
            return this.chapters[i];
          }
        }
        return null;
      },

      // 查看方案详情
      onView: function(id) {
        this.openSolutionModal(id);
      },

      // ===== 弹窗相关 =====
      modalType: null, // 'solution' or 'case'
      modalId: null,

      openSolutionModal: function(id) {
        var sol = this.findSolution(id);
        if (!sol) return;
        this.modalType = 'solution';
        this.modalId = id;
        this.modalTitle = sol.title;
        document.getElementById('modalTitle').textContent = sol.title;
        this.renderSolutionModal(sol);
        this.updateFavState();
        document.getElementById('detailModal').classList.add('show');
        document.getElementById('modalBody').scrollTop = 0;
        document.body.style.overflow = 'hidden';
        BizUtils.replaceIcons();
      },

      openCaseModal: function(id) {
        var c = this.findCase(id);
        if (!c) return;
        this.modalType = 'case';
        this.modalId = id;
        this.modalTitle = c.title;
        document.getElementById('modalTitle').textContent = c.title;
        this.renderCaseModal(c);
        this.updateFavState();
        document.getElementById('detailModal').classList.add('show');
        document.getElementById('modalBody').scrollTop = 0;
        document.body.style.overflow = 'hidden';
        BizUtils.replaceIcons();
      },

      closeModal: function() {
        document.getElementById('detailModal').classList.remove('show');
        document.body.style.overflow = '';
        this.modalType = null;
        this.modalId = null;
        this.modalTitle = null;
      },

      updateFavState: function() {
        var isFaved = BizFavorite.isFavorited(this.modalType, this.modalId);
        var icon = document.getElementById('modalFavIcon');
        var text = document.getElementById('modalFavText');
        var btn = document.getElementById('modalFavBtn');
        if (isFaved) {
          icon.textContent = '★';
          text.textContent = '已收藏';
          btn.classList.add('faved');
        } else {
          icon.textContent = '☆';
          text.textContent = '收藏';
          btn.classList.remove('faved');
        }
      },

      toggleFav: function() {
        if (!this.modalType || !this.modalId) return;
        var isFaved = BizFavorite.isFavorited(this.modalType, this.modalId);
        if (isFaved) {
          BizFavorite.remove(this.modalType, this.modalId);
        } else {
          BizFavorite.add(this.modalType, this.modalId, this.modalTitle);
        }
        this.updateFavState();
      },

      openInNewPage: function() {
        if (this.modalType === 'solution') {
          window.location.href = 'solution-detail.html?solutionId=' + this.modalId;
        } else if (this.modalType === 'case') {
          window.location.href = 'case-detail.html?caseId=' + this.modalId;
        }
      },

      findSolution: function(id) {
        var solutions = BizData.solutions;
        if (!solutions) return null;
        if (!Array.isArray(solutions)) return solutions[id] || null;
        for (var i = 0; i < solutions.length; i++) {
          if (solutions[i]._id === id) return solutions[i];
        }
        return null;
      },

      findCase: function(id) {
        var cases = BizData.cases;
        if (!cases) return null;
        if (!Array.isArray(cases)) return cases[id] || null;
        for (var i = 0; i < cases.length; i++) {
          if (cases[i]._id === id) return cases[i];
        }
        return null;
      },

      renderSolutionModal: function(sol) {
        var body = document.getElementById('modalBody');
        var stepsHtml = '';
        if (sol.steps && sol.steps.length > 0) {
          var stepsItems = '';
          for (var i = 0; i < sol.steps.length; i++) {
            var step = sol.steps[i];
            var stepTitle = step.title || ('第' + (i + 1) + '步');
            var stepContent = step.content || '';
            stepsItems += '<div class="sd-step-item">' +
              '<div class="sd-step-num">' + (i + 1) + '</div>' +
              '<div class="sd-step-content">' +
                '<div class="sd-step-title">' + stepTitle + '</div>' +
                (stepContent ? '<div class="sd-step-desc">' + stepContent + '</div>' : '') +
              '</div>' +
            '</div>';
          }
          stepsHtml = '<section class="biz-section sd-steps">' +
            '<p class="biz-section-title">' + BizUtils.icon('list-checks', 16) + ' 执行步骤</p>' +
            '<div>' + stepsItems + '</div>' +
          '</section>';
        }

        var notesHtml = '';
        if (sol.notes && sol.notes.length > 0) {
          var notesItems = '';
          for (var j = 0; j < sol.notes.length; j++) {
            notesItems += '<li class="sd-note-item">' + sol.notes[j] + '</li>';
          }
          notesHtml = '<section class="biz-section sd-notes">' +
            '<p class="biz-section-title">' + BizUtils.icon('alert-circle', 16) + ' 注意事项</p>' +
            '<div class="sd-notes-card"><ul class="sd-notes-list">' + notesItems + '</ul></div>' +
          '</section>';
        }

        body.innerHTML =
          '<section class="biz-section">' +
            '<div class="sd-overview">' +
              (sol.summary ? '<p class="sd-overview-desc">' + sol.summary + '</p>' : '') +
              '<div class="sd-overview-meta">' +
                '<span class="sd-meta-tag">' + (sol.difficulty || '') + '</span>' +
                '<span class="sd-meta-tag">' + (sol.effectiveTime || '') + '</span>' +
                '<span class="sd-meta-tag">' + (sol.costRange || '') + '</span>' +
              '</div>' +
            '</div>' +
          '</section>' +
          stepsHtml +
          notesHtml;
      },

      renderCaseModal: function(c) {
        var body = document.getElementById('modalBody');
        var probText = c.problem || c.problemType || '';

        var problemHtml = '';
        if (probText) {
          problemHtml = '<section class="biz-section">' +
            '<p class="biz-section-title">' + BizUtils.icon('alert-triangle', 16) + ' 遇到的问题</p>' +
            '<div class="cd-problem-card"><p class="cd-problem-text">' + probText + '</p></div>' +
          '</section>';
        }

        var solText = c.solution || c.background || '';
        var solutionHtml = '';
        if (solText) {
          var sentences = solText.split('。').filter(function(s) { return s.trim().length > 0; });
          var paras = '';
          for (var i = 0; i < sentences.length; i++) {
            paras += '<p class="cd-solution-para">' + sentences[i].trim() + '。</p>';
          }
          var title = c.solution ? '解决方案' : '案例背景';
          var icon = c.solution ? 'lightbulb' : 'file-text';
          solutionHtml = '<section class="biz-section">' +
            '<p class="biz-section-title">' + BizUtils.icon(icon, 16) + ' ' + title + '</p>' +
            '<div class="cd-solution-detail-card">' + paras + '</div>' +
          '</section>';
        }

        var stepsHtml = '';
        if (c.steps && c.steps.length > 0) {
          var stepsItems = '';
          for (var j = 0; j < c.steps.length; j++) {
            stepsItems += '<div class="cd-step-item">' +
              '<div class="cd-step-num">' + (j + 1) + '</div>' +
              '<div class="cd-step-text">' + c.steps[j] + '</div>' +
            '</div>';
          }
          stepsHtml = '<section class="biz-section">' +
            '<p class="biz-section-title">' + BizUtils.icon('list-checks', 16) + ' 操作步骤</p>' +
            '<div class="cd-steps-card">' + stepsItems + '</div>' +
          '</section>';
        }

        var points = c.keyPoints || c.keyLessons || [];
        var kpHtml = '';
        if (points.length > 0) {
          var kpItems = '';
          for (var k = 0; k < points.length; k++) {
            kpItems += '<li class="cd-kp-item">' +
              '<span class="cd-kp-dot"></span>' +
              '<span class="cd-kp-text">' + points[k] + '</span>' +
            '</li>';
          }
          kpHtml = '<section class="biz-section">' +
            '<p class="biz-section-title">' + BizUtils.icon('star', 16) + ' 关键要点</p>' +
            '<div class="cd-kp-card"><ul class="cd-kp-list">' + kpItems + '</ul></div>' +
          '</section>';
        }

        body.innerHTML =
          '<section class="biz-section">' +
            '<div class="cd-overview">' +
              '<div class="cd-effect-box">' +
                '<div class="cd-effect-label">' + BizUtils.icon('trending-up', 14) + ' 实际效果</div>' +
                '<div class="cd-effect-value">' + (c.effectData || '效果显著') + '</div>' +
              '</div>' +
            '</div>' +
          '</section>' +
          problemHtml +
          solutionHtml +
          stepsHtml +
          kpHtml;
      },
    };

    // 处理浏览器后退
    window.addEventListener('popstate', function() {
      var params = new URLSearchParams(window.location.search);
      var ch = params.get('chapter');
      if (ch) {
        SolutionsPage.currentChapter = parseInt(ch, 10);
        SolutionsPage.renderChapterDetail();
      } else {
        SolutionsPage.currentChapter = null;
        SolutionsPage.currentSub = null;
        SolutionsPage.searchText = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('pageTitle').textContent = '方案库';
          document.getElementById('backBtn').classList.remove('visible');
        SolutionsPage.renderChapterGrid();
      }
    });

    // ===== 心得滚动模块 =====
    var TipsScroller = {
      currentTips: [],
      currentIndex: 0,
      timer: null,
      currentSubId: null,

      // 初始化心得滚动
      init: function(chapterId, subId) {
        console.log('[TipsScroller] init called, chapterId:', chapterId, 'subId:', subId);
        var key = chapterId + '_' + subId;
        console.log('[TipsScroller] looking for key:', key);
        var tips = window.BizTipsData ? BizTipsData[key] : null;
        console.log('[TipsScroller] BizTipsData exists:', !!window.BizTipsData);
        console.log('[TipsScroller] tips found:', tips ? tips.length : 0);

        this.currentSubId = subId;
        this.currentTips = tips || [];
        this.currentIndex = 0;

        var wrap = document.getElementById('tipsScrollerWrap');
        console.log('[TipsScroller] wrap element:', wrap);
        if (!wrap) return;

        if (this.currentTips.length === 0) {
          console.log('[TipsScroller] no tips, hiding wrap');
          wrap.style.display = 'none';
          this.stop();
          return;
        }

        console.log('[TipsScroller] showing wrap with', this.currentTips.length, 'tips');
        wrap.style.display = 'block';
        this.render();
        this.start();
      },

      // 渲染当前显示的心得
      render: function() {
        var container = document.getElementById('tipsScroller');
        if (!container || this.currentTips.length === 0) return;

        var tip = this.currentTips[this.currentIndex];
        container.innerHTML = '<div class="tips-scroller-item">' +
          '<span class="tips-scroller-item-num">' + (this.currentIndex + 1) + '.</span>' +
          '<div class="tips-scroller-item-content">' +
            '<div class="tips-scroller-item-title">' + tip.title + '</div>' +
            '<div class="tips-scroller-item-desc">' + tip.content + '</div>' +
          '</div>' +
        '</div>';
      },

      // 开始自动滚动
      start: function() {
        this.stop();
        if (this.currentTips.length <= 1) return;

        var self = this;
        this.timer = setInterval(function() {
          self.currentIndex = (self.currentIndex + 1) % self.currentTips.length;
          self.render();
        }, 4000); // 每4秒切换一条
      },

      // 停止滚动
      stop: function() {
        if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
        }
      },

      // 打开弹窗
      openModal: function() {
        this.stop();

        // 查找二级分类名称
        var subName = '';
        var chapter = SolutionsPage.chapters.find(function(ch) { return ch.id === SolutionsPage.currentChapter; });
        if (chapter && chapter.subs) {
          var sub = chapter.subs.find(function(s) { return s.id === SolutionsPage.currentSub; });
          if (sub) subName = sub.name;
        }

        document.getElementById('tipsModalTitle').textContent = (subName || '经营') + '心得汇总';

        // 渲染全部30条心得
        var listContainer = document.getElementById('tipsModalList');
        if (listContainer && this.currentTips.length > 0) {
          var html = this.currentTips.map(function(tip, idx) {
            return '<div class="tips-modal-item">' +
              '<span class="tips-modal-item-num">' + (idx + 1) + '.</span>' +
              '<div class="tips-modal-item-content">' +
                '<div class="tips-modal-item-title">' + tip.title + '</div>' +
                '<div class="tips-modal-item-desc">' + tip.content + '</div>' +
              '</div>' +
            '</div>';
          }).join('');
          listContainer.innerHTML = html;
        }

        document.getElementById('tipsModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
      },

      // 关闭弹窗
      closeModal: function() {
        document.getElementById('tipsModal').style.display = 'none';
        document.body.style.overflow = '';
        // 关闭后重新开始滚动
        this.start();
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      SolutionsPage.init();
    });
  </script>
</body>
</html>
