<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>方案库 - 闪喵经营诊断</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page-solutions.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <!-- 页面头部 -->
  <header class="biz-page-header" id="pageHeader">
    <div class="header-row">
      <span class="biz-back-btn" id="backBtn" onclick="SolutionsPage.goBack()"><span id="backBtnContent">← 返回</span></span>
      <h1 id="pageTitle">方案库</h1>
      <div class="biz-search-box">
        <span class="search-icon" id="searchIconHolder"></span>
        <input type="text" id="searchInput" placeholder="搜索方案..." oninput="SolutionsPage.onSearch(this.value)">
      </div>
    </div>
  </header>

  <!-- 篇章导航视图 -->
  <main class="biz-page" id="chapterView">
    <div class="biz-chapter-grid" id="chapterGrid">
      <!-- JS动态渲染 -->
    </div>
  </main>

  <!-- 方案列表视图 -->
  <main class="biz-page view-hidden" id="solutionView">
    <div id="chapterHeaderWrap"></div>
    <div class="biz-solution-list" id="solutionList">
      <!-- JS动态渲染 -->
    </div>
    <div id="caseSectionWrap"></div>
  </main>

  <!-- 右下角浮动按钮 -->
  <div class="sol-fab-group">
    <div class="sol-fab sol-fab-profile" onclick="window.location.href='profile.html'" title="我的收藏">
      <i data-lucide="bookmark" class="biz-icon" style="width:20px;height:20px;"></i>
    </div>
    <div class="sol-fab sol-fab-tools" onclick="window.location.href='tools.html'" title="工具">
      <i data-lucide="wrench" class="biz-icon" style="width:20px;height:20px;"></i>
    </div>
    <div class="sol-fab sol-fab-diagnosis" onclick="window.location.href='index.html'" title="经营诊断">
      <i data-lucide="stethoscope" class="biz-icon" style="width:22px;height:22px;"></i>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/biz-data.js"></script>
  <script src="js/data-service.js"></script>
  <script>
    // 方案库页面逻辑 - 八大篇章导航
    var SolutionsPage = {
      currentChapter: null,
      currentSub: null,
      searchText: '',
      allSolutions: [],
      chapters: [],

      init: function() {
        BizDataService.init();
        this.loadChapters();
        this.checkUrlParams();
        this.loadSolutions();
        // 初始化搜索图标
        document.getElementById('searchIconHolder').innerHTML = BizUtils.icon('search', 16);
        BizUtils.replaceIcons();
      },

      // 加载篇章数据
      loadChapters: function() {
        this.chapters = BizData.chapters || [];
      },

      // 加载方案数据
      loadSolutions: function() {
        var solutionsArr = [];
        if (Array.isArray(BizData.solutions)) {
          solutionsArr = BizData.solutions;
        } else {
          var solKeys = Object.keys(BizData.solutions || {});
          for (var i = 0; i < solKeys.length; i++) {
            solutionsArr.push(BizData.solutions[solKeys[i]]);
          }
        }
        this.allSolutions = solutionsArr;

        // 如果URL有chapter参数，直接进入篇章详情
        if (this.currentChapter) {
          this.renderChapterDetail();
        } else {
          this.renderChapterGrid();
        }
      },

      // 检查URL参数
      checkUrlParams: function() {
        var params = new URLSearchParams(window.location.search);
        var ch = params.get('chapter');
        var sub = params.get('sub');
        if (ch) {
          this.currentChapter = parseInt(ch, 10);
        }
        if (sub) {
          this.currentSub = parseInt(sub, 10);
        }
      },

      // 统计每个篇章下的方案数量
      getChapterCount: function(chapterId) {
        return this.allSolutions.filter(function(s) {
          return s.chapter === chapterId;
        }).length;
      },

      // hex颜色转rgba（用于背景透明度）
      hexToRgba: function(hex, alpha) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      },

      // ===== 篇章网格渲染 =====
      renderChapterGrid: function() {
        var self = this;
        var container = document.getElementById('chapterGrid');
        if (!container) return;

        container.innerHTML = this.chapters.map(function(ch) {
          var count = self.getChapterCount(ch.id);
          // 二级分类按钮
          var subsHtml = '';
          if (ch.subs && ch.subs.length) {
            subsHtml = '<div class="chapter-subs">' +
              ch.subs.map(function(sub) {
                return '<span class="chapter-sub-tag" onclick="event.stopPropagation();SolutionsPage.onSubTagClick(' + ch.id + ',' + sub.id + ')">' + sub.name + '</span>';
              }).join('') +
            '</div>';
          }
          return '<div class="biz-chapter-card" onclick="SolutionsPage.onChapterClick(' + ch.id + ')" style="--ch-color:' + ch.color + '">' +
            '<div class="chapter-header">' +
              '<span class="chapter-icon" style="color:' + ch.color + '">' + BizUtils.icon(ch.icon, 22) + '</span>' +
              '<div class="chapter-name">' + ch.name + '</div>' +
            '</div>' +
            '<div class="chapter-desc">' + ch.desc + '</div>' +
            subsHtml +
            '<div class="chapter-count"><em>' + count + '</em> 个方案</div>' +
          '</div>';
        }).join('');

        this.showView('chapter');
        BizUtils.replaceIcons();
      },

      // ===== 篇章详情渲染 =====
      renderChapterDetail: function() {
        var self = this;
        var chapterId = this.currentChapter;

        // 查找篇章信息
        var chapter = null;
        for (var i = 0; i < this.chapters.length; i++) {
          if (this.chapters[i].id === chapterId) {
            chapter = this.chapters[i];
            break;
          }
        }
        if (!chapter) return;

        // 更新页面标题
        document.getElementById('pageTitle').textContent = chapter.name;
        document.getElementById('backBtn').classList.add('visible');
        document.getElementById('backBtnContent').innerHTML = BizUtils.icon('chevron-left', 16) + ' 返回';

        // 渲染篇章头部 + 二级分类标签
        var headerWrap = document.getElementById('chapterHeaderWrap');
        if (headerWrap) {
          var html = '<div class="biz-chapter-header">' +
            '<span class="ch-icon" style="color:' + chapter.color + '">' + BizUtils.icon(chapter.icon, 28) + '</span>' +
            '<div class="ch-info">' +
              '<div class="ch-name">' + chapter.name + '</div>' +
              '<div class="ch-desc">' + chapter.desc + '</div>' +
            '</div>' +
          '</div>';

          // 二级分类标签导航
          if (chapter.subs && chapter.subs.length) {
            html += '<div class="biz-sub-tabs">';
            html += '<span class="biz-sub-tab' + (self.currentSub === null ? ' active' : '') + '" onclick="SolutionsPage.onSubClick(null)">全部</span>';
            for (var j = 0; j < chapter.subs.length; j++) {
              var sub = chapter.subs[j];
              var isActive = self.currentSub === sub.id;
              html += '<span class="biz-sub-tab' + (isActive ? ' active' : '') + '" onclick="SolutionsPage.onSubClick(' + sub.id + ')">' + sub.name + '</span>';
            }
            html += '</div>';
          }
          headerWrap.innerHTML = html;
        }

        // 过滤该篇章下的方案
        var filtered = this.allSolutions.filter(function(s) {
          var matchChapter = s.chapter === chapterId;
          var matchSub = !self.currentSub || s.sub === self.currentSub;
          var matchSearch = !self.searchText || (s.title + s.summary).indexOf(self.searchText) > -1;
          return matchChapter && matchSub && matchSearch;
        });

        // 渲染方案列表
        var container = document.getElementById('solutionList');
        if (!container) return;

        if (filtered.length === 0) {
          container.innerHTML = '<div class="biz-empty">' +
            '<span class="biz-empty-icon">' + BizUtils.icon('inbox', 40) + '</span>' +
            '<span class="biz-empty-text">暂无匹配方案</span>' +
          '</div>';
        } else {
          var allCases = BizData.cases || [];
          container.innerHTML = filtered.map(function(s) {
            var diffClass = s.difficulty === '简单' ? 'biz-tag biz-tag-primary' : 'biz-tag biz-tag-accent';
            var caseCount = allCases.filter(function(c) {
              var matchChapter = c.chapter === s.chapter;
              var matchSub = !s.sub || c.sub === s.sub;
              return matchChapter && matchSub;
            }).length;
            var caseTag = caseCount > 0 ? '<span class="biz-tag">' + BizUtils.icon('book-open', 12) + ' ' + caseCount + '个案例</span>' : '';
            return '<div class="biz-solution-card" onclick="SolutionsPage.onView(\'' + s._id + '\')">' +
              '<div class="card-title">' + s.title + '</div>' +
              '<div class="card-meta">' +
                '<span class="' + diffClass + '">' + s.difficulty + '</span>' +
                '<span class="biz-tag">' + BizUtils.icon('clock', 12) + ' ' + s.effectiveTime + '</span>' +
                '<span class="biz-tag">' + BizUtils.icon('coins', 12) + ' ' + s.costRange + '</span>' +
                caseTag +
              '</div>' +
            '</div>';
          }).join('');
        }

        // 清空案例区域
        var caseWrap = document.getElementById('caseSectionWrap');
        if (caseWrap) {
          caseWrap.innerHTML = '';
        }

        this.showView('solution');

        // 如果有选中的二级分类，滚动标签到中间
        if (this.currentSub) {
          setTimeout(function() {
            var tabs = document.querySelector('.biz-sub-tabs');
            var activeTab = tabs ? tabs.querySelector('.biz-sub-tab.active') : null;
            if (activeTab && tabs) {
              var tabLeft = activeTab.offsetLeft;
              var tabWidth = activeTab.offsetWidth;
              var tabsWidth = tabs.clientWidth;
              var scrollLeft = tabLeft - (tabsWidth / 2) + (tabWidth / 2);
              tabs.scrollTo({ left: scrollLeft, behavior: 'smooth' });
            }
          }, 100);
        }
        BizUtils.replaceIcons();
      },

      // 点击二级分类标签
      onSubClick: function(subId) {
        this.currentSub = subId;
        this.renderChapterDetail();
        BizUtils.replaceIcons();
        // 滚动被点击的标签到可视区中间
        setTimeout(function() {
          var tabs = document.querySelector('.biz-sub-tabs');
          var activeTab = tabs ? tabs.querySelector('.biz-sub-tab.active') : null;
          if (activeTab && tabs) {
            var tabLeft = activeTab.offsetLeft;
            var tabWidth = activeTab.offsetWidth;
            var tabsWidth = tabs.clientWidth;
            var scrollLeft = tabLeft - (tabsWidth / 2) + (tabWidth / 2);
            tabs.scrollTo({ left: scrollLeft, behavior: 'smooth' });
          }
        }, 50);
      },

      // 视图切换
      showView: function(view) {
        var chapterView = document.getElementById('chapterView');
        var solutionView = document.getElementById('solutionView');

        if (view === 'chapter') {
          chapterView.classList.remove('view-hidden');
          solutionView.classList.add('view-hidden');
        } else {
          chapterView.classList.add('view-hidden');
          solutionView.classList.remove('view-hidden');
        }
      },

      // 点击篇章卡片
      onChapterClick: function(chapterId) {
        this.currentChapter = chapterId;
        this.currentSub = null;
        this.searchText = '';
        document.getElementById('searchInput').value = '';
        // 更新URL参数
        var url = new URL(window.location);
        url.searchParams.set('chapter', chapterId);
        url.searchParams.delete('sub');
        window.history.pushState({}, '', url);
        this.renderChapterDetail();
        // 滚动到顶部
        window.scrollTo(0, 0);
      },

      // 点击篇章卡片上的二级分类标签
      onSubTagClick: function(chapterId, subId) {
        this.currentChapter = chapterId;
        this.currentSub = subId;
        this.searchText = '';
        document.getElementById('searchInput').value = '';
        // 更新URL参数
        var url = new URL(window.location);
        url.searchParams.set('chapter', chapterId);
        url.searchParams.set('sub', subId);
        window.history.pushState({}, '', url);
        this.renderChapterDetail();
        BizUtils.replaceIcons();
        // 滚动到顶部
        window.scrollTo(0, 0);
      },

      // 返回篇章导航
      goBack: function() {
        this.currentChapter = null;
        this.currentSub = null;
        this.searchText = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('pageTitle').textContent = '方案库';
        document.getElementById('backBtn').classList.remove('visible');
        // 清除URL参数
        var url = new URL(window.location);
        url.searchParams.delete('chapter');
        window.history.pushState({}, '', url);
        this.renderChapterGrid();
      },

      // 搜索
      onSearch: function(text) {
        this.searchText = text.trim();
        if (this.currentChapter) {
          this.renderChapterDetail();
        } else {
          // 在篇章首页搜索时，切换到全量搜索结果
          this.renderSearchResults();
        }
      },

      // 全局搜索结果（在篇章首页时搜索）
      renderSearchResults: function() {
        var self = this;
        if (!this.searchText) {
          this.renderChapterGrid();
          return;
        }

        var filtered = this.allSolutions.filter(function(s) {
          return (s.title + s.summary).indexOf(self.searchText) > -1;
        });

        var container = document.getElementById('solutionList');
        if (!container) return;

        // 更新标题
        document.getElementById('pageTitle').textContent = '搜索结果';
        document.getElementById('backBtn').classList.add('visible');
        document.getElementById('backBtnContent').innerHTML = BizUtils.icon('chevron-left', 16) + ' 返回';

        // 清空篇章头部
        var headerWrap = document.getElementById('chapterHeaderWrap');
        if (headerWrap) {
          headerWrap.innerHTML = '<div class="biz-chapter-header">' +
            '<span class="ch-icon">' + BizUtils.icon('search', 28) + '</span>' +
            '<div class="ch-info">' +
              '<div class="ch-name">搜索: ' + this.searchText + '</div>' +
              '<div class="ch-desc">找到 ' + filtered.length + ' 个相关方案</div>' +
            '</div>' +
          '</div>';
        }

        if (filtered.length === 0) {
          container.innerHTML = '<div class="biz-empty">' +
            '<span class="biz-empty-icon">' + BizUtils.icon('inbox', 40) + '</span>' +
            '<span class="biz-empty-text">暂无匹配方案</span>' +
          '</div>';
        } else {
          container.innerHTML = filtered.map(function(s) {
            var diffClass = s.difficulty === '简单' ? 'biz-tag biz-tag-primary' : 'biz-tag biz-tag-accent';
            // 找到篇章信息
            var chInfo = self.getChapterInfo(s.chapter);
            return '<div class="biz-solution-card" onclick="SolutionsPage.onView(\'' + s._id + '\')">' +
              '<div class="card-title">' + s.title + '</div>' +
              '<div class="card-meta">' +
                '<span class="biz-tag" style="background:' + (chInfo ? self.hexToRgba(chInfo.color, 0.12) : 'var(--biz-primary-light)') + ';color:' + (chInfo ? chInfo.color : 'var(--biz-primary)') + '">' + (chInfo ? BizUtils.icon(chInfo.icon, 12) + ' ' + chInfo.name : '') + '</span>' +
                '<span class="' + diffClass + '">' + s.difficulty + '</span>' +
                '<span class="biz-tag">' + BizUtils.icon('clock', 12) + ' ' + s.effectiveTime + '</span>' +
              '</div>' +
            '</div>';
          }).join('');
        }

        this.showView('solution');
        BizUtils.replaceIcons();
      },

      // 获取篇章信息
      getChapterInfo: function(chapterId) {
        for (var i = 0; i < this.chapters.length; i++) {
          if (this.chapters[i].id === chapterId) {
            return this.chapters[i];
          }
        }
        return null;
      },

      // 查看方案详情
      onView: function(id) {
        window.location.href = 'solution-detail.html?solutionId=' + id;
      }
    };

    // 处理浏览器后退
    window.addEventListener('popstate', function() {
      var params = new URLSearchParams(window.location.search);
      var ch = params.get('chapter');
      if (ch) {
        SolutionsPage.currentChapter = parseInt(ch, 10);
        SolutionsPage.renderChapterDetail();
      } else {
        SolutionsPage.currentChapter = null;
        SolutionsPage.currentSub = null;
        SolutionsPage.searchText = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('pageTitle').textContent = '方案库';
          document.getElementById('backBtn').classList.remove('visible');
        SolutionsPage.renderChapterGrid();
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      SolutionsPage.init();
    });
  </script>
</body>
</html>
