<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>案例详情 - 闪喵经营诊断</title>
  <meta name="description" content="查看真实案例的详细背景、解决方案和操作步骤。">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/page-case-detail.css">
</head>
<body>
  <header class="cd-topbar">
    <div class="cd-topbar-left">
      <span class="cd-topbar-back" onclick="history.back()">←</span>
      <span class="cd-topbar-title">案例详情</span>
    </div>
  </header>

  <main class="biz-page">
    <section class="biz-section" id="overviewSection"></section>
    <section class="biz-section" id="problemSection"></section>
    <section class="biz-section" id="solutionSection"></section>
    <section class="biz-section" id="stepsSection"></section>
    <section class="biz-section" id="keypointsSection"></section>
    <div class="cd-bottom-space"></div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/biz-data.js"></script>
  <script src="js/data-service.js"></script>
  <script>
  var CDPage = {
    caseData: null,
    caseId: null,
    problemMap: {},
    problemNameToCode: {},

    industryIcons: {
      '餐饮': 'flame', '家居办公': 'store', '水果生鲜': 'shopping-bag',
      '奶茶茶饮': 'coffee', '烧烤烤串': 'flame', '烘焙蛋糕': 'gift',
      '美容美甲': 'scissors', '早餐店': 'coffee', '快餐简餐': 'clipboard-list',
      '其他': 'building'
    },

    init: function() {
      BizDataService.init();
      this.buildProblemMap();
      this.caseId = BizUtils.getParam('caseId');
      this.loadCase();
    },

    buildProblemMap: function() {
      var problems = BizData.problems || [];
      for (var i = 0; i < problems.length; i++) {
        this.problemMap[problems[i].code] = problems[i];
        this.problemNameToCode[problems[i].name] = problems[i].code;
      }
    },

    findCase: function(id) {
      var cases = BizData.cases;
      if (!cases) return null;
      if (!Array.isArray(cases)) return cases[id] || null;
      for (var i = 0; i < cases.length; i++) {
        if (cases[i]._id === id) return cases[i];
      }
      return null;
    },

    loadCase: function() {
      if (!this.caseId) { this.showEmpty('缺少案例ID参数'); return; }
      this.caseData = this.findCase(this.caseId);
      if (!this.caseData) { this.showEmpty('未找到该案例'); return; }
      this.renderAll();
    },

    showEmpty: function(msg) {
      var main = document.querySelector('.biz-page');
      main.innerHTML = '<div class="biz-empty">' +
        '<span class="biz-empty-icon">' + BizUtils.icon('inbox', 40) + '</span>' +
        '<span class="biz-empty-text">' + (msg || '暂无数据') + '</span></div>';
    },

    renderAll: function() {
      this.renderOverview();
      this.renderProblem();
      this.renderSolution();
      this.renderSteps();
      this.renderKeyPoints();
      BizUtils.replaceIcons();
    },

    renderOverview: function() {
      var c = this.caseData;
      var indIcon = this.industryIcons[c.industry] || 'store';

      var probTag = '';
      var probText = c.problem || c.problemType;
      if (probText) {
        probTag = '<span class="biz-tag biz-tag-accent" style="background:rgba(0,113,227,0.06);color:#0071E3">' +
          BizUtils.icon('alert-circle', 12) + ' ' + probText + '</span>';
      }

      document.getElementById('overviewSection').innerHTML =
        '<div class="cd-overview">' +
          '<h1 class="cd-overview-title">' + c.title + '</h1>' +
          '<div class="cd-overview-tags">' +
            '<span class="biz-tag biz-tag-primary">' + BizUtils.icon(indIcon, 12) + ' ' + c.industry + '</span>' +
            probTag +
          '</div>' +
          '<div class="cd-effect-box">' +
            '<div class="cd-effect-label">' + BizUtils.icon('trending-up', 14) + ' 实际效果</div>' +
            '<div class="cd-effect-value">' + (c.effectData || '效果显著') + '</div>' +
          '</div>' +
        '</div>';
    },

    renderProblem: function() {
      var c = this.caseData;
      var probText = c.problem || c.problemType;
      if (!probText) return;

      document.getElementById('problemSection').innerHTML =
        '<p class="biz-section-title">' + BizUtils.icon('alert-triangle', 16) + ' 遇到的问题</p>' +
        '<div class="cd-problem-card">' +
          '<p class="cd-problem-text">' + probText + '</p>' +
        '</div>';
    },

    renderSolution: function() {
      var c = this.caseData;
      var solText = c.solution || c.background;
      if (!solText) return;

      var sentences = solText.split('。').filter(function(s) {
        return s.trim().length > 0;
      });

      var paragraphs = '';
      for (var i = 0; i < sentences.length; i++) {
        paragraphs += '<p class="cd-solution-para">' + sentences[i].trim() + '。</p>';
      }

      var title = c.solution ? '解决方案' : '案例背景';
      var icon = c.solution ? 'lightbulb' : 'file-text';

      document.getElementById('solutionSection').innerHTML =
        '<p class="biz-section-title">' + BizUtils.icon(icon, 16) + ' ' + title + '</p>' +
        '<div class="cd-solution-detail-card">' + paragraphs + '</div>';
    },

    renderSteps: function() {
      var c = this.caseData;
      var steps = c.steps || [];
      if (steps.length === 0) return;

      var items = '';
      for (var i = 0; i < steps.length; i++) {
        items += '<div class="cd-step-item">' +
          '<div class="cd-step-num">' + (i + 1) + '</div>' +
          '<div class="cd-step-text">' + steps[i] + '</div>' +
        '</div>';
      }

      document.getElementById('stepsSection').innerHTML =
        '<p class="biz-section-title">' + BizUtils.icon('list-checks', 16) + ' 操作步骤</p>' +
        '<div class="cd-steps-card">' + items + '</div>';
    },

    renderKeyPoints: function() {
      var c = this.caseData;
      var points = c.keyPoints || c.keyLessons || [];
      if (points.length === 0) return;

      var items = '';
      for (var i = 0; i < points.length; i++) {
        items += '<li class="cd-kp-item">' +
          '<span class="cd-kp-dot"></span>' +
          '<span class="cd-kp-text">' + points[i] + '</span>' +
        '</li>';
      }

      document.getElementById('keypointsSection').innerHTML =
        '<p class="biz-section-title">' + BizUtils.icon('star', 16) + ' 关键要点</p>' +
        '<div class="cd-kp-card"><ul class="cd-kp-list">' + items + '</ul></div>';
    },

    renderRelatedSolutions: function() {
      var c = this.caseData;
      var solutions = this.findRelatedSolutions(c);

      if (solutions.length === 0) return;

      var diffColors = { '简单': '#0071E3', '中等': '#0071E3', '困难': '#0071E3', '较难': '#0071E3' };

      var html = '<p class="biz-section-title">' + BizUtils.icon('link', 16) + ' 相关解决方案</p>';
      for (var i = 0; i < solutions.length; i++) {
        var s = solutions[i];
        var diffColor = diffColors[s.difficulty] || '#6B7280';
        html += '<div class="cd-solution-card" onclick="window.location.href=\'solution-detail.html?solutionId=' + s._id + '\'">' +
          '<h3 class="cd-solution-title">' + s.title + '</h3>' +
          '<p class="cd-solution-summary">' + s.summary + '</p>' +
          '<div class="cd-solution-meta">' +
            '<span class="biz-tag" style="background:' + diffColor + '1A;color:' + diffColor + '">' + BizUtils.icon('target', 12) + ' ' + s.difficulty + '</span>' +
            '<span class="biz-tag">' + BizUtils.icon('clock', 12) + ' ' + s.effectiveTime + '</span>' +
            '<span class="biz-tag">' + BizUtils.icon('coins', 12) + ' ' + s.costRange + '</span>' +
          '</div>' +
        '</div>';
      }

      document.getElementById('solutionsSection').innerHTML = html;
    },

    findRelatedSolutions: function(caseData) {
      var solutions = BizData.solutions;
      if (!solutions) return [];
      var arr = Array.isArray(solutions) ? solutions : Object.values(solutions);
      var result = [];

      var keywords = [];
      if (caseData.industry) keywords.push(caseData.industry);
      if (caseData.problem) {
        var parts = caseData.problem.split(/[、,，\s]+/);
        for (var i = 0; i < parts.length && keywords.length < 5; i++) {
          if (parts[i].length >= 2) keywords.push(parts[i]);
        }
      }

      for (var i = 0; i < arr.length && result.length < 3; i++) {
        var s = arr[i];
        var matched = false;
        var codes = s.problemCodes || [];
        for (var j = 0; j < codes.length; j++) {
          if (keywords.indexOf(codes[j]) >= 0 || this.problemMap[codes[j]]) {
            matched = true; break;
          }
        }
        if (matched) result.push(s);
      }

      if (result.length === 0 && arr.length > 0) {
        result = arr.slice(0, 3);
      }
      return result;
    }
  };

  document.addEventListener('DOMContentLoaded', function() {
    CDPage.init();
    BizUtils.replaceIcons();
  });
  </script>
</body>
</html>
