<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>闪喵经营诊断 - 经营诊断</title>
  <meta name="description" content="4步完成你的门店经营诊断，找到问题根源。">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page-diagnosis.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="diagnosis-header">
    <span class="diagnosis-back" id="btnBack" onclick="DiagnosisPage.goBack()"></span>
    <span class="diagnosis-title">经营诊断</span>
  </header>

  <!-- 步骤条 -->
  <div class="biz-steps" id="stepsBar">
    <!-- JS动态渲染 -->
  </div>

  <!-- 步骤内容 -->
  <div class="diagnosis-body">
    <!-- 步骤：选择行业 -->
    <div class="step-panel" id="step2"></div>

    <!-- 步骤：选择阶段 -->
    <div class="step-panel" id="step3"></div>

    <!-- 步骤：选择症状 -->
    <div class="step-panel" id="step4"></div>
  </div>

  <!-- 底部操作栏 -->
  <div class="diagnosis-footer" id="footerBar">
    <button class="biz-btn biz-btn-ghost" id="btnPrev" onclick="DiagnosisPage.goPrev()" style="display:none;">上一步</button>
    <button class="biz-btn biz-btn-primary" id="btnNext" onclick="DiagnosisPage.goNext()">下一步</button>
  </div>

  <!-- 过渡动画遮罩 -->
  <div class="diagnosis-overlay" id="diagnosisOverlay">
    <div class="diagnosis-progress-ring">
      <svg viewBox="0 0 80 80">
        <defs>
          <linearGradient id="gradientRing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0071E3" />
            <stop offset="100%" style="stop-color:#0071E3" />
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="40" cy="40" r="36"></circle>
        <circle class="ring-fill" id="progressRing" cx="40" cy="40" r="36"></circle>
      </svg>
      <span class="diagnosis-check-icon" id="checkIcon"></span>
    </div>
    <p class="diagnosis-overlay-text" id="overlayText">正在分析...</p>
    <p class="diagnosis-overlay-sub" id="overlaySub">综合问题类型、行业特征和经营阶段<br>为你生成专属诊断报告</p>
  </div>

  <!-- 店铺资料编辑弹窗 -->
  <div class="shop-profile-overlay" id="shopProfileOverlay">
    <div class="shop-profile-card">
      <div class="shop-profile-title">修改店铺信息</div>
      <div class="shop-profile-subtitle">修改后，诊断将自动匹配新信息</div>

      <div class="shop-profile-label">店名（选填）</div>
      <input type="text" class="shop-profile-input" id="editShopName" placeholder="比如：张姐火锅店" maxlength="20">

      <div class="shop-profile-label">你的行业</div>
      <div class="shop-profile-options" id="editIndustryOptions">
        <div class="shop-profile-option" data-value="餐饮" onclick="DiagnosisShopEdit.selectIndustry(this, '餐饮')">
          <span class="opt-icon"><i data-lucide="utensils" class="biz-icon" style="width:24px;height:24px;"></i></span>
          <span class="opt-name">餐饮</span>
        </div>
        <div class="shop-profile-option" data-value="零售" onclick="DiagnosisShopEdit.selectIndustry(this, '零售')">
          <span class="opt-icon"><i data-lucide="shopping-bag" class="biz-icon" style="width:24px;height:24px;"></i></span>
          <span class="opt-name">零售</span>
        </div>
        <div class="shop-profile-option" data-value="服务业" onclick="DiagnosisShopEdit.selectIndustry(this, '服务业')">
          <span class="opt-icon"><i data-lucide="scissors" class="biz-icon" style="width:24px;height:24px;"></i></span>
          <span class="opt-name">服务业</span>
        </div>
      </div>

      <div class="shop-profile-label">经营阶段</div>
      <div class="shop-profile-options" id="editStageOptions">
        <div class="shop-profile-option" data-value="新店" onclick="DiagnosisShopEdit.selectStage(this, '新店')">
          <span class="opt-icon"><i data-lucide="sparkles" class="biz-icon" style="width:24px;height:24px;"></i></span>
          <span class="opt-name">新店（0-3月）</span>
        </div>
        <div class="shop-profile-option" data-value="成长期" onclick="DiagnosisShopEdit.selectStage(this, '成长期')">
          <span class="opt-icon"><i data-lucide="trending-up" class="biz-icon" style="width:24px;height:24px;"></i></span>
          <span class="opt-name">成长期（3月-2年）</span>
        </div>
        <div class="shop-profile-option" data-value="老店" onclick="DiagnosisShopEdit.selectStage(this, '老店')">
          <span class="opt-icon"><i data-lucide="store" class="biz-icon" style="width:24px;height:24px;"></i></span>
          <span class="opt-name">老店（2年+）</span>
        </div>
      </div>

      <button class="shop-profile-btn" id="editSaveBtn" onclick="DiagnosisShopEdit.save()">保存修改</button>
      <div class="shop-profile-footer" onclick="DiagnosisShopEdit.close()" style="cursor:pointer">取消</div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/biz-data.js"></script>
  <script src="js/data-service.js"></script>
  <script>
    /**
     * 诊断流程页面逻辑
     * 有店铺资料：1步流程（选症状）
     * 无店铺资料：3步流程（选行业 → 选阶段 → 选症状）
     */
    var DiagnosisPage = {
      currentStep: 1,
      hasShopProfile: false,
      shopProfile: null,
      state: {
        problemCode: '',
        industry: '',       // 大类（餐饮/零售/服务业），用于诊断匹配
        minorIndustry: '',  // 小类（奶茶/火锅等），用于展示
        stage: '',
        symptomIds: []
      },
      problems: [],
      stepLabels: [],
      stepPanels: [],

      industryNames: { 'catering': '餐饮', 'retail': '零售', 'service': '服务业', '餐饮': '餐饮', '零售': '零售', '服务业': '服务业', '通用': '通用' },
      stageNames: { 'new': '新店', 'growing': '成长期', 'mature': '老店', '新店': '新店', '成长期': '成长期', '老店': '老店' },

      init: function() {
        BizDataService.init();

        try {
          var profileStr = localStorage.getItem('biz_shop_profile');
          if (profileStr) {
            this.shopProfile = JSON.parse(profileStr);
            this.hasShopProfile = !!(this.shopProfile && this.shopProfile.industry);
          }
        } catch (e) {
          this.hasShopProfile = false;
        }

        if (this.hasShopProfile) {
          this.stepLabels = ['选症状'];
          this.stepPanels = ['step4'];
        } else {
          this.stepLabels = ['选行业', '选阶段', '选症状'];
          this.stepPanels = ['step2', 'step3', 'step4'];
        }

        var problemCode = BizUtils.getParam('problem');

        var savedState = BizUtils.loadDiagnosisState();
        if (savedState && savedState.problemCode === problemCode) {
          this.state = savedState;
          this.currentStep = savedState.currentStep || 1;
        } else {
          this.state = {
            problemCode: problemCode || '',
            industry: '',
            minorIndustry: '',
            stage: '',
            symptomIds: [],
            currentStep: 1
          };
        }

        if (!this.state.problemCode) {
          window.location.href = 'index.html';
          return;
        }

        if (this.hasShopProfile && !this.state.industry) {
          var shopIndustry = this.shopProfile.industry;
          // industry 字段现在直接是大类（餐饮/零售/服务业）
          this.state.industry = this.industryNames[shopIndustry] || shopIndustry;
          // minorIndustry 是小类（奶茶/火锅等）
          if (this.shopProfile.minorIndustry) {
            this.state.minorIndustry = this.shopProfile.minorIndustry;
          }
        }
        if (this.hasShopProfile && !this.state.stage) {
          this.state.stage = this.stageNames[this.shopProfile.stage] || this.shopProfile.stage;
        }

        this.problems = BizData.problems;
        this.render();
      },

      getPanelId: function(logicalStep) {
        return this.stepPanels[logicalStep - 1] || 'step1';
      },

      getLastStep: function() {
        return this.stepLabels.length;
      },

      render: function() {
        this.renderSteps();
        this.renderStep2();
        this.renderStep3();
        this.renderStep4();
        this.showStep(this.currentStep);
        this.updateFooter();
        // 初始化静态图标
        document.getElementById('btnBack').innerHTML = BizUtils.icon('chevron-left', 16) + ' 返回';
        document.getElementById('checkIcon').innerHTML = BizUtils.icon('check-circle', 32);
        BizUtils.replaceIcons();
      },

      renderSteps: function() {
        var bar = document.getElementById('stepsBar');
        var html = '';
        for (var i = 0; i < this.stepLabels.length; i++) {
          var stepNum = i + 1;
          var cls = '';
          if (stepNum < this.currentStep) cls = 'completed';
          else if (stepNum === this.currentStep) cls = 'current';
          html += '<div class="biz-step ' + cls + '">' +
            '<span class="biz-step-dot">' + (stepNum < this.currentStep ? '✓' : stepNum) + '</span>' +
            '<span class="biz-step-label">' + this.stepLabels[i] + '</span>' +
          '</div>';
          if (i < this.stepLabels.length - 1) {
            var lineClass = stepNum < this.currentStep ? ' completed' : '';
            html += '<div class="biz-step-line' + lineClass + '"></div>';
          }
        }
        bar.innerHTML = html;
        BizUtils.replaceIcons();
      },

      // 查找行业小类条目
      findIndustryItem: function(code) {
        var industries = BizLocalData.industries;
        for (var i = 0; i < industries.length; i++) {
          if (industries[i].code === code) return industries[i];
        }
        return null;
      },

      // 步骤2：选择行业（先选大类，再选小类）
      renderStep2: function() {
        var panel = document.getElementById('step2');
        var self = this;
        var majorIndustries = BizLocalData.majorIndustries;
        var selectedMajor = this.state.industry;

        var html = '<div class="step-heading">' +
            '<h2>你是什么行业？</h2>' +
            '<p>先选大类，再选细分</p>' +
          '</div>';

        // 第一行：大类选择（3个大卡片）
        html += '<div class="select-grid-3" style="margin-bottom:16px;">';
        for (var i = 0; i < majorIndustries.length; i++) {
          var mi = majorIndustries[i];
          var active = selectedMajor === mi.code ? ' active' : '';
          html += '<div class="biz-select-card' + active + '" onclick="DiagnosisPage.selectMajorIndustry(\'' + mi.code + '\')">' +
            '<span class="biz-select-icon">' + BizUtils.icon(mi.icon, 28) + '</span>' +
            '<span class="biz-select-label">' + mi.name + '</span>' +
          '</div>';
        }
        html += '</div>';

        // 第二行：如果已选大类，显示对应小类
        if (selectedMajor) {
          var minors = BizLocalData.industries.filter(function(ind) {
            return ind.majorCategory === selectedMajor && ind.code !== '通用';
          });
          if (minors.length > 0) {
            html += '<div style="margin-bottom:8px;font-size:13px;color:var(--biz-text-tertiary);font-weight:600;">选择细分行业（可选）</div>';
            html += '<div class="diagnosis-industry-grid">';
            for (var k = 0; k < minors.length; k++) {
              var item = minors[k];
              var minorActive = self.state.minorIndustry === item.code ? ' active' : '';
              html += '<div class="biz-select-card compact' + minorActive + '" onclick="DiagnosisPage.selectMinorIndustry(\'' + item.code + '\')">' +
                '<span class="biz-select-icon">' + BizUtils.icon(item.icon, 18) + '</span>' +
                '<span class="biz-select-label">' + item.name + '</span>' +
              '</div>';
            }
            html += '</div>';
          }
        }

        panel.innerHTML = html;
        BizUtils.replaceIcons();
      },

      selectMajorIndustry: function(code) {
        this.state.industry = code;
        // 切换大类时清空小类
        this.state.minorIndustry = '';
        this.saveState();
        this.renderStep2();
        this.updateFooter();
      },

      selectMinorIndustry: function(code) {
        this.state.minorIndustry = code;
        this.saveState();
        this.renderStep2();
      },

      // 步骤3：选择经营阶段（精简：去掉desc）
      renderStep3: function() {
        var panel = document.getElementById('step3');
        var stages = BizLocalData.stages;
        var self = this;
        var stageIconMap = { '新店': 'sparkles', '成长期': 'trending-up', '老店': 'store' };
        var html =
          '<div class="step-heading">' +
            '<h2>你的店开了多久？</h2>' +
            '<p>不同阶段，不同挑战</p>' +
          '</div>' +
          '<div class="select-grid-3">';
        for (var i = 0; i < stages.length; i++) {
          var st = stages[i];
          var active = self.state.stage === st.code ? ' active' : '';
          var iconName = stageIconMap[st.code] || st.icon;
          html += '<div class="biz-select-card' + active + '" data-code="' + st.code + '" onclick="DiagnosisPage.selectStage(\'' + st.code + '\')">' +
            '<span class="biz-select-icon">' + BizUtils.icon(iconName, 28) + '</span>' +
            '<span class="biz-select-label">' + st.name + '</span>' +
          '</div>';
        }
        html += '</div>';
        panel.innerHTML = html;
        BizUtils.replaceIcons();
      },

      // 步骤4：选择具体症状
      renderStep4: function() {
        var panel = document.getElementById('step4');
        var symptoms = this.getFilteredSymptoms();
        var self = this;

        var contextBar = '';
        if (this.hasShopProfile) {
          var industryLabel = this.industryNames[this.state.industry] || this.state.industry;
          var stageLabel = this.stageNames[this.state.stage] || this.state.stage;
          var problem = this.getProblem(this.state.problemCode);
          var problemLabel = problem ? problem.name : '';
          contextBar =
            '<div class="diagnosis-context-bar">' +
              '<span class="ctx-label">当前：' + industryLabel + ' · ' + stageLabel + ' · ' + problemLabel + '</span>' +
              '<a class="diagnosis-context-link" href="javascript:void(0)" onclick="DiagnosisShopEdit.open()">修改</a>' +
            '</div>';
        }

        if (symptoms.length === 0) {
          panel.innerHTML = contextBar +
            '<div class="step-heading">' +
              '<h2>选择具体症状</h2>' +
              '<p>可多选</p>' +
            '</div>' +
            '<div class="biz-empty"><span class="biz-empty-icon">' + BizUtils.icon('clipboard-list', 40) + '</span><p class="biz-empty-text">暂无匹配的症状选项</p></div>';
          BizUtils.replaceIcons();
          return;
        }

        var html = contextBar +
          '<div class="step-heading">' +
            '<h2>选择具体症状</h2>' +
            '<p>可多选，选得越准诊断越精准</p>' +
          '</div>' +
          '<div class="symptom-list">';

        for (var i = 0; i < symptoms.length; i++) {
          var s = symptoms[i];
          var active = self.state.symptomIds.indexOf(s._id) !== -1 ? ' active' : '';
          html += '<div class="symptom-item' + active + '" data-id="' + s._id + '" onclick="DiagnosisPage.toggleSymptom(\'' + s._id + '\')">' +
            '<span class="symptom-check">✓</span>' +
            '<span class="symptom-name">' + s.name + '</span>' +
          '</div>';
        }
        html += '</div>';
        panel.innerHTML = html;
        BizUtils.replaceIcons();
      },

      renderSelectedTags: function() {
        var html = '';
        var allSymptoms = BizData.symptoms[this.state.problemCode] || [];
        var selectedIds = this.state.symptomIds;
        for (var i = 0; i < selectedIds.length; i++) {
          var s = this.findSymptom(allSymptoms, selectedIds[i]);
          if (s) {
            html += '<span class="selected-tag">' + s.name + '</span>';
          }
        }
        return html;
      },

      getFilteredSymptoms: function() {
        var allSymptoms = BizData.symptoms[this.state.problemCode] || [];
        var industry = this.state.industry;
        var stage = this.state.stage;
        var result = [];
        for (var i = 0; i < allSymptoms.length; i++) {
          var s = allSymptoms[i];
          var industryMatch = s.industryFilter.indexOf('all') !== -1 || s.industryFilter.indexOf(industry) !== -1;
          var stageMatch = s.stageFilter.indexOf('all') || s.stageFilter.indexOf(stage) !== -1;
          if (industryMatch && stageMatch) {
            result.push(s);
          }
        }
        return result;
      },

      selectStage: function(code) {
        this.state.stage = code;
        this.saveState();
        this.renderStep3();
        this.updateFooter();
      },

      toggleSymptom: function(id) {
        var idx = this.state.symptomIds.indexOf(id);
        if (idx !== -1) {
          this.state.symptomIds.splice(idx, 1);
        } else {
          this.state.symptomIds.push(id);
        }
        this.saveState();
        this.renderStep4();
        this.updateFooter();
      },

      showStep: function(logicalStep) {
        var allPanels = ['step2', 'step3', 'step4'];
        for (var i = 0; i < allPanels.length; i++) {
          var p = document.getElementById(allPanels[i]);
          if (p) {
            p.classList.remove('active', 'slide-left');
            p.style.display = 'none';
          }
        }
        var targetId = this.getPanelId(logicalStep);
        var target = document.getElementById(targetId);
        if (target) {
          target.style.display = 'block';
          target.classList.add('active');
        }
      },

      updateFooter: function() {
        var btnPrev = document.getElementById('btnPrev');
        var btnNext = document.getElementById('btnNext');
        var lastStep = this.getLastStep();

        btnPrev.style.display = this.currentStep > 1 ? '' : 'none';

        if (this.currentStep === lastStep) {
          btnNext.textContent = '开始诊断';
          btnNext.className = 'biz-btn biz-btn-accent';
          if (this.state.symptomIds.length === 0) {
            btnNext.disabled = true;
            btnNext.style.opacity = '0.5';
          } else {
            btnNext.disabled = false;
            btnNext.style.opacity = '1';
          }
        } else {
          btnNext.textContent = '下一步';
          btnNext.className = 'biz-btn biz-btn-primary';
          btnNext.disabled = false;
          btnNext.style.opacity = '1';
        }

        if (!this.hasShopProfile) {
          if (this.currentStep === 1 && !this.state.industry) {
            btnNext.disabled = true;
            btnNext.style.opacity = '0.5';
          } else if (this.currentStep === 2 && !this.state.stage) {
            btnNext.disabled = true;
            btnNext.style.opacity = '0.5';
          }
        }
      },

      goNext: function() {
        var lastStep = this.getLastStep();

        if (!this.hasShopProfile) {
          if (this.currentStep === 1 && !this.state.industry) {
            BizUtils.showToast('请选择你的行业');
            return;
          }
          if (this.currentStep === 2 && !this.state.stage) {
            BizUtils.showToast('请选择经营阶段');
            return;
          }
        }
        if (this.currentStep === lastStep && this.state.symptomIds.length === 0) {
          BizUtils.showToast('请至少选择一个症状');
          return;
        }
        if (this.currentStep === lastStep) {
          this.startDiagnosis();
          return;
        }

        this.currentStep++;
        this.state.currentStep = this.currentStep;

        var symptomPanelId = this.getPanelId(lastStep);
        var currentPanelId = this.getPanelId(this.currentStep);
        if (currentPanelId === symptomPanelId) {
          var validSymptoms = this.getFilteredSymptoms();
          var validIds = validSymptoms.map(function(s) { return s._id; });
          this.state.symptomIds = this.state.symptomIds.filter(function(id) {
            return validIds.indexOf(id) !== -1;
          });
          this.renderStep4();
        }

        this.saveState();
        this.renderSteps();
        this.showStep(this.currentStep);
        this.updateFooter();
      },

      goPrev: function() {
        if (this.currentStep <= 1) return;
        this.currentStep--;
        this.state.currentStep = this.currentStep;
        this.saveState();
        this.renderSteps();

        var targetId = this.getPanelId(this.currentStep);
        var target = document.getElementById(targetId);
        if (target) {
          target.style.display = 'block';
          target.classList.add('active', 'slide-left');
        }

        this.updateFooter();
      },

      goBack: function() {
        if (this.currentStep > 1) {
          this.goPrev();
        } else {
          BizUtils.clearDiagnosisState();
          window.location.href = 'solutions.html';
        }
      },

      startDiagnosis: function() {
        var self = this;

        var matchedPath = this.matchDiagnosisPath(
          this.state.problemCode,
          this.state.industry,
          this.state.stage,
          this.state.symptomIds
        );

        var problem = this.getProblem(this.state.problemCode);
        var problemName = problem ? problem.name : '';

        var industryName = this.industryNames[this.state.industry] || this.state.industry;
        var stageName = this.stageNames[this.state.stage] || this.state.stage;

        var allSymptoms = BizData.symptoms[this.state.problemCode] || [];
        var selectedSymptomNames = [];
        for (var i = 0; i < this.state.symptomIds.length; i++) {
          var s = this.findSymptom(allSymptoms, this.state.symptomIds[i]);
          if (s) selectedSymptomNames.push(s.name);
        }

        var diagnosisResult = {
          path: matchedPath,
          problemName: problemName,
          industry: industryName,
          stage: stageName,
          selectedSymptoms: selectedSymptomNames
        };

        try {
          sessionStorage.setItem('biz_diagnosis_result', JSON.stringify(diagnosisResult));
        } catch (e) {
          console.warn('[Diagnosis] 保存诊断结果失败', e);
        }

        var overlay = document.getElementById('diagnosisOverlay');
        var ring = document.getElementById('progressRing');
        var checkIcon = document.getElementById('checkIcon');

        overlay.classList.add('show');
        checkIcon.classList.remove('show');

        setTimeout(function() {
          ring.style.strokeDashoffset = '0';
        }, 50);

        setTimeout(function() {
          checkIcon.classList.add('show');
          document.getElementById('overlayText').textContent = '诊断完成！';
        }, 2000);

        setTimeout(function() {
          self.state.recordId = BizUtils.genId();
          BizUtils.saveDiagnosisState(self.state);
          window.location.href = 'result.html';
        }, 3000);
      },

      matchDiagnosisPath: function(problemCode, industry, stage, symptomIds) {
        var paths = BizData.diagnosisPaths || [];

        var matched = [];
        for (var i = 0; i < paths.length; i++) {
          if (paths[i].problemCode === problemCode) {
            matched.push(paths[i]);
          }
        }

        if (matched.length === 0) return null;

        var industryMatched = [];
        for (var i = 0; i < matched.length; i++) {
          if (matched[i].industry === industry || matched[i].industry === 'all') {
            industryMatched.push(matched[i]);
          }
        }
        if (industryMatched.length === 0) industryMatched = matched;

        var stageMatched = [];
        for (var i = 0; i < industryMatched.length; i++) {
          if (industryMatched[i].stage === stage || industryMatched[i].stage === 'all') {
            stageMatched.push(industryMatched[i]);
          }
        }
        if (stageMatched.length === 0) stageMatched = industryMatched;

        var scored = [];
        for (var i = 0; i < stageMatched.length; i++) {
          var path = stageMatched[i];
          var score = path.priority || 0;

          var pathSymptomIds = path.symptomIds || [];
          var intersection = 0;
          for (var j = 0; j < pathSymptomIds.length; j++) {
            if (symptomIds.indexOf(pathSymptomIds[j]) !== -1) {
              intersection++;
            }
          }
          score += intersection * 100;

          if (path.industry === industry) score += 50;
          if (path.stage === stage) score += 30;

          scored.push({ path: path, score: score });
        }

        scored.sort(function(a, b) { return b.score - a.score; });

        if (scored.length > 0 && scored[0].score > 0) {
          return scored[0].path;
        }

        for (var i = 0; i < matched.length; i++) {
          if (matched[i].industry === 'all' && matched[i].stage === 'all') {
            return matched[i];
          }
        }

        return matched[0] || null;
      },

      saveState: function() {
        this.state.currentStep = this.currentStep;
        BizUtils.saveDiagnosisState(this.state);
      },

      getProblem: function(code) {
        for (var i = 0; i < this.problems.length; i++) {
          if (this.problems[i].code === code) return this.problems[i];
        }
        return null;
      },

      findSymptom: function(symptoms, id) {
        for (var i = 0; i < symptoms.length; i++) {
          if (symptoms[i]._id === id) return symptoms[i];
        }
        return null;
      }
    };

    // 店铺资料编辑弹窗
    var DiagnosisShopEdit = {
      selectedIndustry: '',
      selectedStage: '',

      open: function() {
        var profile = this.getProfile();
        this.selectedIndustry = profile ? (profile.industry || '') : '';
        this.selectedStage = profile ? (profile.stage || '') : '';

        document.getElementById('editShopName').value = profile ? (profile.shopName || '') : '';

        var industryOptions = document.querySelectorAll('#editIndustryOptions .shop-profile-option');
        for (var i = 0; i < industryOptions.length; i++) {
          industryOptions[i].classList.remove('selected');
          if (industryOptions[i].getAttribute('data-value') === this.selectedIndustry) {
            industryOptions[i].classList.add('selected');
          }
        }

        var stageOptions = document.querySelectorAll('#editStageOptions .shop-profile-option');
        for (var i = 0; i < stageOptions.length; i++) {
          stageOptions[i].classList.remove('selected');
          if (stageOptions[i].getAttribute('data-value') === this.selectedStage) {
            stageOptions[i].classList.add('selected');
          }
        }

        document.getElementById('shopProfileOverlay').classList.add('show');
        BizUtils.replaceIcons();
      },

      close: function() {
        document.getElementById('shopProfileOverlay').classList.remove('show');
      },

      selectIndustry: function(el, value) {
        this.selectedIndustry = value;
        var options = document.querySelectorAll('#editIndustryOptions .shop-profile-option');
        for (var i = 0; i < options.length; i++) {
          options[i].classList.remove('selected');
        }
        el.classList.add('selected');
      },

      selectStage: function(el, value) {
        this.selectedStage = value;
        var options = document.querySelectorAll('#editStageOptions .shop-profile-option');
        for (var i = 0; i < options.length; i++) {
          options[i].classList.remove('selected');
        }
        el.classList.add('selected');
      },

      save: function() {
        if (!this.selectedIndustry) {
          BizUtils.showToast('请选择行业');
          return;
        }
        var shopName = document.getElementById('editShopName').value.trim();
        var existing = this.getProfile();
        var profile = {
          shopName: shopName,
          industry: this.selectedIndustry,
          stage: this.selectedStage,
          createdAt: existing ? existing.createdAt : new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        localStorage.setItem('biz_shop_profile', JSON.stringify(profile));
        this.close();

        // 更新诊断页面的店铺资料和状态
        DiagnosisPage.shopProfile = profile;
        DiagnosisPage.hasShopProfile = true;
        DiagnosisPage.state.industry = DiagnosisPage.industryNames[this.selectedIndustry] || this.selectedIndustry;
        DiagnosisPage.state.stage = DiagnosisPage.stageNames[this.selectedStage] || this.selectedStage;
        BizUtils.saveDiagnosisState(DiagnosisPage.state);
        DiagnosisPage.render();

        BizUtils.showToast('店铺信息已更新');
      },

      getProfile: function() {
        try {
          var str = localStorage.getItem('biz_shop_profile');
          return str ? JSON.parse(str) : null;
        } catch (e) {
          return null;
        }
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      DiagnosisPage.init();
    });
  </script>
